[package]
name = "meshctld"
description = "A lean control panel for your mesh radios"
readme = "../README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords = ["meshtastic", "mesh", "lora", "radio"]
categories = ["web-programming::http-server"]
publish = false

[[bin]]
name = "meshctld"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "ws"] }
clap = { version = "4", features = ["derive", "env"] }
meshctl-api = { workspace = true, features = ["openapi"] }
meshctl-core.workspace = true
meshctl-proto.workspace = true
prost.workspace = true
prost-reflect = { version = "0.16", features = ["serde"] }
# Fresh channel keys, when one is asked for.
getrandom = "0.4"
# Channel keys as the apps show them, given and asked for.
base64 = "0.22"
# A MeshCore contact's name in its link, as the apps read it.
form_urlencoded = "1"
# The date and time an automatic reply tells, in the machine's time zone,
# or in TZ's: with the zones within, for a container that has none.
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system", "tzdb-bundle-always", "tzdb-zoneinfo"] }
# Fingerprints of channels, to tell where each went.
sha2 = "0.10"
# A reaction is one emoji: one grapheme, as the MeshCore apps tell it.
unicode-segmentation = "1"
# The interface trunk builds into web/dist. When it has not been built the
# binary still compiles, and says so at the address the interface would be.
rust-embed = { version = "8", features = ["mime-guess"] }
serde.workspace = true
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-none", "sqlite", "macros", "migrate"] }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
utoipa = "6"
utoipa-axum = "0.3"
utoipa-scalar = { version = "0.4", features = ["axum"] }

[dev-dependencies]
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
http-body-util = "0.1"
tempfile = "3"
# Only to call the router the way axum does, with `ServiceExt::oneshot`.
tower = { version = "0.5", default-features = false, features = ["util"] }
# A WebSocket client, to talk to the event stream the way a client would.
tokio-tungstenite = "0.29"
