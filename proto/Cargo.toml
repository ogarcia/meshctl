[package]
name = "meshctl-proto"
description = "Meshtastic protobufs and stream framing for meshctl"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[dependencies]
bytes = "1"
prost.workspace = true
# Messages read and written by their description: settings shown and changed
# field by field, with what the protobufs say of each.
prost-reflect = "0.16"
tracing.workspace = true

[build-dependencies]
prost-build = "0.14"
# Parses the .proto files in Rust, so neither a developer, the CI runner nor the
# container build has to have protoc installed, or the right version of it.
protox = "0.10"
