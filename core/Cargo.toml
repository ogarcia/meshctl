[package]
name = "meshctl-core"
description = "Radio link and domain model for meshctl"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[dependencies]
meshctl-proto.workspace = true
prost-reflect = "0.16"
prost.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
# Without libudev: it is only for listing ports with their USB details, which
# a path given in the configuration does not need, and it would keep a static
# musl build from linking.
tokio-serial = { version = "5", default-features = false }
tracing.workspace = true
# MeshCore companion radios. The published crate: the fork that names the
# connecting app is not pushed yet, so APP_START is put together here.
# BLE stays off, as it would pull in D-Bus and keep a static musl build from
# linking.
meshcore-rs = { version = "0.2", default-features = false, features = ["serial", "tcp"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }
