name: Container

on:
  push:
    branches: [master]
    # Bare semver tags: 0.1.0, 1.2.3-rc1 (no "v" prefix)
    tags: ["[0-9]*"]
    # Only what builds nothing: Markdown at the top (not intro.md, which the
    # API's docs embed), the licence, what git ignores, the website.
    paths-ignore:
      - "*.md"
      - "LICENSE"
      - ".gitignore"
      - "website/**"
  pull_request:
    paths:
      - "Containerfile"
      - ".dockerignore"
      - "versions.env"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "proto/**"
      - "core/**"
      - "api/**"
      - "server/**"
      - "web/**"
      - ".github/workflows/container.yml"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Build-tool/base-image versions (TRUNK_VERSION, ALPINE_VERSION, …) come from
  # versions.env, loaded into $GITHUB_ENV by the "Load build versions" step in
  # each job below.

# Least-privilege default for GITHUB_TOKEN; the image job raises it to
# `packages: write` to push to ghcr.io.
permissions:
  contents: read

jobs:
  # ── The interface, once: web/dist, the same for every platform ───────────
  # WebAssembly and what goes with it, which each binary below embeds as it
  # is compiled: built here alone, and handed to them.
  web:
    name: Build the interface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Load build versions
        shell: bash
        run: grep -E '^[A-Za-z_]+=' versions.env >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          key: web

      - name: Install trunk
        uses: taiki-e/install-action@v2
        with:
          tool: trunk@${{ env.TRUNK_VERSION }}

      - name: Build the interface
        run: cd web && trunk build --release

      - uses: actions/upload-artifact@v7
        with:
          name: interface
          path: web/dist/
          if-no-files-found: error
          retention-days: 1

  # ── Compile the binary once per arch (native runners) ──────────────────────
  build:
    name: Compile binary (${{ matrix.arch }})
    needs: web
    runs-on: ${{ matrix.os }}
    # aarch64 musl is a cross build from the arm runner's gnu host, so the cc
    # crate looks for aarch64-linux-musl-gcc (not shipped by musl-tools) to
    # build SQLite. Point its C compiler and the linker at musl-gcc. These vars
    # are target-scoped, so they are inert for the x86_64 job.
    env:
      CC_aarch64_unknown_linux_musl: musl-gcc
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - arch: arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v7

      - name: Load build versions
        shell: bash
        run: grep -E '^[A-Za-z_]+=' versions.env >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch }}

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools musl-dev

      # The interface, built once above: web/dist, which the daemon embeds
      # as it is compiled.
      - uses: actions/download-artifact@v8
        with:
          name: interface
          path: web/dist

      - name: Build the daemon
        run: |
          cargo build --release --locked --target ${{ matrix.target }} -p meshctld
          mkdir -p dist/${{ matrix.arch }}
          cp target/${{ matrix.target }}/release/meshctld dist/${{ matrix.arch }}/

      - uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.arch }}
          path: dist/
          retention-days: 1

  # ── The image (tag: master / 0.1.0 / 0.1 / latest) ─────────────────────────
  image:
    name: Build image
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Load build versions
        shell: bash
        run: grep -E '^[A-Za-z_]+=' versions.env >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v8
        with:
          pattern: binaries-*
          path: dist/
          merge-multiple: true

      # QEMU lets buildx run the emulated bits of the non-native platform — here
      # only the runtime stage's `adduser`/`addgroup` (a few seconds); the binary
      # is pre-compiled, so nothing heavy runs under emulation.
      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            BUILDER=prebuilt
            ALPINE_VERSION=${{ env.ALPINE_VERSION }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
