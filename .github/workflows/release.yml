name: Release

on:
  push:
    # Bare semver tags: 0.1.0, 0.1.1, 1.2.3-rc.1 (no "v" prefix).
    tags: ["[0-9]*.[0-9]*.[0-9]*"]
  # By hand, to try the whole pipeline without publishing anything: the
  # archives land on the run, to be downloaded, and the release job below
  # runs only for a tag.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Build-tool versions (TRUNK_VERSION, …) come from versions.env, loaded into
  # $GITHUB_ENV by the "Load build versions" step in each job below.

# Least-privilege default for GITHUB_TOKEN; the release job raises it to
# `contents: write` to publish the release.
permissions:
  contents: read

jobs:
  # ── The interface, once: web/dist, the same for every platform ───────────
  # WebAssembly and what goes with it, which each binary below embeds as it
  # is compiled: built here alone, and handed to them.
  web:
    name: Build the interface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Load build versions
        shell: bash
        run: grep -E '^[A-Za-z_]+=' versions.env >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          key: web

      - name: Install trunk
        uses: taiki-e/install-action@v2
        with:
          tool: trunk@${{ env.TRUNK_VERSION }}

      - name: Build the interface
        run: cd web && trunk build --release

      - uses: actions/upload-artifact@v7
        with:
          name: interface
          path: web/dist/
          if-no-files-found: error
          retention-days: 1

  # ── The daemon, with its interface embedded, once per target ───────────────
  build:
    name: Build ${{ matrix.target }}
    needs: web
    runs-on: ${{ matrix.os }}
    # aarch64 musl is a cross build from the arm runner's gnu host, so the cc
    # crate looks for aarch64-linux-musl-gcc (not shipped by musl-tools) to
    # build SQLite. Point its C compiler and the linker at musl-gcc. These vars
    # are target-scoped, so they are inert for every other job.
    env:
      CC_aarch64_unknown_linux_musl: musl-gcc
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          # Both from the ARM runner: Apple's toolchain builds for Intel too.
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Load build versions
        shell: bash
        run: grep -E '^[A-Za-z_]+=' versions.env >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install musl tools
        if: contains(matrix.target, 'linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools musl-dev

      # The interface, built once above: web/dist, which the daemon embeds
      # as it is compiled.
      - uses: actions/download-artifact@v8
        with:
          name: interface
          path: web/dist

      - name: Build the daemon
        run: cargo build --release --locked --target ${{ matrix.target }} -p meshctld

      - name: Package
        shell: bash
        run: |
          NAME=meshctl-${{ github.ref_name }}-${{ matrix.target }}
          mkdir "$NAME"
          cp target/${{ matrix.target }}/release/meshctld LICENSE README.md "$NAME"/
          tar -czf "$NAME.tar.gz" "$NAME"
          echo "ARCHIVE=$NAME.tar.gz" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          name: meshctl-${{ matrix.target }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error

  # ── The desktop app for Windows, portable: a ZIP to unzip and run ─────────
  # What it keeps goes beside meshctl.exe, so the folder carries it all. It
  # takes WebView2, which Windows 10 and 11 have.
  windows:
    name: Build Windows desktop (portable)
    needs: web
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Load build versions
        shell: bash
        run: grep -E '^[A-Za-z_]+=' versions.env >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-desktop

      # The interface, built once above: web/dist, which the daemon embeds
      # as it is compiled.
      - uses: actions/download-artifact@v8
        with:
          name: interface
          path: web/dist

      # With the target named, so that the C runtime is linked statically in
      # the program alone (see .cargo/config.toml).
      - name: Build the desktop app
        run: cargo build --release --locked -p meshctl-desktop --target x86_64-pc-windows-msvc

      - name: Package
        shell: pwsh
        run: |
          $name = "meshctl-${{ github.ref_name }}-windows-x86_64-portable"
          New-Item -ItemType Directory -Force $name | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/meshctl-desktop.exe "$name/meshctl.exe"
          Copy-Item LICENSE "$name/LICENSE.txt"
          @"
          meshctl, portable.

          Unzip this folder somewhere you can write to (the Desktop, Documents;
          not Program Files) and run meshctl.exe. What it keeps goes into the
          data folder beside it: removing the folder removes it all.

          Closing its window keeps it running, and listening to your radios, in
          the tray by the clock: Quit there stops it. meshcore:// links open in
          it, to add the node or channel they hold.

          It needs Microsoft Edge's WebView2, which Windows 10 and 11 have.

          https://meshctl.ogarcia.me
          "@ | Set-Content -Encoding UTF8 "$name/README.txt"
          Compress-Archive -Path $name -DestinationPath "$name.zip" -Force
          "ARCHIVE=$name.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: actions/upload-artifact@v7
        with:
          name: meshctl-windows
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error

  # ── The desktop app for Linux, as a Flatpak of its own ─────────────────────
  # The release binary, built here as desktop/flatpak/build.sh does, packed by
  # flatpak-builder into one .flatpak file. On Ubuntu 24.04, whose glibc the
  # GNOME runtime's is not older than; the runtime's version comes from the
  # manifest, so that the two do not drift.
  flatpak:
    name: Build Linux desktop (Flatpak)
    needs: web
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Load build versions
        shell: bash
        run: grep -E '^[A-Za-z_]+=' versions.env >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-flatpak

      # WebKitGTK's development files, to link the desktop app.
      - name: Install Tauri's system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev librsvg2-dev libdbus-1-dev build-essential

      # The interface, built once above: web/dist, which the daemon embeds
      # as it is compiled.
      - uses: actions/download-artifact@v8
        with:
          name: interface
          path: web/dist

      - name: Build the desktop app
        run: cargo build --release --locked -p meshctl-desktop

      # Ubuntu 24.04 keeps unprivileged user namespaces to AppArmor, which
      # stops bubblewrap, and so flatpak-builder: let them be.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install Flatpak and the GNOME runtime
        run: |
          sudo apt-get install -y flatpak flatpak-builder
          GNOME=$(grep '^runtime-version:' desktop/flatpak/me.ogarcia.meshctl.yml | grep -oE '[0-9]+')
          flatpak remote-add --if-not-exists --user flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install -y --user flathub "org.gnome.Platform//$GNOME" "org.gnome.Sdk//$GNOME"

      - name: Build the bundle
        shell: bash
        run: |
          flatpak-builder --user --force-clean --repo=repo build-dir \
            desktop/flatpak/me.ogarcia.meshctl.yml
          BUNDLE=meshctl-${{ github.ref_name }}-linux-x86_64.flatpak
          flatpak build-bundle repo "$BUNDLE" me.ogarcia.meshctl
          echo "ARCHIVE=$BUNDLE" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          name: meshctl-flatpak
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error

  # ── The Android app, an APK for each of phones' ARMs ──────────────────────
  # ARM64, nearly every phone; ARM, 32 bits, older or cheaper ones, which
  # may well be the ones given to the mesh.
  # Signed with the key in the ANDROID_KEYSTORE secret (the .jks, in base64)
  # and its password in ANDROID_KEYSTORE_PASSWORD, written where Gradle looks
  # for them (see desktop/gen/android/app/build.gradle.kts). A tag needs
  # them: phones take no update signed with another key. Run by hand without
  # them, the APK comes out unsigned. Its version code is the day it is
  # built on.
  android:
    name: Build Android app
    needs: web
    runs-on: ubuntu-latest
    steps:
      # Every tag, to number the build by the releases before it.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Load build versions
        shell: bash
        run: grep -E '^[A-Za-z_]+=' versions.env >> "$GITHUB_ENV"

      # The versionCode: the day of the tagged commit, in UTC, and a last
      # digit for the releases tagged before it that day, so that a second
      # one the same day comes as an update.
      - name: Number the build
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          export TZ=UTC
          day=$(git log -1 --format=%cd --date=format-local:%Y%m%d)
          n=$(git for-each-ref refs/tags --format='%(creatordate:format-local:%Y%m%d)' | grep -c "^$day$")
          if [ "$n" -gt 10 ]; then
            echo "::error::Eleven releases on $day: the versionCode has one digit for them."
            exit 1
          fi
          echo "MESHCTL_VERSION_CODE=$day$((n - 1))" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      # The crates downloaded, not what was built: Tauri's build scripts
      # write the Android project's Gradle and Kotlin files into the
      # checkout, gitignored, and a target restored from the cache does not
      # run them again.
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
          cache-targets: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Install the Tauri CLI
        uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli@${{ env.TAURI_CLI_VERSION }}

      # The runner has the SDK; the NDK, the one the app is built with.
      - name: Install the NDK
        run: |
          echo y | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      # The interface, built once above: web/dist, which the daemon embeds
      # as it is compiled.
      - uses: actions/download-artifact@v8
        with:
          name: interface
          path: web/dist

      - name: Write the signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              echo "::error::No signing key: ANDROID_KEYSTORE and ANDROID_KEYSTORE_PASSWORD are needed to release."
              exit 1
            fi
            echo "::warning::No signing key: the APK comes out unsigned."
            exit 0
          fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/meshctl.jks"
          printf 'storeFile=%s\nkeyAlias=meshctl\npassword=%s\n' \
            "$RUNNER_TEMP/meshctl.jks" "$KEYSTORE_PASSWORD" \
            > desktop/gen/android/keystore.properties

      - name: Build the app
        run: |
          cd desktop
          cargo tauri android build --ci --apk --split-per-abi --target aarch64 --target armv7

      - name: Package
        shell: bash
        run: |
          OUT=desktop/gen/android/app/build/outputs/apk
          cp "$OUT"/arm64/release/app-arm64-release*.apk meshctl-${{ github.ref_name }}-android-arm64.apk
          cp "$OUT"/arm/release/app-arm-release*.apk meshctl-${{ github.ref_name }}-android-arm.apk

      - uses: actions/upload-artifact@v7
        with:
          name: meshctl-android
          path: meshctl-*-android-*.apk
          if-no-files-found: error

  # ── The release, with every archive and their checksums ────────────────────
  release:
    name: GitHub release
    needs: [build, windows, flatpak, android]
    # Only for a tag: run by hand, this is skipped, and the archives stay on
    # the run.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: meshctl-*
          path: artifacts
          merge-multiple: true

      - name: Checksums
        run: cd artifacts && sha256sum * > SHA256SUMS

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          # A tag with a suffix (0.2.0-rc.1) is a prerelease.
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: artifacts/*
