[package]
name = "meshctl-api"
description = "The types meshctl's daemon and its clients exchange"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

# Kept light on purpose: this crate is compiled into the WASM interface and,
# later, into the TUI. Nothing here may pull in a runtime or I/O.
[dependencies]
serde.workspace = true
# Setting values, whatever their kind, as they travel.
serde_json = "1"
utoipa = { version = "6", optional = true }

[features]
# The OpenAPI schemas of these types. The daemon turns it on to document its
# API; clients have no use for it and leave it off.
openapi = ["dep:utoipa"]
