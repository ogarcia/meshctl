    <style>
      /*
       * Colours. The preferences come as attributes on <html>, put there by
       * the daemon as it serves the page and by the interface as they change:
       * data-theme (none to follow the system's), data-accent and
       * data-map-theme. The neutrals depend on the theme alone; the accent
       * sets --mc-primary, the text on it, and --mc-second, a colour that
       * stands apart from it (direct nodes, delivered marks). Another accent
       * is one more pair of blocks like amber's, light and dark.
       */
      :root {
        --mc-page: #f4f5f7;
        --mc-rail: #e8ebef;
        --mc-surface: #ffffff;
        --mc-surface-2: #f8f9fa;
        --mc-raised: #eef0f3;
        /* The radios' buttons on the rail: white on its grey, to stand out. */
        --mc-rail-button: #ffffff;
        --mc-rail-button-edge: #cfd5dc;
        --mc-border: #d8dde3;
        --mc-text: #161b22;
        --mc-muted: #57606a;
        --mc-ok: #16805f;
        --mc-warn: #9a6700;
        --mc-danger: #b42318;
        --mc-shadow: 0 12px 32px rgba(22, 27, 34, 0.14);
        --mc-map: #e9eef2;
        /* Nodes, by how far: their own colours, whatever the accent, sharp on
           any tile. Cool, and dimmer the further, with no red or orange to
           read as something wrong: teal, blue, violet, grey. */
        --mc-node-direct: #099268;
        --mc-node-near: #1971c2;
        --mc-node-mid: #7048e8;
        --mc-node-far: #6c757d;
        /*
         * Radios' buttons of the palette, as the rail's own and the accent: at
         * rest, a light tone with dark text here (a deep one with light text
         * on the dark theme); selected, -on, a deep one with light text here
         * (a vivid one with dark text there).
         */
        --mc-badge-ink: #161b22;
        --mc-badge-ink-on: #ffffff;
        --mc-badge-amber: #ffc078;
        --mc-badge-amber-on: #b35c00;
        --mc-badge-coral: #ffa8a8;
        --mc-badge-coral-on: #c92a2a;
        --mc-badge-pink: #faa2c1;
        --mc-badge-pink-on: #a61e4d;
        --mc-badge-grape: #e599f7;
        --mc-badge-grape-on: #862e9c;
        --mc-badge-violet: #b197fc;
        --mc-badge-violet-on: #5f3dc4;
        --mc-badge-blue: #74c0fc;
        --mc-badge-blue-on: #1864ab;
        --mc-badge-cyan: #66d9e8;
        --mc-badge-cyan-on: #0b7285;
        --mc-badge-teal: #63e6be;
        --mc-badge-teal-on: #087f5b;
        --mc-badge-lime: #c0eb75;
        --mc-badge-lime-on: #4a7a0b;
        --mc-badge-gray: #ced4da;

        --mc-font: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
        --mc-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
      }
      :root[data-theme="dark"] {
        --mc-page: #0e1116;

        --mc-surface: #12161c;

        --mc-badge-gray: #495057;

      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {

      }
      /* Amber, the default. */
      :root,
      :root[data-accent="amber"] {
        --mc-primary: #9a5b00;
        --mc-on-primary: #ffffff;
        --mc-second: #1f6fd1;
        --mc-chart-1: #9a5b00;
        --mc-chart-2: #1f6fd1;
      }
      :root[data-theme="dark"],
      :root[data-theme="dark"][data-accent="amber"] {
        --mc-primary: #f0a63a;
        --mc-on-primary: #1a1205;
        --mc-second: #5aa9ff;
        --mc-chart-1: #c98018;
        --mc-chart-2: #4a96ea;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]),
        :root:not([data-theme="light"])[data-accent="amber"] {
          --mc-primary: #f0a63a;
          --mc-on-primary: #1a1205;
          --mc-second: #5aa9ff;
          --mc-chart-1: #c98018;
          --mc-chart-2: #4a96ea;
        }
      }
      /* Worked out from the rest, so that each accent says only its own. */
      body {
        --mc-soft: color-mix(in srgb, var(--mc-primary) 16%, var(--mc-surface));
        --mc-near: color-mix(in srgb, var(--mc-second) 50%, var(--mc-surface));
        --mc-far: color-mix(in srgb, var(--mc-muted) 40%, var(--mc-surface));
        --mc-out: color-mix(in srgb, var(--mc-second) 22%, var(--mc-surface));
      }

      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        background: var(--mc-page);
        color: var(--mc-text);
        font: 14px/1.45 var(--mc-font);
      }
      button, input, select, textarea {
        font: inherit;
        color: inherit;
        background: var(--mc-raised);
        border: 1px solid var(--mc-border);
        border-radius: 8px;
        padding: 6px 12px;
      }
      button { cursor: pointer; }
      button:hover { border-color: var(--mc-primary); }
      /*
       * Focus, in the accent: a ring around what the keyboard is on, and the
       * edge of a field being written in. The browser's own controls (check
       * boxes, ranges) take the accent too.
       */
      :root { accent-color: var(--mc-primary); }
      :focus-visible { outline: 2px solid var(--mc-primary); outline-offset: 2px; }
      input:focus, select:focus, textarea:focus {
        outline: none;
        border-color: var(--mc-primary);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--mc-primary) 30%, transparent);
      }
      button:disabled { opacity: 0.6; cursor: default; }
      button.primary {
        background: var(--mc-primary);
        border-color: var(--mc-primary);
        color: var(--mc-on-primary);
        font-weight: 600;
      }
      button.danger:hover { border-color: var(--mc-danger); color: var(--mc-danger); }
      button.small { padding: 2px 8px; font-size: 12px; }
      input, select, textarea { background: var(--mc-page); }
      a { color: var(--mc-primary); text-decoration: none; }
      a:hover { text-decoration: underline; }
      svg { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

      /* The frame: the radios, the radio's pages, and the page. */
      .app {
        display: grid;
        grid-template-columns: 72px 264px minmax(0, 1fr);
        height: 100vh;
        height: 100dvh;
      }
      .rail {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        padding: 14px 0;
        background: var(--mc-rail);
        border-right: 1px solid var(--mc-border);
        overflow-y: auto;
      }
      .rail .logo { width: 26px; height: 26px; flex: none; stroke: var(--mc-primary); }
      .rail-rule { width: 32px; border-top: 1px solid var(--mc-border); margin: 2px 0; }
      .rail-space { flex: 1; }
      .rail-button {
        position: relative;
        flex: none;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 48px;
        height: 48px;
        padding: 0;
        border: 1px solid var(--mc-rail-button-edge);
        border-radius: 24px;
        background: var(--mc-rail-button);
        color: var(--mc-text);
        font-weight: 700;
        font-size: 13px;
        transition: border-radius 0.15s;
      }
      /*
       * One way for every button: at rest, its colour dimmed into the rail's
       * (the rail's own grey, with none); on hover, a ring in the accent, a
       * gap away so that it reads on any colour; selected, its colour in full
       * (the accent, with none), squared, and the pill on the rail's edge.
       */
      .rail-button:hover {
        border-radius: 14px;
        /* The ring alone: not the accent edge every other button takes. */
        border-color: var(--mc-rail-button-edge);
        outline: 2px solid var(--mc-primary);
        outline-offset: 2px;
      }
      .rail-button.active {
        border-radius: 14px;
        background: var(--mc-primary);
        border-color: var(--mc-primary);
        color: var(--mc-on-primary);
      }
      /* The one selected, marked by a pill on the rail's left edge. */
      .rail-button.active::before {
        content: "";
        position: absolute;
        left: -12px;
        top: 50%;
        width: 4px;
        height: 24px;
        border-radius: 0 4px 4px 0;
        background: var(--mc-primary);
        transform: translateY(-50%);
      }
      .rail-button svg { width: 22px; height: 22px; }
      /* A radio with a colour of its own keeps it, selected too. */
      .rail-button.colored {
        background: var(--badge);
        border-color: transparent;
        color: var(--badge-ink);
      }
      .rail-button.colored.active {
        background: var(--badge-on);
        border-color: var(--badge-on);
        color: var(--badge-on-ink);
      }
      .rail-button .emoji { font-size: 22px; line-height: 1; font-weight: 400; }
      .rail-button .pict svg { width: 22px; height: 22px; }
      .rail-button .dot {
        position: absolute;
        right: -1px;
        bottom: -1px;
        width: 12px;
        height: 12px;
        box-sizing: border-box;
        border-radius: 50%;
        border: 2px solid var(--mc-rail);
        background: var(--mc-warn);
      }
      .dot.ready { background: var(--mc-ok); }
      .dot.radio-down,
      .dot.daemon-down { background: var(--mc-danger); }
      .dot.disabled { background: var(--mc-far); }

      .sidebar {
        display: flex;
        flex-direction: column;
        min-height: 0;
        background: var(--mc-surface);
        border-right: 1px solid var(--mc-border);
      }
      /* As tall as the page's top bar beside it, their edges in one line. */
      .sidebar-head {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 2px;
        min-height: 53px;
        padding: 4px 16px;
        border-bottom: 1px solid var(--mc-border);
      }
      .sidebar-head h1 { margin: 0; font-size: 16px; }
      .sidebar-head span { font-size: 12px; }
      .sidebar-head .head-facts { display: flex; white-space: nowrap; min-width: 0; }
      .sidebar-head .head-facts > span { flex: none; }
      .sidebar-head .head-facts > span + span::before { content: "·"; margin: 0 0.35em; }
      .sidebar-head .head-facts > .link {
        flex: 0 1 auto;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .sidebar-body {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding: 8px;
        overflow-y: auto;
      }
      .sidebar-body h2 {
        margin: 14px 0 4px;
        padding: 0 10px;
        font-size: 11px;
        font-weight: 600;
        color: var(--mc-muted);
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      .sidebar-body .empty { margin: 0; padding: 2px 10px; font-size: 12px; }
      /* Adding from a link: the link, what it holds, and the buttons. */
      .link-adder { display: flex; flex-direction: column; gap: 12px; width: 480px; max-width: 100%; padding: 16px 20px 20px; }
      .link-adder header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
      .link-adder h2 { margin: 0; font-size: 16px; }
      .link-adder .hint { margin: 0; font-size: 13px; }
      .link-adder textarea { width: 100%; resize: vertical; font-size: 13px; overflow-wrap: anywhere; }
      .link-contents { display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: 10px; background: var(--mc-raised); }
      .link-contents p { margin: 0; font-size: 13px; }
      .link-contents .what { color: var(--mc-muted); font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; }
      .link-contents .ok { color: var(--mc-ok); }
      .link-contents .warn { color: var(--mc-warn); }
      .link-node { display: flex; align-items: center; gap: 10px; min-width: 0; }
      .link-node .short {
        flex: none;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: var(--mc-surface);
        font-size: 12px;
        font-weight: 700;
      }
      .link-node .names { display: flex; flex-direction: column; min-width: 0; }
      .link-node .names b, .link-node .names span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .link-node .mono { font-size: 12px; }
      .link-channels { display: flex; flex-direction: column; gap: 4px; margin: 0; padding: 0; list-style: none; }
      .link-channels li { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; }
      .link-channels li.present .name { color: var(--mc-muted); }
      .link-adder .error { margin: 0; color: var(--mc-danger); font-size: 13px; }
      /* Channels that replace: add them or replace, and their LoRa or not. */
      .link-mode { margin: 2px 0; }
      .link-lora { display: flex; align-items: flex-start; gap: 10px; font-size: 13px; cursor: pointer; }
      .link-lora input { flex: none; margin: 2px 0 0; }
      .link-lora span { display: flex; flex-direction: column; gap: 2px; }
      .link-lora small { font-size: 12px; }
      .link-adder .buttons { display: flex; justify-content: flex-end; gap: 8px; }
      /* A radio's pages, over its conversations, which scroll under them. */
      .sidebar-pages { flex: none; display: flex; flex-direction: column; gap: 2px; padding: 8px; }
      .sidebar-pages + .sidebar-body > h2:first-child { margin-top: 6px; }
      /* A line under the pages only while something of the list is out of
         view under them: drawn always, and covered by a strip that scrolls
         with the list, out of the way once it is scrolled. CSS alone, in
         every browser. */
      .sidebar-pages + .sidebar-body {
        background:
          linear-gradient(var(--mc-surface), var(--mc-surface)) top / 100% 2px no-repeat local,
          linear-gradient(var(--mc-border), var(--mc-border)) top / 100% 1px no-repeat scroll;
      }
      .item {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        min-height: 36px;
        padding: 0 10px;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: var(--mc-muted);
        text-align: left;
      }
      .item:hover { background: var(--mc-raised); color: var(--mc-text); }
      .item.active { background: var(--mc-soft); color: var(--mc-text); font-weight: 600; }
      .item .count { margin-left: auto; font-size: 12px; font-weight: 400; color: var(--mc-muted); }
      .item .label { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .mark-channel { width: 8px; text-align: center; color: var(--mc-muted); }
      .mark-node { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--mc-node-far); }
      .mark-node.direct { background: var(--mc-node-direct); }
      .mark-node.near { background: var(--mc-node-near); }
      .mark-node.mid { background: var(--mc-node-mid); }

      .avatar {
        flex: none;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: var(--mc-primary);
        color: var(--mc-on-primary);
        font-size: 12px;
        font-weight: 700;
        overflow: hidden;
      }
      .avatar.colored { background: var(--badge-on); color: var(--badge-on-ink); }
      /* Room for four letters inside the circle. */
      .local-foot .avatar { width: 40px; height: 40px; font-size: 11px; }
      /* A page with nothing to show yet, and why. */
      .empty-state {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        max-width: 460px;
        margin: 12vh auto 0;
        padding: 0 16px;
        text-align: center;
      }
      .empty-state.compact { margin: 24px auto; }
      .empty-state .empty-icon {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 72px;
        height: 72px;
        margin-bottom: 6px;
        border-radius: 50%;
        background: var(--mc-raised);
        color: var(--mc-muted);
      }
      .empty-state .empty-icon svg { width: 34px; height: 34px; }
      .empty-state h2 { margin: 0; font-size: 18px; }
      .empty-state p { margin: 0; font-size: 14px; line-height: 1.5; }
      .empty-state .empty-actions { margin-top: 10px; display: flex; gap: 8px; }
      /*
       * The radio out of reach, over what is known of it: why, how old what
       * shows is, and what can be done; the same on every page.
       */
      .offline-banner {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        align-items: center;
        gap: 10px 14px;
        margin-bottom: 16px;
        padding: 12px 14px;
        border: 1px solid var(--mc-border);
        border-radius: 12px;
        background: var(--mc-surface);
      }
      .offline-icon {
        flex: none;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: var(--mc-raised);
        color: var(--mc-muted);
      }
      .offline-icon svg { width: 20px; height: 20px; }
      .offline-words { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
      .offline-words strong { font-weight: 600; }
      .offline-words span { color: var(--mc-muted); font-size: 13px; }
      .offline-banner > button { min-height: 34px; padding: 0 14px; }
      /* On a phone, what can be done under the words, lined up with them. */
      @media (max-width: 835px), (max-height: 500px) and (pointer: coarse) {
        .offline-banner { grid-template-columns: auto minmax(0, 1fr); align-items: start; }
        .offline-banner > button, .offline-banner > .badge { grid-column: 2; justify-self: start; }
      }
      .live.gone { display: none; }
      /* On a node's page and the live view, their own gap after it. */
      .node-page > .offline-banner, .live > .offline-banner { margin: 0; }
      /* A node's figures, none while nothing is known of it. */
      .node-figures:empty { display: none; }
      .local-foot {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        background: var(--mc-surface-2);
        border-top: 1px solid var(--mc-border);
      }
      /* Its avatar and name, a button to its own page. */
      .local-foot .own-node {
        display: flex;
        align-items: center;
        gap: 10px;
        flex: 1;
        min-width: 0;
        margin: -6px;
        padding: 6px;
        border: 0;
        border-radius: 10px;
        background: transparent;
        color: inherit;
        text-align: left;
      }
      .local-foot .own-node:hover:not(:disabled),
      .local-foot .own-node.active { background: var(--mc-raised); }
      .local-foot .own-node:disabled { opacity: 1; cursor: default; }
      .local-foot .who { display: flex; flex-direction: column; flex: 1; min-width: 0; }
      .local-foot .who b { font-size: 13px; }
      .local-foot .who span { font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .local-foot .settings {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 40px;
        height: 40px;
        padding: 0;
        border: 0;
        border-radius: 10px;
        background: transparent;
        color: var(--mc-muted);
      }
      .local-foot .settings:hover,
      .local-foot .settings.active { background: var(--mc-raised); color: var(--mc-text); }
      .local-foot .settings svg { width: 18px; height: 18px; }

      .page { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
      .topbar {
        display: flex;
        flex-wrap: nowrap;
        container: topbar / inline-size;
        align-items: center;
        gap: 12px;
        min-height: 53px;
        padding: 5px 20px;
        background: var(--mc-surface);
        border-bottom: 1px solid var(--mc-border);
      }
      .topbar h1 { margin: 0; font-size: 16px; font-weight: 600; }
      /* In one line always: the name cut short before the actions go under. */
      .topbar .heading { flex: 1; display: flex; flex-direction: column; min-width: 0; }
      .topbar h1 { min-width: 0; }
      .topbar h1 .title-text,
      .topbar .heading > .dim { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .topbar .heading span { font-size: 12px; }
      .topbar .avatar { width: 32px; height: 32px; font-size: 11px; background: var(--mc-near); color: var(--mc-text); }
      .topbar .node-avatar { width: 36px; height: 36px; font-size: 10px; }
      .topbar .back { margin: 0 -4px 0 -8px; }
      .topbar h1 { display: flex; align-items: center; gap: 6px; }
      .topbar h1 .mark { display: flex; color: var(--mc-muted); }
      .topbar h1 .mark svg { width: 15px; height: 15px; }
      .topbar h1 .mark.star { color: var(--mc-primary); }
      .topbar h1 .mark.star svg { fill: currentColor; }
      /* The star as a button: an outline to mark it, filled once marked. */
      .topbar h1 .favorite {
        display: flex;
        padding: 2px;
        border: 0;
        border-radius: 6px;
        background: none;
        color: var(--mc-muted);
      }
      .topbar h1 .favorite svg { width: 16px; height: 16px; }
      .topbar h1 .favorite:hover { color: var(--mc-primary); }
      .topbar h1 .favorite.on { color: var(--mc-primary); }
      .topbar h1 .favorite.on svg { fill: currentColor; }
      .topbar .actions .with-icon { display: inline-flex; align-items: center; gap: 6px; }
      .topbar .actions .with-icon .icon { display: flex; color: var(--mc-muted); }
      .topbar .actions .primary.with-icon .icon { color: inherit; }
      .topbar .actions .with-icon svg { width: 16px; height: 16px; }
      .topbar .actions { flex: none; display: flex; flex-wrap: nowrap; gap: 8px; margin-left: auto; }
      .topbar .actions button { min-height: 34px; font-weight: 600; white-space: nowrap; }
      .menu-toggle { display: none; }
      /* On a wide screen the map goes without the bar over it, as its nodes'
         cards say all it would. A narrow one keeps it, for its menu button,
         until phones get a design of their own. */
      @media (min-width: 836px) and (min-height: 501px), (min-width: 836px) and (pointer: fine) {
        .app.on-map .topbar { display: none; }
      }
      main {
        flex: 1;
        display: grid;
        align-content: start;
        gap: 16px;
        padding: 20px;
        overflow: auto;
      }
      main:has(> .thread) { display: flex; padding: 0; overflow: hidden; }

      /*
       * A phone: the page over a bar of tabs, instead of the two bars aside;
       * the selected radio in a tab's heading, the way back in a page within
       * it. All of this is hidden on a wider screen.
       */
      .tabbar, .radio-chip { display: none; }
      /* Over .icon-button, which comes later: the way back of a phone, and
         the one of a wider screen. */
      body .phone-back { display: none; }
      .wide-only { display: contents; }
      .phone-only { display: none; }
      @media (max-width: 835px), (max-height: 500px) and (pointer: coarse) {
        .app { display: flex; flex-direction: column; }
        .page { flex: 1; min-height: 0; }
        .rail, .sidebar, .menu-toggle, .menu-backdrop, .wide-only { display: none !important; }
        .phone-only { display: contents; }
        .topbar { gap: 10px; min-height: 52px; padding: 6px 12px; }
        .topbar .page-title { display: none; }
        main { padding: 12px; }
        .tabbar {
          flex: none;
          display: grid;
          grid-template-columns: repeat(5, minmax(0, 1fr));
          padding: 4px 4px calc(4px + env(safe-area-inset-bottom));
          background: var(--mc-surface);
          border-top: 1px solid var(--mc-border);
        }
        /* A conversation takes the whole screen, to write. */
        .app.in-chat .tabbar { display: none; }
        .tabbar button {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 2px;
          min-width: 0;
          padding: 6px 2px;
          border: 0;
          border-radius: 10px;
          background: none;
          color: var(--mc-muted);
          font-size: 11px;
        }
        .tabbar button .tab-icon { display: flex; }
        .tabbar button svg { flex: none; width: 22px; height: 22px; }
        .tabbar button .label { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .tabbar button.on { color: var(--mc-primary); font-weight: 600; }
        .tabbar button.on .tab-icon { background: var(--mc-soft); border-radius: 12px; padding: 2px 14px; margin: -2px 0; }
        .radio-chip {
          display: flex;
          align-items: center;
          gap: 8px;
          min-width: 0;
          padding: 4px 8px 4px 4px;
          border: 0;
          border-radius: 12px;
          background: none;
          font-weight: 600;
        }
        .radio-chip:active { background: var(--mc-raised); }
        .radio-chip .name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 16px; }
        .radio-chip .caret { flex: none; width: 16px; height: 16px; color: var(--mc-muted); }
        body .phone-back { display: flex; margin-left: -6px; }
        body .wide-back { display: none; }
        /* A drawer is a sheet from the foot: over the drawer's own rules,
           which come later. */
        body .drawer {
          top: auto;
          left: 0;
          right: 0;
          width: 100%;
          max-height: 85dvh;
          border-left: 0;
          border-top: 1px solid var(--mc-border);
          border-radius: 16px 16px 0 0;
          box-shadow: 0 -12px 32px rgb(0 0 0 / 25%);
          padding-bottom: env(safe-area-inset-bottom);
        }
      }
      /* A radio's button in small, as a phone's heading and its sheet have it. */
      .radio-face {
        position: relative;
        flex: none;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 36px;
        height: 36px;
        border-radius: 12px;
        background: var(--mc-raised);
        font-size: 11px;
        font-weight: 700;
      }
      .radio-face.colored { background: var(--badge-on); color: var(--badge-on-ink); }
      .radio-face .dot {
        position: absolute;
        right: -3px;
        bottom: -3px;
        width: 11px;
        height: 11px;
        border-radius: 50%;
        border: 2px solid var(--mc-surface);
      }
      .radio-list { list-style: none; margin: 0; padding: 4px 8px; }
      .radio-list button {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        padding: 10px 12px;
        border: 0;
        border-radius: 12px;
        background: none;
        text-align: left;
      }
      .radio-list button.on { background: var(--mc-soft); }
      .radio-list .who { display: flex; flex-direction: column; min-width: 0; flex: 1; }
      .radio-list .who .dim { font-size: 12px; }
      .radio-list .check { width: 20px; height: 20px; color: var(--mc-primary); }
      .drawer-foot .link { padding: 0; border: 0; background: none; color: var(--mc-primary); cursor: pointer; }
      /* What a phone has in pages, a wider screen has in its bars. */
      /* The whole width, as the nodes' rows: not a column in the middle of a
         phone on its side. */
      .phone-list { display: flex; flex-direction: column; gap: 2px; width: 100%; }
      .phone-list h2 {
        margin: 16px 8px 6px;
        font-size: 12px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--mc-muted);
      }
      .phone-list h2:first-child { margin-top: 4px; }
      .phone-list .item {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        min-height: 48px;
        padding: 10px 12px;
        border: 0;
        border-radius: 10px;
        background: none;
        text-align: left;
        font-size: 15px;
      }
      .phone-list .item:active { background: var(--mc-raised); }
      .phone-list .item .label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .phone-list .item .chevron { width: 18px; height: 18px; color: var(--mc-muted); }
      .phone-list .empty { margin: 4px 12px; }
      .phone-list .local-foot { border: 1px solid var(--mc-border); border-radius: 12px; margin-bottom: 8px; }
      /* In More, its settings are the row under it: no button for them here. */
      .phone-list .local-foot .settings { display: none; }
      /* Pages. */
      .card {
        background: var(--mc-surface);
        border: 1px solid var(--mc-border);
        border-radius: 12px;
        padding: 14px 16px;
        min-width: 0;
      }
      h2 { margin: 0 0 10px; font-size: 16px; }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        color: var(--mc-muted);
      }
      .badge::before {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--mc-warn);
      }
      .badge.ready::before { background: var(--mc-ok); }
      .badge.radio-down::before,
      .badge.daemon-down::before { background: var(--mc-danger); }
      .badge.disabled::before { background: var(--mc-far); }
      .local dl {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 4px 16px;
        margin: 0;
      }
      .local dt { color: var(--mc-muted); }
      .local dd { margin: 0; }
      .toolbar {
        display: flex;
        align-items: baseline;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 8px;
      }
      .toolbar h2 { margin: 0 auto 0 0; }
      .toolbar input { width: min(260px, 100%); }
      .count { color: var(--mc-muted); font-weight: normal; }
      .scroll { overflow-x: auto; }
      table { width: 100%; border-collapse: collapse; }
      th, td {
        text-align: left;
        padding: 6px 8px;
        border-bottom: 1px solid var(--mc-border);
        white-space: nowrap;
      }
      th { color: var(--mc-muted); font-weight: 500; font-size: 12px; }
      tbody tr:hover { background: var(--mc-surface-2); }
      .num { text-align: right; font-variant-numeric: tabular-nums; }
      .mono { font-family: var(--mc-mono); font-size: 12px; }
      .dim { color: var(--mc-muted); }
      .short {
        display: inline-block;
        min-width: 3.2em;
        padding: 0 6px;
        border-radius: 5px;
        background: var(--mc-raised);
        font-family: var(--mc-mono);
        font-size: 12px;
        text-align: center;
      }
      .token { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
      .token p { margin: 0 auto 0 0; }
      .actions { text-align: right; }
      .actions button { margin-left: 6px; }
      .note { border-left: 3px solid var(--mc-warn); color: var(--mc-muted); margin: 0; }
      .note.bad { border-left-color: var(--mc-danger); }

      /*
       * The preferences, centred as the radios are: each one a row, what it
       * is on the left and its control on the right, every control as wide.
       */
      .preferences { width: 100%; max-width: 760px; margin: 0 auto; }
      .pref-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 12px 24px;
        padding: 18px 4px;
        border-bottom: 1px solid var(--mc-border);
      }
      /* First and last of the list, not of a group of rows that may hide. */
      .preferences > .pref-row:first-child { padding-top: 6px; }
      .preferences > .pref-row:last-child,
      .preferences > div:last-child > .pref-row:last-child { border-bottom: 0; }
      /* What it is takes what its control leaves: they keep to one line. */
      .pref-what { flex: 1 1 0; min-width: 200px; display: flex; flex-direction: column; gap: 2px; }
      .pref-title { font-weight: 600; }
      .pref-what .dim { font-size: 12px; }
      .pref-control { flex: none; width: 450px; max-width: 100%; }
      .pref-control.segmented button { padding: 0 8px; white-space: nowrap; }
      select.pref-control { min-height: 40px; }
      /*
       * What meshctl keeps: how much, each time after which it is cleaned,
       * and what was left behind.
       */
      .data h2 {
        margin: 28px 4px 0;
        color: var(--mc-muted);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      /* Its figures as a node's, four to the width of the page. */
      .data-figures { padding-top: 6px; }
      /* What a node says of itself, as it says it. */
      .node-status { font-style: italic; overflow-wrap: anywhere; }
      .data-figures .figure { flex: 1 1 0; min-width: 120px; }
      .data-figures .sub { white-space: nowrap; }
      .pref-control.retention { display: flex; align-items: center; justify-content: flex-end; gap: 10px; width: auto; }
      .pref-control.retention input { width: 84px; text-align: right; }
      .data-clean { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 4px 4px; }
      .data-clean .dim { font-size: 12px; }
      .data-result { margin: 8px 4px 0; font-size: 13px; color: var(--mc-ok); }
      .data .error { margin: 8px 4px 0; color: var(--mc-danger); font-size: 13px; }
      .data-forget { display: flex; gap: 8px; }
      .accents { display: flex; gap: 10px; }
      .accents .swatch:disabled { opacity: 0.35; cursor: not-allowed; }
      .accents .swatch:disabled:hover { border-color: transparent; }
      .choices { display: flex; flex-wrap: wrap; gap: 8px; }
      .choice { min-height: 40px; padding: 0 16px; border-radius: 10px; }
      .choice.on { border-color: var(--mc-primary); background: var(--mc-soft); font-weight: 600; }

      /*
       * The radio's own settings: tabs over them, centred as the preferences
       * are, and for the configuration and the modules a list aside.
       */
      .node-settings {
        width: 100%;
        max-width: 960px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      /*
       * Options each as wide as its word, the room left shared out, and the
       * pill where the one chosen is and as wide, as measured (--x, --w):
       * unseen until it is, and sliding only once it has been placed.
       */
      .segmented.fitted { grid-template-columns: repeat(var(--n), auto); }
      .settings-tabs { align-self: center; width: 100%; max-width: 640px; }
      .segmented.fitted::before {
        left: 0;
        width: var(--w, calc((100% - 6px) / var(--n, 3)));
        transform: translateX(var(--x, calc(3px + var(--at, 0) * 100%)));
        transition: transform var(--slide, 0s) ease, width var(--slide, 0s) ease;
        opacity: var(--shown, 0);
      }
      .segmented.fitted button {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 0 8px;
        white-space: nowrap;
      }
      /* Its word in bold, unseen, that keeps it as wide picked as not. */
      .segmented.fitted button::before {
        content: attr(data-label);
        height: 0;
        overflow: hidden;
        visibility: hidden;
        font-weight: 600;
      }
      /* A tab with changes not saved yet: a dot by its word, over the room. */
      .settings-tabs button.edited::after {
        content: "";
        position: absolute;
        top: 6px;
        right: 3px;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
      }
      .settings { display: flex; flex-direction: column; gap: 12px; }
      .settings .preferences { max-width: none; }
      .settings .tab-hint { margin: 0; font-size: 13px; }
      /* What few touch, folded under a row that says what is there. */
      .settings .advanced-toggle {
        display: flex;
        align-items: center;
        gap: 24px;
        width: 100%;
        margin-top: 12px;
        padding: 16px 4px;
        border: 0;
        border-top: 1px solid var(--mc-border);
        border-bottom: 1px solid var(--mc-border);
        border-radius: 0;
        background: transparent;
        color: inherit;
        text-align: left;
      }
      .settings .advanced-toggle:hover { background: var(--mc-raised); }
      .settings .advanced-toggle .chevron {
        flex: none;
        display: flex;
        color: var(--mc-muted);
        transform: rotate(-90deg);
        transition: transform 0.2s;
      }
      .settings .advanced-toggle .chevron svg { width: 24px; height: 24px; }
      .settings .advanced-toggle.open .chevron { transform: none; color: var(--mc-text); }
      /* A value the radio picks, shown greyed with "auto", until one is set. */
      .auto-field { position: relative; display: flex; }
      .auto-field input { flex: 1; min-width: 0; padding-right: 64px; -moz-appearance: textfield; }
      .auto-field input::-webkit-inner-spin-button,
      .auto-field input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
      .auto-field .auto-tag {
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        padding: 1px 8px;
        border-radius: 999px;
        background: var(--mc-raised);
        color: var(--mc-muted);
        font-size: 11px;
        pointer-events: none;
        display: none;
      }
      .auto-field.auto .auto-tag { display: block; }
      .switch-control { display: flex; }
      /*
       * The channels it has, as the radios are listed (a .radio-row each):
       * dragged or moved to reorder them, and each opening its editor.
       */
      .channel-list { display: flex; flex-direction: column; gap: 8px; container: channels / inline-size; }
      .channel-row:hover:not(.dragging) { border-color: var(--mc-primary); }
      .channel-row .pick { gap: 12px; color: inherit; }
      .channel-row .who { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
      .channel-row .name { display: flex; align-items: center; gap: 8px; }
      .channel-row .mono { font-size: 12px; }
      .channel-mark {
        flex: none;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 40px;
        height: 40px;
        border-radius: 12px;
        background: var(--mc-raised);
        color: var(--mc-muted);
      }
      .channel-mark svg { width: 20px; height: 20px; }
      .channel-mark.big { width: 56px; height: 56px; border-radius: 16px; }
      .channel-mark.big svg { width: 28px; height: 28px; }
      .channel-facts { flex: none; display: flex; align-items: center; gap: 8px; }
      .tag.position { display: inline-flex; align-items: center; gap: 4px; }
      .tag.position .icon { display: flex; }
      .tag.position svg { width: 12px; height: 12px; }
      .key {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        white-space: nowrap;
        color: var(--mc-ok);
      }
      .key.open { color: var(--mc-warn); }
      .key .icon { display: flex; }
      .key svg { width: 16px; height: 16px; }
      .channel-foot { display: flex; align-items: center; gap: 12px; margin-top: 4px; }
      .channel-foot .hint { flex: 1; margin: 0; font-size: 12px; }
      .channel-foot .add { display: inline-flex; align-items: center; gap: 6px; }
      .channel-foot .add svg { width: 16px; height: 16px; display: block; }
      /*
       * While the words and the two ways of adding do not fit in a line, by
       * the list's own width and not the screen's: the words in a line of
       * their own, centred, and both buttons together under them, sharing
       * the whole width.
       */
      @container channels (max-width: 680px) {
        .channel-foot { flex-wrap: wrap; }
        .channel-foot .hint { flex: 1 1 100%; text-align: center; }
        .channel-foot .add { flex: 1 1 0; justify-content: center; }
      }
      .channel-editor .removing p { margin: 0 0 12px; font-size: 13px; }
      .channel-editor .precision b { margin-left: 6px; color: var(--mc-text); font-weight: 600; }
      .channel-editor .precision input[type=range] {
        width: 100%;
        margin: 4px 0 0;
        accent-color: var(--mc-primary);
      }
      .channel-editor .precision .ends {
        display: flex;
        justify-content: space-between;
        font-size: 11px;
      }
      /* The key as it is: what kind, and itself when asked for. */
      .key-now { display: flex; align-items: center; gap: 8px; min-height: 36px; }
      .key-now .key { margin-right: auto; }
      .key-shown { display: flex; align-items: center; gap: 6px; }
      .key-shown .key-text { flex: 1 1 auto; min-width: 0; font-size: 12px; }
      .icon-button {
        flex: none;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 34px;
        height: 34px;
        padding: 0;
        color: var(--mc-muted);
      }
      .icon-button:hover,
      .icon-button.on { color: var(--mc-text); }
      .icon-button svg { width: 18px; height: 18px; }
      .save-bar { display: flex; justify-content: flex-end; gap: 8px; }
      .save-bar button { min-width: 110px; }
      .sections-tab {
        display: grid;
        grid-template-columns: 220px minmax(0, 1fr);
        gap: 24px;
        align-items: start;
      }
      .section-list { display: flex; flex-direction: column; gap: 2px; }
      .section-list button {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: var(--mc-muted);
        text-align: left;
      }
      .section-list button:hover { background: var(--mc-raised); color: var(--mc-text); }
      .section-list button.on { background: var(--mc-soft); color: var(--mc-text); font-weight: 600; }
      .section-list .label { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .section-list .state {
        flex: none;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--mc-far);
      }
      .section-list .state.on { background: var(--mc-ok); }
      .section-list .state.none { visibility: hidden; }
      .section-list .edited { margin-left: auto; font-weight: 400; }
      .section-panel { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
      .section-head { display: flex; align-items: center; gap: 10px; }
      .section-head h2 { margin: 0; font-size: 18px; }
      .section-panel form { display: flex; flex-direction: column; gap: 16px; }
      /* Each setting a row, as the other tabs': narrower controls beside
         the list of sections. */
      .section-panel .pref-control { width: 300px; }
      .section-panel .pref-what .tag { margin-left: 6px; font-weight: 400; }
      .interval-field { display: flex; gap: 6px; }
      .interval-field select { flex: 1; min-width: 0; }
      .interval-field input { width: 110px; }
      /*
       * The nodes a radio hears: each with its short name in a circle the
       * colour of how far it is, as on the map; the whole row opens it.
       */
      .node-list { width: 100%; max-width: 1200px; margin: 0 auto; container: nodes / inline-size; }
      .node-tools { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
      .node-tools .segmented { width: 420px; max-width: 100%; }
      .node-tools .segmented button { padding: 0 8px; white-space: nowrap; }
      /* As wide as the reach beside it, where there is room; less where not. */
      .node-search { display: flex; gap: 8px; flex: 0 1 420px; min-width: 0; margin-left: auto; }
      .node-search input { flex: 1 1 auto; min-width: 0; }
      /* The sorting, for when the list has no headings: see below. */
      .sort-menu { display: none; position: relative; }
      /* As high as the search, by stretching, and as wide: a square. */
      .sort-menu > .icon-button { width: 40px; height: auto; border: 1px solid var(--mc-border); border-radius: 10px; }
      .sort-menu > .icon-button.sorted { color: var(--mc-primary); }
      .sort-menu .heading-menu button { justify-content: space-between; gap: 24px; }
      .sort-menu .heading-menu button.on { color: var(--mc-primary); font-weight: 600; }
      .sort-menu .heading-menu button.on .icon { color: var(--mc-primary); }
      .nodes-table { width: 100%; border-collapse: collapse; }
      .nodes-table th {
        padding: 8px 10px;
        border-bottom: 1px solid var(--mc-border);
        color: var(--mc-muted);
        font-size: 12px;
        font-weight: 600;
        text-align: left;
      }
      .nodes-table td { padding: 8px 10px; border-bottom: 1px solid var(--mc-border); vertical-align: middle; }
      .nodes-table tbody tr:last-child td { border-bottom: 0; }
      .nodes-table th .sort {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 0;
        border: 0;
        background: transparent;
        color: inherit;
        font: inherit;
      }
      .nodes-table th .sort:hover,
      .nodes-table th .sort.on { color: var(--mc-text); }
      .nodes-table th .arrow { display: flex; }
      .nodes-table th .arrow svg { width: 14px; height: 14px; }
      .node-row { cursor: pointer; }
      .node-row:hover { background: var(--mc-raised); }
      .node-row .who { display: flex; align-items: center; gap: 12px; }
      .node-avatar {
        flex: none;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: var(--mc-node-far);
        color: #ffffff;
        font-size: 11px;
        font-weight: 700;
        overflow: hidden;
      }
      .node-avatar.direct { background: var(--mc-node-direct); }
      .node-avatar.near { background: var(--mc-node-near); }
      .node-avatar.mid { background: var(--mc-node-mid); }
      .node-avatar.mqtt { background: var(--mc-raised); color: var(--mc-muted); }
      .node-avatar.local { background: var(--mc-pin-local); }
      .node-avatar.emoji { font-size: 20px; }
      .topbar .node-avatar.emoji { font-size: 18px; }
      .nodes-table .names { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
      .nodes-table .name { display: flex; align-items: center; gap: 6px; min-width: 0; font-weight: 600; }
      /* Cut short when there is no room, its marks always shown after it. */
      .nodes-table .name > .text { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .nodes-table .name > .mark { flex: none; }
      .nodes-table .mono.dim, .nodes-table .small { font-size: 12px; }
      .nodes-table .mark { display: flex; color: var(--mc-muted); }
      .nodes-table .mark.to-map {
        padding: 2px;
        margin: -2px;
        border: 0;
        border-radius: 4px;
        background: none;
      }
      .nodes-table .mark.to-map:hover { color: var(--mc-primary); background: var(--mc-soft); }
      .nodes-table .mark svg { width: 14px; height: 14px; }
      .nodes-table .mark.star { color: var(--mc-primary); }
      .nodes-table .mark.star svg { fill: currentColor; }
      .power { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
      .power .icon { display: flex; color: var(--mc-muted); }
      .power svg { width: 16px; height: 16px; }
      .power.low { color: var(--mc-danger); }
      .nodes-table .actions { width: 1%; text-align: right; }
      .nodes-table .actions .icon-button { opacity: 0; }
      .node-row:hover .actions .icon-button,
      .nodes-table .actions .icon-button:focus-visible { opacity: 1; }
      .flag-chips { display: flex; flex-wrap: wrap; gap: 6px; }
      .flag-chips .choice { min-height: 32px; padding: 0 12px; font-size: 13px; }
      .secret-field { display: flex; align-items: center; gap: 6px; }
      .secret-field input { flex: 1; min-width: 0; }
      .section-panel .note { padding: 8px 12px; }
      @media (max-width: 835px) {
        .sections-tab { grid-template-columns: minmax(0, 1fr); }
      }

      /*
       * A node's page: what is amiss over all, its figures in a row, then
       * its data in sections, flat as the settings' rows, each with when it
       * came and what asks for it anew; the requests and who it is aside.
       */
      .node-page {
        width: 100%;
        max-width: 1200px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }
      .node-checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
      .node-checks li {
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding: 10px 14px;
        border-left: 3px solid var(--mc-warn);
        border-radius: 0 8px 8px 0;
        background: var(--mc-surface);
        font-size: 13px;
      }
      .node-checks li > span:not(.ask-split) { color: var(--mc-muted); }
      .node-checks li.info { border-left-color: var(--mc-primary); color: var(--mc-muted); }
      .node-checks li.ask-row {
        flex-direction: row;
        align-items: center;
        gap: 12px;
        padding: 6px 8px 6px 14px;
        color: var(--mc-text);
      }
      .node-figures {
        display: flex;
        flex-wrap: wrap;
        gap: 12px 0;
        padding-bottom: 20px;
        border-bottom: 1px solid var(--mc-border);
      }
      .figure {
        display: flex;
        flex-direction: column;
        gap: 4px;
        min-width: 160px;
        padding: 0 28px;
        border-left: 1px solid var(--mc-border);
      }
      .figure:first-child { padding-left: 4px; border-left: 0; }
      .figure .label { font-size: 12px; color: var(--mc-muted); }
      .figure .value {
        font-size: 22px;
        font-weight: 650;
        line-height: 1.2;
        font-variant-numeric: tabular-nums;
      }
      .figure .sub { font-size: 12px; color: var(--mc-muted); font-variant-numeric: tabular-nums; }
      .figure .bar {
        display: block;
        width: 120px;
        height: 4px;
        border-radius: 2px;
        background: var(--mc-raised);
        overflow: hidden;
      }
      .figure .bar i { display: block; height: 100%; border-radius: 2px; background: var(--mc-ok); }
      .figure.low .value { color: var(--mc-danger); }
      .figure.low .bar i { background: var(--mc-danger); }
      /* Sections in columns that even themselves out, whatever each holds. */
      .node-sections {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0 40px;
        align-items: start;
      }
      .node-column { display: flex; flex-direction: column; min-width: 0; }
      /* The radio's own page: its sections in two columns as long as each
         other, whatever each radio has to show; one under the other where
         two do not fit. */
      .node-sections.balanced { display: block; column-count: 2; column-gap: 40px; }
      .node-sections.balanced > .node-section { break-inside: avoid; }
      @media (max-width: 1000px) {
        .node-sections { grid-template-columns: minmax(0, 1fr); }
        .node-sections.balanced { column-count: 1; }
      }
      /* The radio's own page: since when its link is so, beside it. */
      .facts .since { margin-left: 8px; font-size: 12px; }
      /* Its settings' tabs, the whole width: five in a row, or three and the
         last two together under them, where five do not fit. */
      /* The radio's contact to share: its QR beside how, and the link. The
         QR dark on white whatever the theme, as scanners read best. */
      .contact-share { container: contact / inline-size; }
      /* Another node's contact, over the page: the QR over the words. */
      .contact-modal { width: 420px; max-width: 100%; padding: 16px 20px 20px; }
      .contact-modal header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
      .contact-modal h2 { margin: 0; font-size: 16px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .contact-share .contact { display: flex; align-items: center; gap: 16px; }
      .contact-share .qr { flex: none; width: 168px; height: 168px; border-radius: 10px; overflow: hidden; background: #fff; }
      /* Its own fill, none of the icons' stroke, and square modules. */
      .contact-share .qr svg { display: block; width: 100%; height: 100%; shape-rendering: crispEdges; }
      .contact-share .qr svg * { stroke: none; }
      .contact-share .contact-words { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
      .contact-share .hint { margin: 0; color: var(--mc-muted); font-size: 13px; }
      .contact-share .copyable { display: flex; align-items: center; gap: 6px; min-width: 0; }
      .contact-share .contact-link { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
      .contact-share .copyable .icon-button { flex: none; }
      .contact-share .copyable .icon-button svg { width: 16px; height: 16px; }
      /* The QR over the words, in the middle, while the words do not fit
         beside it: by the section's own width, a phone's or a column's. */
      @container contact (max-width: 520px) {
        .contact-share .contact { flex-direction: column; align-items: stretch; }
        .contact-share .qr { align-self: center; width: 200px; height: 200px; }
      }
      .own-shortcuts { container: shortcuts / inline-size; }
      .own-shortcuts .shortcuts { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
      .own-shortcuts .shortcuts button { min-width: 0; min-height: 34px; padding: 0 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      @container shortcuts (max-width: 560px) {
        .own-shortcuts .shortcuts { grid-template-columns: repeat(6, minmax(0, 1fr)); }
        .own-shortcuts .shortcuts button { grid-column: span 2; }
        .own-shortcuts .shortcuts button:nth-child(n + 4) { grid-column: span 3; }
      }
      .node-section {
        break-inside: avoid;
        padding: 0 4px 18px;
        margin-bottom: 18px;
        border-bottom: 1px solid var(--mc-border);
      }
      /* Nothing after the last: no line under it. With no charts, the columns
         are last, and both end the page side by side. */
      .node-page > .node-section:last-child,
      .node-page > .node-sections:last-child > .node-column > .node-section:last-child {
        margin-bottom: 0;
        border-bottom: 0;
      }
      .node-section > header,
      .part > header {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 34px;
        margin-bottom: 8px;
      }
      .node-section h2 { margin: 0; font-size: 16px; }
      .part { padding-top: 10px; border-top: 1px solid var(--mc-border); }
      .part + .part { margin-top: 12px; }
      .part > header { min-height: 32px; margin-bottom: 6px; }
      .part h3 { flex: none; margin: 0; font-size: 14px; }
      .part .nothing { margin: 0; }
      .node-section h2 { flex: none; }
      .node-section .when {
        display: flex;
        gap: 6px;
        min-width: 0;
        overflow: hidden;
        white-space: nowrap;
        font-size: 12px;
        color: var(--mc-muted);
      }
      .node-section .when .quiet { overflow: hidden; text-overflow: ellipsis; color: var(--mc-warn); }
      .node-section .when span + .quiet::before { content: "· "; color: var(--mc-muted); }
      /* A request's button: on the primary channel, with a menu for another
         beside it when the channel matters; filling up while the radio keeps
         from sending the like. */
      /* One edge around both halves, lit whole on hovering either; a faint
         line between them always, never lit. */
      .ask-split {
        position: relative;
        display: inline-flex;
        margin-left: auto;
        border: 1px solid var(--mc-border);
        border-radius: 8px;
        background: var(--mc-raised);
      }
      .ask-split:has(.ask:not(:disabled):hover),
      .ask-split.open { border-color: var(--mc-primary); }
      .ask-split:has(.ask:disabled) { opacity: 0.6; }
      .ask-split .ask {
        position: relative;
        overflow: hidden;
        min-height: 30px;
        padding: 0 14px;
        border: 0;
        border-radius: 7px;
        background: transparent;
      }
      .ask-split .ask:disabled { opacity: 1; }
      .ask-split .ask.split { border-top-right-radius: 0; border-bottom-right-radius: 0; }
      .ask-split .caret {
        display: flex;
        align-items: center;
        padding: 0 6px;
        border-left: 1px solid var(--mc-border);
        border-top-left-radius: 0;
        border-bottom-left-radius: 0;
      }
      .ask-split .caret svg { width: 16px; height: 16px; transition: transform 0.15s; }
      .ask-split.open .caret svg { transform: rotate(180deg); }
      .ask-split .fill {
        position: absolute;
        left: 0;
        bottom: 0;
        height: 3px;
        background: var(--mc-primary);
        transition: width 1s linear;
      }
      .ask-menu {
        position: absolute;
        top: calc(100% + 4px);
        right: 0;
        z-index: 30;
        display: flex;
        flex-direction: column;
        min-width: 240px;
        padding: 6px;
        border: 1px solid var(--mc-border);
        border-radius: 10px;
        background: var(--mc-surface);
        box-shadow: 0 8px 24px rgb(0 0 0 / 20%);
      }
      .ask-menu p { margin: 4px 8px 6px; font-size: 12px; color: var(--mc-muted); }
      .ask-menu button {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px;
        border: 0;
        border-radius: 6px;
        background: none;
        text-align: left;
      }
      .ask-menu button:hover { background: var(--mc-raised); }
      .ask-menu .slot { min-width: 16px; color: var(--mc-muted); font-variant-numeric: tabular-nums; }
      /*
       * A newer meshctl than this page runs: over everything, at the foot,
       * until the page is reloaded; on a phone, over its tabs.
       */
      .newer {
        position: fixed;
        left: 50%;
        bottom: 20px;
        z-index: 2000;
        display: flex;
        align-items: center;
        gap: 14px;
        width: max-content;
        max-width: calc(100vw - 24px);
        padding: 12px 14px 12px 16px;
        border: 1px solid var(--mc-border);
        border-left: 3px solid var(--mc-primary);
        border-radius: 12px;
        background: var(--mc-surface);
        box-shadow: var(--mc-shadow);
        transform: translateX(-50%);
      }
      .newer-words { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
      .newer-words span { color: var(--mc-muted); font-size: 13px; }
      .newer button { flex: none; }
      @media (max-width: 835px) {
        .newer { bottom: calc(76px + env(safe-area-inset-bottom)); }
      }
      /* Why a request was not sent, over the page for a while. */
      .toast {
        position: fixed;
        right: 20px;
        bottom: 20px;
        z-index: 50;
        max-width: 420px;
        padding: 10px 14px;
        border-left: 3px solid var(--mc-warn);
        border-radius: 8px;
        background: var(--mc-surface);
        box-shadow: 0 8px 24px rgb(0 0 0 / 25%);
        font-size: 13px;
      }
      .node-section .hint,
      .node-section .nothing { margin: 0 0 8px; font-size: 13px; color: var(--mc-muted); }
      .node-section .hint:empty { display: none; }
      .facts {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
        gap: 12px 24px;
        margin: 0;
      }
      /* Short values, figures: narrower columns, two even on a phone. */
      .facts.compact { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
      .facts .wide { grid-column: 1 / -1; }
      .facts dt { font-size: 12px; color: var(--mc-muted); }
      .facts dd { margin: 2px 0 0; font-weight: 600; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
      .facts .copyable { display: flex; align-items: center; gap: 4px; }
      .facts .copyable .icon-button { width: 28px; height: 28px; }
      /* A node's key in one line, cut short where it must (its button copies
         it whole, and it shows whole on hovering it), its button beside it:
         not a channel's key, as the classes are the same. */
      .facts .copyable .public-key { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .facts .copyable .icon-button { flex: none; }
      .facts .copyable .icon-button svg { width: 16px; height: 16px; }
      .facts .public-key { font-size: 12px; font-weight: 400; }
      .node-page button.link {
        padding: 0;
        border: 0;
        background: none;
        color: var(--mc-primary);
        font: inherit;
        cursor: pointer;
      }
      .node-page button.link:hover { text-decoration: underline; }
      .neighbours { list-style: none; margin: 0; padding: 0; columns: 2 220px; column-gap: 24px; }
      .neighbours li { display: flex; gap: 8px; padding: 4px 0; break-inside: avoid; }
      .neighbours .snr { margin-left: auto; color: var(--mc-muted); font-variant-numeric: tabular-nums; }
      .neighbours:not(.all) .extra { display: none; }
      .node-page button.neighbours-more { margin-top: 6px; font-size: 13px; }
      .node-traces .trace { padding: 4px 0 10px; border-bottom: 0; }
      .node-traces .all { font-size: 13px; }
      /* A drawer over the page's side, for a list too long for the page. */
      .drawer-shade { position: fixed; inset: 0; z-index: 40; background: rgb(0 0 0 / 35%); }
      .drawer {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        z-index: 41;
        display: flex;
        flex-direction: column;
        width: min(560px, 100vw);
        background: var(--mc-surface);
        border-left: 1px solid var(--mc-border);
        box-shadow: -12px 0 32px rgb(0 0 0 / 25%);
      }
      .drawer > header {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 53px;
        padding: 0 12px 0 20px;
        border-bottom: 1px solid var(--mc-border);
      }
      .drawer > header h2 { margin: 0; font-size: 16px; flex: 1; min-width: 0; }
      .drawer-body { flex: 1; overflow-y: auto; padding: 4px 0; }
      .drawer-body .more { display: block; margin: 12px auto; }
      .drawer-body > .nothing { margin: 16px 20px; color: var(--mc-muted); }
      /* Its foot: what can be done with what it holds, always in sight. */
      .drawer-foot { flex: none; padding: 12px 20px; border-top: 1px solid var(--mc-border); }
      .drawer-foot:empty { display: none; }
      .drawer-body .request:last-child { border-bottom: 0; }
      /* Forgetting the history: once more said sure. */
      .drawer .forget {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 10px;
        font-size: 13px;
      }
      .drawer .forget .question { flex: 1 1 100%; color: var(--mc-muted); }
      .drawer .forget button.link { padding: 0; border: 0; background: none; color: var(--mc-danger); cursor: pointer; }
      .drawer .forget button.link:hover { text-decoration: underline; }
      .drawer .forget button.danger { border-color: var(--mc-danger); color: var(--mc-danger); }
      /* Forgetting a node, two ways, each said and then done once more sure. */
      .removal { display: flex; flex-direction: column; gap: 22px; padding: 16px 20px; }
      .removal .way h3 { margin: 0 0 6px; font-size: 15px; }
      .removal .way > p { margin: 0 0 12px; font-size: 13px; line-height: 1.5; }
      .removal .way + .way { padding-top: 22px; border-top: 1px solid var(--mc-border); }
      .removal .forget { margin: 0; padding: 0; border: 0; }
      button.danger-outline { border-color: color-mix(in srgb, var(--mc-danger) 50%, var(--mc-border)); color: var(--mc-danger); }
      button.danger-outline:hover:not(:disabled) { border-color: var(--mc-danger); }
      .removal .problem { margin: 0; color: var(--mc-danger); font-size: 13px; }
      /* What a node was asked for: each request a row, its answer whole on
         opening it. */
      .requests { list-style: none; margin: 0; padding: 0; }
      .request { border-bottom: 1px solid var(--mc-border); }
      .request-line {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 4px;
        width: 100%;
        padding: 10px 20px;
        border: 0;
        border-radius: 0;
        background: transparent;
        text-align: left;
      }
      .request-line:disabled { opacity: 1; cursor: default; }
      .request-line:not(:disabled):hover,
      .request.open .request-line { background: var(--mc-raised); }
      .request-line .head { display: flex; align-items: baseline; gap: 10px; width: 100%; }
      .request-line .when { margin-left: auto; font-size: 12px; color: var(--mc-muted); white-space: nowrap; }
      .request-line .summary {
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 13px;
        color: var(--mc-muted);
      }
      .request-line .summary:empty { display: none; }
      .request .payload {
        margin: 0;
        padding: 8px 20px 14px;
        background: var(--mc-raised);
        font-size: 12px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      /*
       * A node's telemetry: one chart for each measure, side by side as the
       * page's width takes them, under the choice of while. Thin lines on a
       * faint grid; what a point says, on hovering it.
       */
      .telemetry > header { flex-wrap: wrap; }
      /* The whiles, under a pill that slides to the one chosen: small. */
      .telemetry .segmented.windows { margin-left: auto; padding: 2px; border-radius: 8px; }
      .telemetry .segmented.windows::before {
        top: 2px;
        bottom: 2px;
        width: var(--w, calc((100% - 4px) / var(--n, 3)));
        transform: translateX(var(--x, calc(2px + var(--at, 0) * 100%)));
        border-radius: 6px;
      }
      .telemetry .segmented.windows button {
        min-height: 26px;
        padding: 0 10px;
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .chart-group + .chart-group { margin-top: 22px; }
      /* Its title folds it away, and back. */
      .chart-group h3 { margin: 0 0 10px; }
      .chart-group h3 button {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 0;
        border: 0;
        background: none;
        color: var(--mc-muted);
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      .chart-group h3 button:hover { color: var(--mc-text); }
      .chart-group h3 svg {
        width: 14px;
        height: 14px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        transition: transform 0.15s;
      }
      .chart-group.folded h3 svg { transform: rotate(-90deg); }
      .chart-group .hidden { display: none !important; }
      .chart-group .more { margin-top: 12px; font-size: 13px; }
      /* A group's charts fill their rows: two share one, one takes it all,
         the last row's share what the others leave. */
      .charts { display: flex; flex-wrap: wrap; gap: 20px 32px; }
      .charts .chart { flex: 1 1 340px; }
      .charts > .rest { display: contents; }
      .chart { margin: 0; min-width: 0; }
      .chart figcaption {
        display: flex;
        align-items: baseline;
        gap: 8px;
        margin-bottom: 6px;
      }
      .chart .title { font-size: 13px; font-weight: 600; }
      .chart .latest {
        margin-left: auto;
        font-size: 13px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }
      .chart .frame {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        grid-template-rows: 110px auto;
        column-gap: 8px;
      }
      .chart .scale {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        align-items: flex-end;
        font-size: 11px;
        line-height: 1;
        color: var(--mc-muted);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .chart .plot { position: relative; min-width: 0; cursor: crosshair; touch-action: pan-y; }
      .chart svg { display: block; width: 100%; height: 100%; overflow: visible; }
      .chart .grid { stroke: var(--mc-border); stroke-width: 1; vector-effect: non-scaling-stroke; }
      .chart .line {
        fill: none;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
        vector-effect: non-scaling-stroke;
      }
      .chart .line-0 { stroke: var(--mc-chart-1); }
      .chart .line-1 { stroke: var(--mc-chart-2); }
      .chart .swatch {
        display: inline-block;
        width: 10px;
        height: 3px;
        border-radius: 2px;
        vertical-align: middle;
      }
      .chart .swatch.line-0 { background: var(--mc-chart-1); }
      .chart .swatch.line-1 { background: var(--mc-chart-2); }
      .chart .times {
        grid-column: 2;
        display: flex;
        justify-content: space-between;
        margin-top: 4px;
        font-size: 11px;
        color: var(--mc-muted);
        font-variant-numeric: tabular-nums;
      }
      .chart .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 6px; font-size: 12px; color: var(--mc-muted); }
      .chart .legend-key { display: inline-flex; align-items: center; gap: 6px; }
      .chart .cursor {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 1px;
        background: var(--mc-muted);
        pointer-events: none;
      }
      .chart .tip {
        position: absolute;
        top: 4px;
        z-index: 5;
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding: 6px 9px;
        border: 1px solid var(--mc-border);
        border-radius: 8px;
        background: var(--mc-surface);
        box-shadow: 0 6px 18px rgb(0 0 0 / 18%);
        font-size: 12px;
        white-space: nowrap;
        pointer-events: none;
      }
      .chart .tip.right { transform: translateX(10px); }
      .chart .tip.left { transform: translateX(calc(-100% - 10px)); }
      .chart .tip .when { color: var(--mc-muted); }
      .chart .tip .row { display: flex; align-items: center; gap: 6px; }
      .chart .tip strong { font-variant-numeric: tabular-nums; }
      .trace { padding: 12px 16px; border-bottom: 1px solid var(--mc-border); }
      .trace:last-child { border-bottom: 0; }
      /* One line always: whom to, how it went, when, and its copy button,
         which never go under. Whom to, its name and id in a box a line tall:
         where both do not fit, the id goes under, out of sight, whole; where
         the name alone does not, it is cut short. */
      .trace header { display: flex; gap: 12px; align-items: center; flex-wrap: nowrap; min-width: 0; }
      .trace header > :not(.target) { flex: none; }
      .trace .target {
        display: flex;
        flex-wrap: wrap;
        column-gap: 0.35em;
        flex: 0 1 auto;
        min-width: 0;
        height: 1lh;
        overflow: hidden;
      }
      .trace .target .name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .trace .target .id { font-weight: 400; white-space: nowrap; }
      .trace .when { margin-left: auto; font-size: 12px; }
      .trace header .copy { width: 28px; height: 28px; margin: -4px -6px -4px 0; }
      .trace header .copy svg { width: 16px; height: 16px; }
      .route { display: flex; gap: 10px; align-items: baseline; margin-top: 8px; }
      .route .label { font-size: 12px; min-width: 70px; }
      .path { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; }
      .hop { font-size: 12px; font-variant-numeric: tabular-nums; }
      .hop.good { color: var(--mc-ok); }
      .hop.fair { color: var(--mc-warn); }
      .hop.poor { color: var(--mc-danger); }
      .hop.unknown { color: var(--mc-muted); }

      main:has(> .map-page) { display: flex; padding: 0; overflow: hidden; }
      /* Leaflet's panes and controls go up to z-index 1000: kept to the map,
         so that they never come over the rest of the page. */
      .map-page { position: relative; flex: 1; min-width: 0; min-height: 0; isolation: isolate; container: map / inline-size; }
      .menu-backdrop { display: none; }
      .map { position: absolute; inset: 0; background: var(--mc-map); }
      .map-legend {
        position: absolute;
        left: 12px;
        bottom: 24px;
        z-index: 500;
        display: flex;
        max-width: calc(100% - 24px);
        background: color-mix(in srgb, var(--mc-surface) 92%, transparent);
        border: 1px solid var(--mc-border);
        border-radius: 10px;
        box-shadow: var(--mc-shadow);
        font-size: 12px;
        color: var(--mc-muted);
        overflow: hidden;
      }
      .map-legend-items { display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 8px 12px 8px 6px; }
      /* The legend folds away into the button before it, as in meshview. */
      .map-legend-toggle {
        display: flex;
        align-items: center;
        justify-content: center;
        flex: none;
        width: 22px;
        padding: 0;
        border: 0;
        border-radius: 0;
        background: transparent;
        color: var(--mc-muted);
      }
      .map-legend-toggle:hover { background: var(--mc-raised); color: var(--mc-text); }
      .map-legend-toggle svg { width: 16px; height: 16px; transition: transform 0.2s ease; }
      .map-legend.folded .map-legend-items { display: none; }
      .map-legend.folded .map-legend-toggle { width: 34px; height: 34px; }
      .map-legend.folded .map-legend-toggle svg { transform: rotate(180deg); }
      .map-legend span { display: flex; align-items: center; gap: 6px; }
      .map-legend i { width: 10px; height: 10px; border-radius: 50%; background: var(--mc-pin-far); }
      .map-legend i.local { background: var(--mc-pin-local); }
      .map-legend i.direct { background: var(--mc-pin-direct); }
      .map-legend i.near { background: var(--mc-pin-near); }
      .map-legend i.mid { background: var(--mc-pin-mid); }
      /*
       * Over the map, clear of its zoom buttons on the left: centred while
       * there is room, and on a narrow map out to its right edge, with no
       * room wasted there.
       */
      .map-offline {
        position: absolute;
        top: 12px;
        left: 56px;
        right: 56px;
        z-index: 500;
        max-width: 560px;
        margin: 0 auto;
        pointer-events: none;
      }
      @container map (max-width: 680px) {
        .map-offline { right: 12px; }
      }
      .map-offline .offline-banner { margin: 0; box-shadow: var(--mc-shadow); pointer-events: auto; }
      /* A node where it is, small, on its page: a click shows it on the map. */
      .mini-map {
        height: 180px;
        margin-bottom: 12px;
        border: 1px solid var(--mc-border);
        border-radius: 10px;
        background: var(--mc-map);
        cursor: pointer;
        z-index: 0;
      }
      .mini-map:hover { border-color: var(--mc-primary); }
      .mini-map.leaflet-container, .mini-map .leaflet-interactive { cursor: pointer; }
      .mini-map .leaflet-control-attribution { font-size: 10px; }
      .map-empty {
        position: absolute;
        top: 12px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 500;
        margin: 0;
        max-width: calc(100% - 24px);
      }
      /* The tiles, darkened when the map is dark: as asked for, or following
         the interface's theme, given or the system's. */
      :root[data-map-theme="dark"] .leaflet-tile-pane,
      :root[data-theme="dark"]:not([data-map-theme="light"]) .leaflet-tile-pane {
        filter: invert(1) hue-rotate(180deg) brightness(0.85) saturate(0.75);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]):not([data-map-theme="light"]) .leaflet-tile-pane {
          filter: invert(1) hue-rotate(180deg) brightness(0.85) saturate(0.75);
        }
      }
      /* A route's colours, by how each hop was heard, and the band edging its
         lines: for the map's own theme, which may not be the page's. Bright
         and apart from the tiles' greens and the roads' reds and browns.
         So the nodes' pins too, the --mc-pin-* colours: those of --mc-node-*
         for the map's theme, as the sidebar's marks go by the page's. */
      :root {
        --mc-route-casing: #ffffff;
        --mc-route-good: #0ca678;
        --mc-route-fair: #f08c00;
        --mc-route-poor: #e03131;
        --mc-route-unknown: #495057;
        --mc-pin-local: #9a5b00;
        --mc-pin-direct: #099268;
        --mc-pin-near: #1971c2;
        --mc-pin-mid: #7048e8;
        --mc-pin-far: #6c757d;
      }
      :root[data-map-theme="dark"],
      :root[data-theme="dark"]:not([data-map-theme="light"]) {
        --mc-route-casing: #0b0f14;
        --mc-route-good: #38d9a9;
        --mc-route-fair: #ffd43b;
        --mc-route-poor: #ff8787;
        --mc-route-unknown: #dee2e6;
        --mc-pin-local: #f0a63a;
        --mc-pin-direct: #38d9a9;
        --mc-pin-near: #4dabf7;
        --mc-pin-mid: #b197fc;
        --mc-pin-far: #a5aeb8;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]):not([data-map-theme="light"]) {
          --mc-route-casing: #0b0f14;
          --mc-route-good: #38d9a9;
          --mc-route-fair: #ffd43b;
          --mc-route-poor: #ff8787;
          --mc-route-unknown: #dee2e6;
          --mc-pin-local: #f0a63a;
          --mc-pin-direct: #38d9a9;
          --mc-pin-near: #4dabf7;
          --mc-pin-mid: #b197fc;
          --mc-pin-far: #a5aeb8;
        }
      }
      .leaflet-container { font: inherit; }
      .leaflet-tooltip {
        background: var(--mc-surface);
        color: var(--mc-text);
        border: 1px solid var(--mc-border);
        box-shadow: var(--mc-shadow);
      }
      .leaflet-tooltip-top::before { border-top-color: var(--mc-border); }
      /* Hovering a node: who it is, and below, how it is heard. */
      .leaflet-tooltip.mc-tip {
        padding: 6px 10px;
        border-radius: 8px;
        font-size: 13px;
        line-height: 1.35;
        white-space: nowrap;
      }
      .mc-tip-title { display: flex; align-items: baseline; justify-content: center; gap: 6px; }
      .mc-tip-title strong {
        padding: 0 5px;
        border-radius: 4px;
        background: var(--mc-raised);
        font-family: var(--mc-mono);
        font-size: 11px;
        font-weight: 600;
      }
      .mc-tip-title span { font-weight: 600; }
      .mc-tip-heard { margin-top: 2px; font-family: var(--mc-mono); font-size: 11px; color: var(--mc-muted); text-align: center; }
      /* The zoom buttons, rounded and raised like the legend. */
