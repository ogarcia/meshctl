      .leaflet-touch .leaflet-bar, .leaflet-bar {
        border: 1px solid var(--mc-border);
        border-radius: 10px;
        box-shadow: var(--mc-shadow);
        overflow: hidden;
        background-clip: padding-box;
      }
      .leaflet-bar a, .leaflet-bar a:hover,
      .leaflet-touch .leaflet-bar a {
        width: 34px;
        height: 34px;
        line-height: 34px;
        background: var(--mc-surface);
        color: var(--mc-text);
        border-bottom-color: var(--mc-border);
        font-size: 18px;
      }
      .leaflet-bar a:hover { background: var(--mc-raised); }
      /* Every node in sight, under the zoom's buttons. */
      .mc-zoom-all a { display: flex; align-items: center; justify-content: center; }
      .mc-zoom-all a::after {
        content: "";
        width: 18px;
        height: 18px;
        background: currentColor;
        -webkit-mask: url(/tabler-icons-3.51.0/icons/outline/zoom-scan.svg) center / contain no-repeat;
        mask: url(/tabler-icons-3.51.0/icons/outline/zoom-scan.svg) center / contain no-repeat;
      }
      /* Links everywhere else underline on hover; not the map's controls. */
      .leaflet-bar a:hover,
      .leaflet-control-attribution a:hover { text-decoration: none; }
      .leaflet-bar a:first-child, .leaflet-touch .leaflet-bar a:first-child {
        border-top-left-radius: 9px;
        border-top-right-radius: 9px;
      }
      .leaflet-bar a:last-child, .leaflet-touch .leaflet-bar a:last-child {
        border-bottom-left-radius: 9px;
        border-bottom-right-radius: 9px;
      }
      .leaflet-popup-content-wrapper, .leaflet-popup-tip {
        background: var(--mc-surface);
        color: var(--mc-text);
        box-shadow: var(--mc-shadow);
      }
      .leaflet-popup-content-wrapper { border: 1px solid var(--mc-border); border-radius: 12px; }
      .leaflet-container a.leaflet-popup-close-button { color: var(--mc-muted); }
      /* Leaflet's own ×, drawn as every other cross is: Tabler's. */
      .leaflet-container a.leaflet-popup-close-button span { visibility: hidden; }
      .leaflet-container a.leaflet-popup-close-button::after {
        content: "";
        position: absolute;
        inset: 5px;
        background: currentColor;
        -webkit-mask: url(/tabler-icons-3.51.0/icons/outline/x.svg) center / contain no-repeat;
        mask: url(/tabler-icons-3.51.0/icons/outline/x.svg) center / contain no-repeat;
      }
      .leaflet-container a.leaflet-popup-close-button:hover { color: var(--mc-text); }
      .leaflet-popup-content { margin: 12px 14px; font-size: 13px; line-height: 1.4; }
      .mc-dot { flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--mc-pin-far); }
      .mc-dot.local, .mc-pin.local { background: var(--mc-pin-local); }
      .mc-dot.direct, .mc-pin.direct { background: var(--mc-pin-direct); }
      .mc-dot.near, .mc-pin.near { background: var(--mc-pin-near); }
      .mc-dot.mid, .mc-pin.mid { background: var(--mc-pin-mid); }
      /* A node on the map: a dot of its kind's colour, ringed in white and
         outlined in dark so that it stands out on light tiles and dark ones;
         with its role's icon on it when it has one. */
      .mc-pin {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        box-sizing: border-box;
        border-radius: 50%;
        border: 2px solid #fff;
        background: var(--mc-pin-far);
        box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.45), 0 1px 4px rgba(0, 0, 0, 0.35);
      }
      .mc-pin.selected { box-shadow: 0 0 0 3px var(--mc-text), 0 1px 6px rgba(0, 0, 0, 0.4); }
      .mc-pin i { display: none; }
      .mc-pin[class*="role-"] i {
        display: block;
        width: 16px;
        height: 16px;
        background: #fff;
        -webkit-mask: var(--icon) center / contain no-repeat;
        mask: var(--icon) center / contain no-repeat;
      }
      .mc-pin.role-router { --icon: url(/tabler-icons-3.51.0/icons/outline/building-broadcast-tower.svg); }
      .mc-pin.role-base { --icon: url(/tabler-icons-3.51.0/icons/outline/home-signal.svg); }
      .map-legend .icon {
        width: 14px;
        height: 14px;
        background: var(--mc-muted);
        -webkit-mask: var(--icon) center / contain no-repeat;
        mask: var(--icon) center / contain no-repeat;
      }
      .map-legend .icon.router { --icon: url(/tabler-icons-3.51.0/icons/outline/building-broadcast-tower.svg); }
      .map-legend .icon.base { --icon: url(/tabler-icons-3.51.0/icons/outline/home-signal.svg); }
      .mc-card { display: grid; gap: 10px; min-width: 260px; }
      /* Taller than the map leaves, it scrolls: without Leaflet's light lines. */
      /*
       * The node's popup scrolls as a whole, when taller than the map leaves:
       * its padding within, for the scrollbar to run along its edge, and
       * without Leaflet's light lines.
       */
      .mc-node-popup .leaflet-popup-content-wrapper { overflow: hidden; }
      .mc-node-popup .leaflet-popup-content { margin: 0; }
      .mc-node-popup .mc-card { padding: 12px 14px; min-width: 288px; }
      .mc-node-popup .leaflet-popup-scrolled {
        border: 0;
        overflow-x: hidden;
        overscroll-behavior: contain;
      }
      .mc-card-head { display: flex; align-items: center; gap: 10px; padding-right: 14px; }
      .mc-card-title { display: flex; flex-direction: column; min-width: 0; }
      .mc-card-title strong { font-size: 14px; }
      .mc-card-id { font-family: var(--mc-mono); font-size: 11px; color: var(--mc-muted); }
      .mc-card-facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 12px; margin: 0; }
      .mc-card-facts dt { display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--mc-muted); }
      /* A bundled Tabler icon, in the colour of the text around it. */
      .mc-icon {
        flex: none;
        width: 13px;
        height: 13px;
        background: currentColor;
        -webkit-mask: var(--icon) center / contain no-repeat;
        mask: var(--icon) center / contain no-repeat;
      }
      .mc-card-facts dd { padding-left: 17px; }
      .mc-card-facts .wide { grid-column: 1 / -1; }
      /* A value that may be long, as a node's status: three lines at most. */
      .mc-card-facts dd.clamped {
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 3;
        line-clamp: 3;
        overflow: hidden;
        font-style: italic;
      }
      .mc-card-facts dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; }
      .mc-card-buttons { display: flex; gap: 8px; }
      .mc-card-buttons button { flex: 1; min-height: 34px; }
      .mc-card-route { min-height: 34px; }
      .mc-card-route[aria-pressed="true"] { border-color: var(--mc-primary); background: var(--mc-soft); }
      .map-route-notice {
        position: absolute;
        top: 12px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 600;
        display: flex;
        align-items: center;
        gap: 10px;
        max-width: calc(100% - 120px);
        padding: 6px 6px 6px 14px;
        background: var(--mc-surface);
        border: 1px solid var(--mc-primary);
        border-radius: 999px;
        box-shadow: var(--mc-shadow);
        font-size: 13px;
      }
      .map-route-notice span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      /* How the way there and the way back are drawn, as the map draws them. */
      .map-route-notice .route-key {
        display: flex;
        flex: none;
        align-items: center;
        gap: 6px;
        padding-left: 10px;
        border-left: 1px solid var(--mc-border);
        font-size: 12px;
        color: var(--mc-muted);
      }
      .route-key i { display: inline-block; width: 18px; border-top: 3px solid var(--mc-text); }
      .route-key i.back { border-top: 2px dashed var(--mc-muted); margin-left: 6px; }
      /* An arrowhead on a route, pointing the way it went. */
      .mc-arrow {
        display: block;
        width: 22px;
        height: 22px;
        overflow: visible;
      }
      .map-route-notice button {
        flex: none;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 28px;
        height: 28px;
        padding: 0;
        border-radius: 50%;
      }
      .map-route-notice button svg { width: 16px; height: 16px; }
      .mc-picker-popup .leaflet-popup-content { margin: 6px; width: 260px !important; max-width: calc(100vw - 64px); }
      .mc-picker-head { display: flex; align-items: center; gap: 8px; padding: 2px 2px 4px 8px; }
      .mc-picker-head p { flex: 1; margin: 0; font-size: 12px; color: var(--mc-muted); }
      .mc-picker-zoom {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 30px;
        height: 30px;
        padding: 0;
        border: 0;
        background: transparent;
        color: var(--mc-muted);
      }
      /* A magnifier: zooming in on the group, which parts its dots. */
      .mc-picker-zoom i {
        width: 18px;
        height: 18px;
        background: currentColor;
        -webkit-mask: url(/tabler-icons-3.51.0/icons/outline/zoom-in.svg) center / contain no-repeat;
        mask: url(/tabler-icons-3.51.0/icons/outline/zoom-in.svg) center / contain no-repeat;
      }
      .mc-picker-zoom:hover { background: var(--mc-raised); color: var(--mc-text); }
      .mc-picker-list { list-style: none; margin: 0; padding: 0; max-height: 260px; overflow-y: auto; }
      .mc-picker-item {
        display: grid;
        grid-template-columns: 10px minmax(0, 1fr) auto;
        align-items: center;
        gap: 9px;
        width: 100%;
        min-height: 40px;
        padding: 6px 8px;
        border: 0;
        border-radius: 6px;
        background: transparent;
        text-align: left;
      }
      .mc-picker-item:hover, .mc-picker-item:focus-visible { background: var(--mc-raised); }
      .mc-picker-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .mc-picker-name strong { margin-right: 6px; }
      .mc-picker-name span, .mc-picker-seen { font-size: 12px; color: var(--mc-muted); white-space: nowrap; }
      .leaflet-control-attribution {
        background: color-mix(in srgb, var(--mc-surface) 85%, transparent) !important;
        color: var(--mc-muted);
      }

      /*
       * The live view, as wide as the nodes list and laid out by its own
       * width: its filters over it in a grid the whole width, in one row,
       * two or three as there is room; what comes while it holds still
       * waiting in a pill on top; each packet new glowing once.
       */
      .live {
        container: live / inline-size;
        display: flex;
        flex-direction: column;
        gap: 12px;
        width: 100%;
        max-width: 1200px;
        min-width: 0;
        margin: 0 auto;
      }
      .packet-tools {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 2fr);
        grid-template-areas:
          "kind channel reach"
          "search search search";
        gap: 8px;
        align-items: center;
      }
      .packet-tools .kind { grid-area: kind; }
      .packet-tools .channel { grid-area: channel; }
      .packet-tools .segmented { grid-area: reach; width: auto; }
      .packet-tools .search { grid-area: search; display: flex; align-items: center; gap: 12px; min-width: 0; }
      .packet-tools select,
      .packet-tools .node-filter { width: 100%; min-width: 0; min-height: 36px; }
      /* The node as wide as the switch leaves; the switch as wide as it is,
         a hair in from the edge, as the reach's round corner above is. */
      .packet-tools .node-filter { flex: 1; }
      .packet-tools .own { flex: none; display: flex; align-items: center; gap: 10px; min-height: 36px; margin-right: 3px; }
      .packet-tools .own .label { white-space: nowrap; cursor: pointer; }
      @container live (min-width: 1150px) {
        .packet-tools {
          grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(max-content, 1.6fr) minmax(0, 2fr);
          grid-template-areas: "kind channel reach search";
        }
      }
      @container live (max-width: 700px) {
        .packet-tools {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          grid-template-areas:
            "kind channel"
            "reach reach"
            "search search";
        }
      }
      /* The pause, in the heading: marked while paused. */
      .topbar .actions .pause.on { border-color: var(--mc-primary); background: var(--mc-soft); }
      /* Rows, as the nodes' are, not a card. */
      .packets > p { margin: 0; padding: 14px 4px; }
      .packets .end { font-size: 13px; text-align: center; }
      .new-packets {
        position: sticky;
        top: 8px;
        z-index: 2;
        display: flex;
        align-items: center;
        gap: 6px;
        width: max-content;
        min-height: 32px;
        margin: 0 auto -32px;
        padding: 0 14px;
        border: 0;
        border-radius: 999px;
        background: var(--mc-primary);
        color: var(--mc-on-primary);
        font-weight: 600;
        box-shadow: 0 4px 14px rgb(0 0 0 / 25%);
      }
      .new-packets .icon { display: flex; }
      .new-packets svg { width: 16px; height: 16px; }
      .packet.arrived { animation: arrived 1s ease-in-out 1; }
      @keyframes arrived {
        45% { background: color-mix(in srgb, var(--mc-primary) 30%, var(--mc-surface)); }
        75% { background: color-mix(in srgb, var(--mc-primary) 14%, var(--mc-surface)); }
      }
      @media (prefers-reduced-motion: reduce) {
        .packet.arrived { animation: arrived-still 1s step-end 1; }
        @keyframes arrived-still { 0% { background: var(--mc-soft); } }
      }
      /*
       * A packet a line: when, its kind in its colour, how it came, from and
       * to, what it says, its hops and by whom last, and how strong it was
       * heard. The columns are the list's, as wide as what they hold in any
       * row, the route first and what it says after.
       */
      .packet-list {
        display: grid;
        grid-template-columns: auto auto auto minmax(8rem, max-content) minmax(8rem, 1fr) auto auto;
        column-gap: 14px;
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .packet { display: grid; grid-template-columns: subgrid; grid-column: 1 / -1; border-bottom: 1px solid var(--mc-border); }
      .packet:last-child { border-bottom: 0; }
      .packet-line {
        display: grid;
        grid-template-columns: subgrid;
        grid-column: 1 / -1;
        align-items: baseline;
        width: 100%;
        padding: 10px 8px;
        border: 0;
        border-radius: 0;
        background: transparent;
        text-align: left;
      }
      .packet-line:hover { background: var(--mc-raised); }
      .packet-line > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .packet .hops { font-size: 12px; text-align: right; }
      .packet .signal { font-size: 11px; text-align: right; }
      /* A kind, by its colour: its name in it, never the colour alone, at
         5.8:1 or better against its tint in either theme. */
      .kind-tag {
        display: inline-block;
        padding: 1px 7px;
        border: 1px solid transparent;
        border-radius: 6px;
        background: color-mix(in srgb, var(--kind) 20%, transparent);
        color: color-mix(in srgb, var(--kind) 40%, var(--mc-text));
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.04em;
        white-space: nowrap;
      }
      .kind-tag.text { --kind: #4a96ea; }
      .kind-tag.position { --kind: #2fb380; }
      .kind-tag.node-info { --kind: #9775fa; }
      .kind-tag.routing { --kind: #8a94a0; }
      .kind-tag.telemetry { --kind: #22b8cf; }
      .kind-tag.traceroute { --kind: #f06595; }
      .kind-tag.neighbors { --kind: #ff922b; }
      .kind-tag.encrypted { --kind: #8a94a0; background: none; border-style: dashed; border-color: var(--mc-border); }
      .kind-tag.other { --kind: #adb5bd; background: none; border-color: var(--mc-border); }
      /* How it came: sent by the radio itself in the accent, heard plainly. */
      .source {
        display: inline-block;
        padding: 1px 6px;
        border: 1px solid var(--mc-border);
        border-radius: 6px;
        color: var(--mc-muted);
        font-size: 10.5px;
        font-weight: 600;
        letter-spacing: 0.03em;
        white-space: nowrap;
      }
      .source.tx { border-color: color-mix(in srgb, var(--mc-primary) 55%, transparent); color: var(--mc-primary); }
      .source.mqtt { border-style: dashed; }
      /*
       * Short of room for a line each, two: when, its kind, how it came, from
       * and to, and how strong; what it says, and its hops. Still the list's
       * columns, so that every row lines up.
       */
      @container live (max-width: 960px) {
        .packet-list { grid-template-columns: auto auto auto minmax(0, 1fr) auto; }
        .packet-line { row-gap: 4px; }
        .packet .time { grid-column: 1; grid-row: 1; }
        .packet .kind { grid-column: 2; grid-row: 1; }
        .packet .source-cell { grid-column: 3; grid-row: 1; }
        .packet .route { grid-column: 4; grid-row: 1; }
        .packet .signal { grid-column: 5; grid-row: 1; }
        .packet .summary { grid-column: 1 / 5; grid-row: 2; }
        .packet .hops { grid-column: 5; grid-row: 2; }
      }
      /*
       * Shorter still, three, each row its own: when, its kind, how it came,
       * and how strong; from and to, and its hops; what it says.
       */
      @container live (max-width: 640px) {
        .packet-list { display: block; }
        .packet { display: block; }
        .packet-line {
          grid-template-columns: auto auto auto minmax(0, 1fr) auto auto;
          grid-template-areas:
            "time kind source . signal signal"
            "route route route route route hops"
            "summary summary summary summary summary summary";
          gap: 4px 8px;
        }
        /* Its marks a little tighter, for the signal to fit beside them. */
        .packet .kind-tag, .packet .source { padding: 1px 5px; letter-spacing: 0.02em; }
        .packet .time { grid-area: time; }
        .packet .kind { grid-area: kind; }
        .packet .source-cell { grid-area: source; }
        .packet .hops { grid-area: hops; }
        .packet .route { grid-area: route; }
        .packet .signal { grid-area: signal; }
        .packet .summary { grid-area: summary; }
      }
      /*
       * Where a row has no room for it beside the longest kind's name, the
       * RSSI of none, so that every row says the same: the SNR alone. Measured
       * with a neighbour info, the longest name, beside the longest signal.
       */
      @container live (max-width: 387px) {
        .packet .rssi { display: none; }
      }
      /* From and to, each cut short as it must, so that neither goes whole. */
      .packet .route { display: flex; gap: 0.4em; }
      .packet .route > .from,
      .packet .route > .to { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
      .packet .route > .arrow { flex: none; }
      /* A packet whole, in its drawer: what is known of it, and its text. */
      .packet-facts {
        display: grid;
        grid-template-columns: max-content minmax(0, 1fr);
        gap: 8px 16px;
        margin: 0;
        padding: 14px 20px;
        font-size: 13px;
      }
      .packet-facts .fact { display: contents; }
      .packet-facts dt { color: var(--mc-muted); }
      .packet-facts dd { margin: 0; overflow-wrap: anywhere; }
      .packet-facts .mark-item + .mark-item::before { content: " · "; color: var(--mc-muted); }
      .packet-text {
        margin: 0 20px 16px;
        padding: 12px 14px;
        border-radius: 8px;
        background: var(--mc-surface-2);
        font-size: 12px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      /* The conversation in a column of its own on a wide screen, its
         background the whole width: what is said, and what is written, no
         wider than reads well. */
      .thread {
        --chat-gutter: max(20px, calc((100% - 920px) / 2));
        display: flex;
        flex-direction: column;
        flex: 1;
        min-width: 0;
        min-height: 0;
      }
      .thread .empty { margin: auto; }
      .thread { position: relative; }
      /* Where the day changes: a faint line, the day in the middle. */
      .day-line { display: flex; align-items: center; gap: 12px; margin: 6px 0; color: var(--mc-muted); font-size: 12px; }
      .day-line::before, .day-line::after { content: ""; flex: 1; height: 1px; background: var(--mc-border); }
      /* Where what was not read starts, in the accent. */
      .unread-line { display: flex; align-items: center; gap: 12px; margin: 6px 0; color: var(--mc-primary); font-size: 12px; font-weight: 600; }
      .unread-line::before, .unread-line::after {
        content: "";
        flex: 1;
        height: 1px;
        background: color-mix(in srgb, var(--mc-primary) 50%, transparent);
      }
      /* How many were not read: beside a conversation, over the chats' tab. */
      .unread {
        flex: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 18px;
        height: 18px;
        padding: 0 5px;
        border-radius: 999px;
        background: var(--mc-primary);
        color: var(--mc-on-primary);
        font-size: 11px;
        font-weight: 700;
        line-height: 1;
      }
      .item .unread { margin-left: auto; }
      .tabbar button { position: relative; }
      .tabbar .unread { position: absolute; top: 2px; left: calc(50% + 6px); }
      /* On a radio's button, at its corner; in the phone's list, at the end. */
      .rail-button .unread { position: absolute; top: -5px; right: -5px; box-shadow: 0 0 0 2px var(--mc-rail); }
      .radio-list .unread { margin-left: auto; }
      /* Away from the newest, back to it, and how many came meanwhile. */
      .to-latest {
        position: absolute;
        top: 12px;
        left: 50%;
        z-index: 10;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 14px;
        border: 1px solid var(--mc-border);
        border-radius: 999px;
        background: var(--mc-surface);
        box-shadow: var(--mc-shadow);
        font-size: 13px;
        transform: translateX(-50%);
      }
      .to-latest .icon { display: flex; }
      .to-latest svg { width: 16px; height: 16px; }
      .messages {
        flex: 1;
        overflow-y: auto;
        padding: 20px var(--chat-gutter);
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .bubble {
        max-width: min(70%, 560px);
        align-self: flex-start;
        background: var(--mc-raised);
        border-radius: 4px 14px 14px 14px;
        padding: 8px 12px;
      }
      .bubble.mine {
        align-self: flex-end;
        background: var(--mc-out);
        border-radius: 14px 4px 14px 14px;
      }
      /* A message, and with a mouse what can be done with it, on hovering:
         at its foot on the right, half over its edge. */
      .bubble-row { position: relative; display: flex; align-self: flex-start; max-width: min(70%, 560px); }
      .bubble-row.mine { align-self: flex-end; }
      .bubble-row > .bubble { position: relative; min-width: 0; max-width: none; }
      .bubble .answer {
        position: absolute;
        right: 10px;
        bottom: -15px;
        z-index: 5;
        display: none;
        gap: 2px;
        padding: 2px;
        border: 1px solid var(--mc-border);
        border-radius: 999px;
        background: var(--mc-surface);
        box-shadow: var(--mc-shadow);
      }
      .bubble .answer .icon-button { width: 28px; height: 28px; border: 0; border-radius: 50%; }
      .bubble .answer .icon-button svg { width: 16px; height: 16px; }
      .bubble .answer .icon-button.on { color: var(--mc-primary); }
      @media (hover: hover) and (pointer: fine) {
        .bubble-row:hover .answer, .bubble-row.reacting .answer { display: flex; }
        /* The reactions clear of where those buttons show, at their right:
           they never go under them. */
        .bubble .reactions { padding-right: 96px; }
      }
      /* Touched, its menu open. */
      .bubble.held { outline: 2px solid var(--mc-primary); outline-offset: 1px; }
      /* What it answers, quoted: who, and the start of it. */
      .bubble .quote, .composer .replying .quote {
        display: flex;
        flex-direction: column;
        min-width: 0;
        padding: 3px 8px;
        border-left: 3px solid var(--mc-primary);
        border-radius: 4px;
        background: color-mix(in srgb, var(--mc-text) 6%, transparent);
        font-size: 12px;
      }
      .bubble .quote { margin: 2px 0 4px; }
      .quote .who { font-weight: 600; color: var(--mc-primary); }
      .quote .what { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--mc-muted); }
      /* The reactions to it, each emoji once, and how many. */
      .bubble .reactions { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
      .bubble .reaction {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 1px 8px;
        border: 1px solid var(--mc-border);
        border-radius: 999px;
        background: var(--mc-surface);
        font-size: 14px;
        line-height: 1.5;
      }
      .bubble .reaction.ours { border-color: var(--mc-primary); background: var(--mc-soft); }
      .bubble .reaction:disabled { opacity: 1; cursor: default; }
      .bubble .reaction .count { font-size: 12px; color: var(--mc-muted); }
      .bubble .reaction.more { color: var(--mc-muted); font-size: 12px; }
      /* The emojis to react with, over the message: the most used, then all. */
      .reaction-picker {
        position: absolute;
        /* Over the buttons at the message's foot, on its right. */
        right: 10px;
        bottom: 18px;
        z-index: 40;
        padding: 4px;
        border: 1px solid var(--mc-border);
        border-radius: 999px;
        background: var(--mc-surface);
        box-shadow: var(--mc-shadow);
      }
      .reaction-picker .quick { display: flex; gap: 2px; }
      .reaction-picker .quick button {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 36px;
        height: 36px;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: none;
        font-size: 20px;
      }
      .reaction-picker .quick button:hover { background: var(--mc-raised); }
      .reaction-picker .quick .more { color: var(--mc-muted); }
      .reaction-picker .quick .more svg { width: 18px; height: 18px; }
      .reaction-picker.all { width: 340px; max-width: calc(100vw - 32px); padding: 0; border-radius: 12px; }
      .reaction-picker.all .emoji-picker { max-width: none; border: 0; background: var(--mc-surface); }
      /* All of a message, over the page. */
      .message-details { width: 460px; max-width: 100%; max-height: 90vh; overflow-y: auto; padding: 16px 20px 20px; }
      .message-details header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
      .message-details h2 { margin: 0; font-size: 16px; }
      .message-details .said {
        margin: 0 0 16px;
        padding: 10px 12px;
        border-radius: 10px;
        background: var(--mc-raised);
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .message-details .reacted { margin: 0; padding: 0; list-style: none; }
      /* By touch, a message's menu, from below: its reactions, then what
         can be done with it. */
      .sheet-back { position: fixed; inset: 0; z-index: 3000; display: flex; align-items: flex-end; background: rgb(0 0 0 / 45%); }
      .message-menu {
        display: flex;
        flex-direction: column;
        gap: 2px;
        width: 100%;
        padding: 12px 12px calc(12px + env(safe-area-inset-bottom));
        border-radius: 16px 16px 0 0;
        background: var(--mc-surface);
      }
      .message-menu .reaction-picker {
        position: static;
        margin-bottom: 6px;
        padding: 0 0 8px;
        border: 0;
        border-bottom: 1px solid var(--mc-border);
        border-radius: 0;
        box-shadow: none;
      }
      .message-menu .reaction-picker .quick { justify-content: space-between; }
      .message-menu .reaction-picker.all { width: auto; max-width: none; }
      .message-menu > button {
        display: flex;
        align-items: center;
        gap: 14px;
        min-height: 48px;
        padding: 0 12px;
        border: 0;
        border-radius: 10px;
        background: none;
        font-size: 15px;
        text-align: left;
      }
      .message-menu > button:active { background: var(--mc-raised); }
      .message-menu > button .icon { display: flex; color: var(--mc-muted); }
      .message-menu > button svg { width: 20px; height: 20px; }
      .message-menu .danger-item, .message-menu .danger-item .icon { color: var(--mc-danger); }
      .bubble p { margin: 2px 0; white-space: pre-wrap; overflow-wrap: anywhere; }
      .bubble .author { font-size: 12px; color: var(--mc-muted); }
      .bubble .meta { display: flex; align-items: center; justify-content: flex-end; gap: 4px; font-size: 11px; }
      .bubble .mark { display: flex; }
      .bubble .mark svg { width: 14px; height: 14px; }
      .mark.pending { color: var(--mc-muted); }
      .mark.delivered { color: var(--mc-second); }
      .mark.sent { color: var(--mc-muted); }
      .mark.failed { color: var(--mc-danger); cursor: help; }
      /* Over where it is written, to a node that takes no messages. */
      .unmessagable {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 0;
        padding: 10px var(--chat-gutter);
        border-top: 1px solid var(--mc-border);
        border-left: 3px solid var(--mc-warn);
        background: var(--mc-surface);
        color: var(--mc-muted);
        font-size: 13px;
      }
      .unmessagable .icon { display: flex; flex: none; color: var(--mc-warn); }
      .unmessagable svg { width: 18px; height: 18px; }
      .composer {
        display: flex;
        gap: 10px;
        /* What goes with what is written, at its foot, as it grows. */
        align-items: flex-end;
        flex-wrap: wrap;
        padding: 12px var(--chat-gutter);
        background: var(--mc-surface);
        border-top: 1px solid var(--mc-border);
      }
      /* A line tall, growing with what is written up to eight, then
         scrolled within; long words broken, as nothing runs off its side. */
      .composer { position: relative; }
      /* What is answered, over the field, the whole width. */
      .composer .replying { display: flex; flex-basis: 100%; align-items: center; gap: 10px; width: 100%; min-width: 0; }
      .composer .replying > .icon { display: flex; color: var(--mc-primary); }
      .composer .replying > .icon svg { width: 18px; height: 18px; }
      .composer .replying .quote { flex: 1; overflow: hidden; }
      .composer .field { position: relative; flex: 1; min-width: 0; display: flex; }
      /* The emojis' button inside the field, on its right, at its foot. */
      /* A line tall, its face as big as it fits, in the middle of it. */
      .composer .emoji-toggle { position: absolute; right: 0; bottom: 0; width: 40px; height: 40px; }
      .composer .emoji-toggle svg { width: 22px; height: 22px; }
      .composer .emoji-toggle { border: 0; background: none; }
      .composer .emoji-toggle:hover { color: var(--mc-text); }
      .composer .emoji-toggle.on { color: var(--mc-primary); }
      /* The emojis over the bar, on the right, beside their button. */
      .emoji-popover {
        position: absolute;
        right: var(--chat-gutter);
        bottom: calc(100% + 6px);
        z-index: 50;
        width: 360px;
        max-width: calc(100% - 24px);
        border-radius: 12px;
        box-shadow: var(--mc-shadow);
      }
      .emoji-popover .emoji-picker { max-width: none; background: var(--mc-surface); }
      /* Its groups in one row, as wide as it is. */
      .emoji-popover .emoji-groups, .reaction-picker .emoji-groups { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); }
      .emoji-popover .emoji-groups button, .reaction-picker .emoji-groups button { width: auto; }
      .composer textarea {
        position: relative;
        flex: 1;
        min-width: 0;
        background: transparent;
        /* Scrolled without a bar, which the text behind has not. */
        scrollbar-width: none;
        min-height: 40px;
        max-height: calc(8 * 1.45em + 20px);
        /* Room on the right for the emojis' button. */
        padding: 9px 42px 9px 12px;
        line-height: 1.45;
        resize: none;
        overflow-y: auto;
        overflow-wrap: anywhere;
      }
      /* The text behind, laid out as the field's, unseen but for what goes
         past what a message takes. */
      .composer .backdrop {
        position: absolute;
        inset: 0;
        overflow: hidden;
        padding: 9px 42px 9px 12px;
        border: 1px solid transparent;
        border-radius: 8px;
        background: var(--mc-page);
        color: transparent;
        line-height: 1.45;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      /* Near the end, faintly; past it, plainly, and the field with it. */
      .composer .backdrop mark {
        border-radius: 2px;
        background: color-mix(in srgb, var(--mc-danger) 18%, transparent);
        color: transparent;
      }
      .composer .backdrop mark.over { background: color-mix(in srgb, var(--mc-danger) 45%, transparent); }
      .composer .field.over textarea { border-color: var(--mc-danger); }
      .composer .count { font-size: 12px; font-family: var(--mc-mono); line-height: 40px; }
      .composer .count.over { color: var(--mc-danger); }
      .composer button { min-height: 40px; }
      .composer .send { display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
      .composer .send .icon { display: flex; }
      .composer .send svg { width: 18px; height: 18px; }
      /* Narrow, its icon alone, as square as it is tall. */
      @media (max-width: 835px) {
        .composer .send { min-width: 44px; padding: 0 10px; }
        .composer .send .label { display: none; }
      }
      .composer .error { flex-basis: 100%; margin: 0; color: var(--mc-muted); font-size: 12px; }
      .composer .error:empty { display: none; }

      /*
       * The welcome, with no radios yet: the whole screen, without the bars,
       * the language at the top and, in the middle, one step at a time.
       */
      .welcome-screen {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        padding: 16px;
        background: var(--mc-page);
      }
      /* As tall as back by touch (44px), there or not: the language does
         not move from one step to the next. */
      .welcome-top { display: flex; align-items: center; justify-content: flex-end; gap: 12px; min-height: 44px; }
      .welcome-top .welcome-back { align-self: center; margin: 0 auto 0 0; }
      /* Back up beside the language on a phone, over the form elsewhere;
         and less room around the steps, for a screen short of height. */
      .welcome-back.up { display: none; }
      @media (max-width: 835px), (max-height: 500px) and (pointer: coarse) {
        .welcome-back.up { display: inline-flex; }
        .welcome-radio > .welcome-back { display: none; }
        .welcome-screen .welcome-body { padding: 12px 0 16px; }
        .welcome-screen .welcome-radio { gap: 16px; }
      }
      /*
       * A phone on its side: wide but short. The radio's form in two
       * columns, the choices side by side and then the two fields, and the
       * cards with their icon beside the words, so that it takes half the
       * height.
       */
      @media (max-height: 500px) and (pointer: coarse) and (orientation: landscape) {
        .welcome-screen .welcome-body > * { max-width: 760px; }
        .welcome-screen .welcome-radio {
          display: grid;
          grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
          gap: 12px 20px;
          align-items: start;
        }
        .welcome-radio > h1,
        .welcome-radio > .error,
        .welcome-radio > .welcome-go { grid-column: 1 / -1; }
        .welcome-radio .welcome-card { padding: 10px 12px; }
        .welcome-radio .welcome-card:has(> .icon) {
          display: grid;
          grid-template-columns: auto minmax(0, 1fr);
          column-gap: 10px;
        }
        .welcome-radio .welcome-card > .icon { grid-row: span 2; margin: 0; }
        .welcome-screen .welcome-hello { gap: 12px; }
        .welcome-screen .welcome-logo { width: 52px; height: 52px; margin: 0; }
        .welcome-screen { padding: 8px 16px; }
        .welcome-screen .welcome-body { padding: 8px 0; }
        .welcome-radio > h1, .welcome-linking > h1 { font-size: 20px; }
        /* The steps and, when the radio does not answer, why, side by side. */
        .welcome-screen .welcome-linking {
          display: grid;
          grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
          gap: 8px 16px;
          align-items: start;
        }
        .welcome-linking > h1, .welcome-linking > .welcome-address { grid-column: 1 / -1; }
        .welcome-linking .welcome-steps, .welcome-linking .welcome-failed { margin: 0; }
      }
      .welcome-language { position: relative; display: flex; align-items: center; }
      /* The span, not the svg in it, which has the class "icon" too. */
      .welcome-language > .icon { position: absolute; top: 50%; left: 12px; transform: translateY(-50%); color: var(--mc-muted); pointer-events: none; }
      .welcome-language svg { display: block; width: 18px; height: 18px; }
      .welcome-language select { min-height: 40px; padding-left: 40px; background: var(--mc-surface); }
      .welcome-body { flex: 1; display: grid; place-items: center; padding: 24px 0 48px; }
      .welcome-body > * { width: 100%; max-width: 520px; }
      .welcome-screen h1 { margin: 0; font-size: 24px; line-height: 1.25; }
      .welcome-screen p { margin: 0; }
      .welcome-go {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 44px;
        padding: 0 22px;
        border-radius: 10px;
        font-size: 15px;
      }
      .welcome-screen span.icon { display: flex; }
      .welcome-go .icon svg { width: 18px; height: 18px; }

      /* What meshctl is. */
      .welcome-hello { display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center; }
      .welcome-logo { width: 72px; height: 72px; margin-bottom: 4px; stroke: var(--mc-primary); stroke-width: 1.6; }
      .welcome-hello h1 { font-size: 30px; }
      .welcome-lead { max-width: 440px; color: var(--mc-muted); font-size: 16px; }
      .welcome-hello .welcome-go { margin-top: 8px; }
      .welcome-small { max-width: 400px; color: var(--mc-muted); font-size: 13px; }

      /* The radio: what it is, how it is reached, its address, its name. */
      .welcome-radio { display: flex; flex-direction: column; gap: 20px; }
      .welcome-back {
        align-self: flex-start;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin: 0 0 -8px;
        padding: 4px 0;
        border: 0;
        background: none;
        color: var(--mc-muted);
      }
      .welcome-back:hover { color: var(--mc-text); }
      .welcome-back svg { width: 16px; height: 16px; }
      .welcome-radio fieldset { min-width: 0; margin: 0; padding: 0; border: 0; }
      .welcome-radio legend,
      .welcome-radio .field > .label {
        padding: 0;
        margin-bottom: 8px;
        color: var(--mc-muted);
        font-size: 13px;
        font-weight: 600;
      }
      .welcome-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      .welcome-card {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 2px;
        padding: 14px 16px;
        border-radius: 12px;
        background: var(--mc-surface);
        text-align: left;
      }
      .welcome-card > .icon { margin-bottom: 6px; color: var(--mc-muted); }
      .welcome-card .icon svg { width: 22px; height: 22px; }
      .welcome-card .title { font-size: 15px; font-weight: 600; }
      .welcome-card .detail { color: var(--mc-muted); font-size: 12px; }
      .welcome-card.on {
        border-color: var(--mc-primary);
        box-shadow: inset 0 0 0 1px var(--mc-primary);
        background: color-mix(in srgb, var(--mc-primary) 8%, var(--mc-surface));
      }
      .welcome-card.on .icon { color: var(--mc-primary); }
      .welcome-radio .field { display: flex; flex-direction: column; }
      .welcome-radio .field > .label { display: block; }
      .welcome-radio .optional { font-weight: 400; }
      /* 16px: a phone does not zoom in to write in it. */
      .welcome-radio input { min-height: 44px; font-size: 16px; }
      .welcome-radio .hint { margin-top: 6px; color: var(--mc-muted); font-size: 12px; }
      .welcome-radio .error { color: var(--mc-danger); }

      /* The link coming up. */
      .welcome-linking { display: flex; flex-direction: column; gap: 12px; }
      .welcome-address { color: var(--mc-muted); overflow-wrap: anywhere; }
      .welcome-steps {
        display: grid;
        gap: 2px;
        margin: 8px 0 0;
        padding: 8px;
        border: 1px solid var(--mc-border);
        border-radius: 12px;
        background: var(--mc-surface);
        list-style: none;
      }
      .welcome-steps li { display: flex; align-items: center; gap: 12px; padding: 10px 8px; color: var(--mc-muted); }
      .welcome-steps li > .icon { flex: none; width: 22px; height: 22px; align-items: center; justify-content: center; }
      .welcome-steps .icon svg { width: 22px; height: 22px; }
      .welcome-steps li.later > .icon::before {
        content: "";
        width: 14px;
        height: 14px;
        border: 2px solid var(--mc-border);
        border-radius: 50%;
      }
      .welcome-steps li.done { color: var(--mc-text); }
      .welcome-steps li.done .icon { color: var(--mc-ok); }
      .welcome-steps li.now { color: var(--mc-text); font-weight: 600; }
      .welcome-steps li.now .icon { color: var(--mc-primary); }
      .welcome-steps li.now .icon svg { animation: welcome-spin 1s linear infinite; }
      .welcome-steps li.stuck { color: var(--mc-text); font-weight: 600; }
      .welcome-steps li.stuck .icon { color: var(--mc-warn); }
      .welcome-steps .count { color: var(--mc-muted); font-weight: 400; }
      .welcome-steps .count::before { content: " · "; }
      @keyframes welcome-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        .welcome-steps li.now .icon svg { animation: none; }
      }
      .welcome-failed {
        display: grid;
        gap: 10px;
        margin-top: 4px;
        padding: 16px;
        border: 1px solid color-mix(in srgb, var(--mc-warn) 45%, var(--mc-border));
        border-radius: 12px;
        background: color-mix(in srgb, var(--mc-warn) 8%, var(--mc-surface));
      }
      .welcome-failed .what { font-weight: 600; overflow-wrap: anywhere; }
      .welcome-failed .hint { color: var(--mc-muted); font-size: 13px; }
      .welcome-failed .buttons { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
      .welcome-failed .buttons button { min-height: 40px; padding: 0 16px; border-radius: 10px; }
      .welcome-failed .link {
        justify-self: start;
        padding: 0;
        border: 0;
        background: none;
        color: var(--mc-muted);
        font-size: 13px;
        text-decoration: underline;
      }
      .welcome-failed .link:hover { color: var(--mc-text); }

      /*
       * A radio's button, as the list and the editor show it: the rail's own
       * look, or its colour in full, as when it is selected (--badge-on, and
       * --badge-on-ink for what is on it).
       */
      .face {
        flex: none;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 40px;
        height: 40px;
        border-radius: 12px;
        border: 1px solid var(--mc-rail-button-edge);
        background: var(--mc-rail-button);
        color: var(--mc-text);
        font-weight: 700;
        font-size: 13px;
      }
      .face.colored { background: var(--badge-on); border-color: var(--badge-on); color: var(--badge-on-ink); }
      .face .emoji { font-size: 20px; line-height: 1; font-weight: 400; }
      .face .pict, .rail-button .pict { display: flex; }
      .face .pict svg { width: 20px; height: 20px; }
      /* Three or four characters, as a node's short name, smaller to fit. */
      .glyph.long { font-size: 0.8em; letter-spacing: -0.02em; }
      .face.big { width: 72px; height: 72px; border-radius: 20px; font-size: 22px; }
      .face.big .emoji { font-size: 34px; }
      .face.big .pict svg { width: 34px; height: 34px; }

      /* The radios: their list, centred, the page's own. */
      .radios {
        width: 100%;
        max-width: 760px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .radios .hint { font-size: 12px; margin: 4px 2px 0; }
      .radio-row {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 12px;
        border: 1px solid var(--mc-border);
        border-radius: 12px;
        background: var(--mc-surface);
      }
      .radio-row.selected { border-color: var(--mc-primary); background: var(--mc-soft); }
      .radio-row.hidden .pick,
      .radio-row.hidden .face-button { opacity: 0.6; }
      .radio-row.dragging { opacity: 0.4; }
      .radio-row.over { border-style: dashed; border-color: var(--mc-primary); }
      .radio-row .grip { flex: none; display: flex; color: var(--mc-muted); cursor: grab; }
      .radio-row .grip svg { width: 16px; height: 16px; }
      .radio-row .moves { flex: none; display: flex; flex-direction: column; }
      .radio-row .moves button {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 22px;
        height: 18px;
        padding: 0;
        border: 0;
        background: transparent;
        color: var(--mc-muted);
      }
      .radio-row .moves button:hover:not(:disabled) { color: var(--mc-text); }
      .radio-row .moves button:disabled { opacity: 0.3; }
      .radio-row .moves svg { width: 14px; height: 14px; }
      .radio-row .face-button { flex: none; padding: 0; border: 0; border-radius: 12px; background: transparent; }
      .radio-row .face-button:hover .face { outline: 2px solid var(--mc-primary); outline-offset: 2px; }
      .radio-row .pick {
        flex: 1;
        min-width: 0;
        display: flex;
        align-items: center;
        padding: 0;
        border: 0;
        background: transparent;
        text-align: left;
      }
      .radio-row .who { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
      .radio-row .name { display: flex; align-items: center; gap: 8px; }
      .radio-row .who .mono { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .radio-row .badge { white-space: nowrap; font-size: 12px; font-weight: 400; }
      .radio-row .eye {
        flex: none;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 34px;
        height: 34px;
        padding: 0;
        background: transparent;
      }
      .radio-row .eye.off { color: var(--mc-muted); }
      .radio-row .eye svg { width: 18px; height: 18px; }
      .tag {
        padding: 0 6px;
        border-radius: 6px;
        background: var(--mc-raised);
        color: var(--mc-muted);
        font-size: 11px;
        font-weight: 400;
      }
      .switch {
        flex: none;
        position: relative;
        width: 40px;
        height: 22px;
        padding: 0;
        border: 0;
        border-radius: 11px;
        background: var(--mc-raised);
        box-shadow: inset 0 0 0 1px var(--mc-border);
      }
      .switch.on { background: var(--mc-primary); box-shadow: none; }
      .switch span {
        position: absolute;
        top: 3px;
        left: 3px;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #ffffff;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
        transition: left 0.15s;
      }
      .switch.on span { left: 21px; }

      /*
       * A radio's editor: over the list, in the middle of the window. Its
       * two sections take the same room, so that going from one to the
       * other moves nothing.
       */
      .modal-back {
        position: fixed;
        inset: 0;
        z-index: 3000;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        background: rgba(0, 0, 0, 0.5);
      }
      .radio-editor {
        width: 500px;
        max-width: 100%;
        display: flex;
        flex-direction: column;
        gap: 16px;
        padding: 20px 24px;
        container-type: inline-size;
      }
      .radio-editor.modal {
        max-height: 100%;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
      }
      .editor-head { display: flex; align-items: center; gap: 14px; }
      .editor-head .face { width: 56px; height: 56px; border-radius: 16px; font-size: 18px; }
      .editor-head .face .emoji { font-size: 28px; }
      .editor-head .face .pict svg { width: 28px; height: 28px; }
      .editor-head .who { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
      .editor-head h2 { margin: 0; font-size: 16px; }
      .editor-head .mono { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .editor-head .close {
        flex: none;
        align-self: flex-start;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-left: auto;
        width: 32px;
        height: 32px;
        padding: 0;
        border: 0;
        background: transparent;
        color: var(--mc-muted);
      }
      .editor-head .close svg { width: 20px; height: 20px; }
      .editor-head .close:hover { color: var(--mc-text); background: var(--mc-raised); }
      /* Both sections in the same room; less, scrolling, in a short window. */
      /* Room on its sides for the fields' focus ring, which it would clip. */
      .editor-body {
        flex: 0 1 396px;
        height: 396px;
        min-height: 0;
        margin: 0 -4px;
        padding: 3px 4px;
        overflow-y: auto;
      }
      .radio-editor .fields,
      .button-look { display: flex; flex-direction: column; gap: 16px; }
      .radio-editor label,
      .radio-editor .field { display: grid; gap: 6px; align-content: start; }
      .radio-editor label > .dim,
      .radio-editor .field > .dim { font-size: 12px; }
      .radio-editor .hint { font-size: 12px; }
      .radio-editor .toggle { display: flex; align-items: center; gap: 10px; }
      .radio-editor .toggle > span { display: flex; flex-direction: column; }
      .radio-editor .toggle .dim { font-size: 12px; }
      /* Twelve in a row; two rows of six when the editor is narrow. */
      .swatches { display: grid; grid-template-columns: repeat(12, 32px); gap: 6px; }
      @container (max-width: 440px) {
        .swatches { grid-template-columns: repeat(6, 32px); gap: 8px; }
      }
      .swatch {
        width: 32px;
        height: 32px;
        padding: 0;
        border: 2px solid transparent;
        border-radius: 50%;
        background: var(--swatch);
        cursor: pointer;
      }
      .swatch:hover { border-color: var(--mc-muted); }
      .swatch.on { border-color: var(--mc-text); box-shadow: inset 0 0 0 2px var(--mc-surface); }
      /* None: the rail's own button at rest, and the accent selected. */
      .swatch.none {
        --swatch-rest: var(--mc-rail-button);
        --swatch: var(--mc-primary);
        border: 1px dashed var(--mc-muted);
      }
      /* Both of a colour's tones: at rest, top left; selected, bottom right. */
      .swatch.none,
      .swatch.split,
      .swatch.other.split {
        background: linear-gradient(135deg, var(--swatch-rest) 50%, var(--swatch) 50%);
        background-origin: border-box;
      }
      .swatch.none.on { border: 2px solid var(--mc-text); }
      /* Any other colour: the wheel until one is picked, then that one. */
      .swatch.other {
        position: relative;
        background: var(--swatch, conic-gradient(#f06595, #f0a63a, #a9e34b, #38d9a9, #4dabf7, #9775fa, #f06595));
        /* The wheel from the edge in, not tiled under its border. */
        background-origin: border-box;
      }
      .swatch.other input {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        padding: 0;
        border: 0;
        opacity: 0;
        cursor: pointer;
      }
      .gone { display: none !important; }
      /* A pill that slides under the option picked, of --n of them. */
      .segmented {
        position: relative;
        display: grid;
        grid-template-columns: repeat(var(--n, 3), minmax(0, 1fr));
        padding: 3px;
        border: 1px solid var(--mc-border);
        border-radius: 10px;
        background: var(--mc-surface-2);
      }
      .segmented::before {
        content: "";
        position: absolute;
        top: 3px;
        bottom: 3px;
        left: 3px;
        width: calc((100% - 6px) / var(--n, 3));
        border-radius: 7px;
        background: var(--mc-primary);
        transform: translateX(calc(var(--at, 0) * 100%));
        transition: transform 0.2s ease;
      }
      .segmented button {
        position: relative;
        min-height: 32px;
        padding: 0 12px;
        border: 0;
        background: transparent;
        color: var(--mc-muted);
        transition: color 0.2s;
      }
      .segmented button:hover { color: var(--mc-text); }
      .segmented button.on { color: var(--mc-on-primary); font-weight: 600; }
      /* What the button shows: one panel, the same size for the three. */
      .look-panel {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 240px;
        padding: 12px;
