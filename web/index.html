      .key .icon { display: flex; }
      .key svg { width: 16px; height: 16px; }
      .channel-foot { display: flex; align-items: center; gap: 12px; margin-top: 4px; }
      .channel-foot .hint { flex: 1; margin: 0; font-size: 12px; }
      .channel-foot .add { display: inline-flex; align-items: center; gap: 6px; }
      .channel-foot .add svg { width: 16px; height: 16px; display: block; }
      /*
       * While the words and the two ways of adding do not fit in a line, by
       * the list's own width and not the screen's: the words in a line of
       * their own, centred, and both buttons together under them, sharing
       * the whole width.
       */
      @container channels (max-width: 680px) {
        .channel-foot { flex-wrap: wrap; }
        .channel-foot .hint { flex: 1 1 100%; text-align: center; }
        .channel-foot .add { flex: 1 1 0; justify-content: center; }
      }
      .channel-editor .removing p { margin: 0 0 12px; font-size: 13px; }
      .channel-editor .precision b { margin-left: 6px; color: var(--mc-text); font-weight: 600; }
      .channel-editor .precision input[type=range] {
        width: 100%;
        margin: 4px 0 0;
        accent-color: var(--mc-primary);
      }
      /* A position's precision among a section's settings: how far off,
         over its range, and its ends under it. */
      .precision-field { display: flex; flex-direction: column; gap: 2px; }
      .precision-field b { font-weight: 600; }
      .precision-field input[type=range] { width: 100%; margin: 4px 0 0; accent-color: var(--mc-primary); }
      .precision-field .ends { display: flex; justify-content: space-between; font-size: 11px; }
      .channel-editor .precision .ends {
        display: flex;
        justify-content: space-between;
        font-size: 11px;
      }
      /* The key as it is: what kind, and itself when asked for. */
      .key-now { display: flex; align-items: center; gap: 8px; min-height: 36px; }
      .key-now .key { margin-right: auto; }
      .key-shown { display: flex; align-items: center; gap: 6px; }
      .key-shown .key-text { flex: 1 1 auto; min-width: 0; font-size: 12px; }
      .icon-button {
        flex: none;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 34px;
        height: 34px;
        padding: 0;
        color: var(--mc-muted);
      }
      .icon-button:hover,
      .icon-button.on { color: var(--mc-text); }
      .icon-button svg { width: 18px; height: 18px; }
      .save-bar { display: flex; justify-content: flex-end; gap: 8px; }
      .save-bar button { min-width: 110px; }
      .save-bar .start { display: flex; margin-right: auto; }
      .save-bar .from-link { min-width: 0; display: inline-flex; align-items: center; gap: 6px; }
      .save-bar .from-link .icon { display: flex; color: var(--mc-muted); }
      .save-bar .from-link svg { width: 16px; height: 16px; }
      .sections-tab {
        display: grid;
        grid-template-columns: 220px minmax(0, 1fr);
        gap: 24px;
        align-items: start;
      }
      .section-list { display: flex; flex-direction: column; gap: 2px; }
      .section-list button {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: var(--mc-muted);
        text-align: left;
      }
      .section-list button:hover { background: var(--mc-raised); color: var(--mc-text); }
      .section-list button.on { background: var(--mc-soft); color: var(--mc-text); font-weight: 600; }
      .section-list .label { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .section-list .state {
        flex: none;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--mc-far);
      }
      .section-list .state.on { background: var(--mc-ok); }
      .section-list .state.none { visibility: hidden; }
      .section-list .edited { margin-left: auto; font-weight: 400; }
      .section-panel { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
      .section-head { display: flex; align-items: center; gap: 10px; }
      .section-head h2 { margin: 0; font-size: 18px; }
      .section-panel form { display: flex; flex-direction: column; gap: 16px; }
      /* Each setting a row, as the other tabs': narrower controls beside
         the list of sections. */
      .section-panel .pref-control { width: 300px; }
      .section-panel .pref-what .tag { margin-left: 6px; font-weight: 400; }
      .interval-field { display: flex; gap: 6px; }
      .interval-field select { flex: 1; min-width: 0; }
      .interval-field .number-field { width: 150px; }
      /*
       * The nodes a radio hears: each with its short name in a circle the
       * colour of how far it is, as on the map; the whole row opens it.
       */
      .node-list { width: 100%; max-width: 1200px; margin: 0 auto; container: nodes / inline-size; }
      .node-tools { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
      .node-tools .segmented { width: 420px; max-width: 100%; }
      .node-tools .segmented button { padding: 0 8px; white-space: nowrap; }
      /* As wide as the reach beside it, where there is room; less where not. */
      .node-search { display: flex; gap: 8px; flex: 0 1 420px; min-width: 0; margin-left: auto; }
      .node-search input { flex: 1 1 auto; min-width: 0; }
      /* The sorting, for when the list has no headings: see below. */
      .sort-menu { display: none; position: relative; }
      /* As high as the search, by stretching, and as wide: a square. */
      .sort-menu > .icon-button { width: 40px; height: auto; border: 1px solid var(--mc-border); border-radius: 10px; }
      .sort-menu > .icon-button.sorted { color: var(--mc-primary); }
      .sort-menu .heading-menu button { justify-content: space-between; gap: 24px; }
      .sort-menu .heading-menu button.on { color: var(--mc-primary); font-weight: 600; }
      .sort-menu .heading-menu button.on .icon { color: var(--mc-primary); }
      .nodes-table { width: 100%; border-collapse: collapse; }
      .nodes-table th {
        padding: 8px 10px;
        border-bottom: 1px solid var(--mc-border);
        color: var(--mc-muted);
        font-size: 12px;
        font-weight: 600;
        text-align: left;
      }
      .nodes-table td { padding: 8px 10px; border-bottom: 1px solid var(--mc-border); vertical-align: middle; }
      .nodes-table tbody tr:last-child td { border-bottom: 0; }
      .nodes-table th .sort {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 0;
        border: 0;
        background: transparent;
        color: inherit;
        font: inherit;
      }
      .nodes-table th .sort:hover,
      .nodes-table th .sort.on { color: var(--mc-text); }
      .nodes-table th .arrow { display: flex; }
      .nodes-table th .arrow svg { width: 14px; height: 14px; }
      .node-row { cursor: pointer; }
      .node-row:hover { background: var(--mc-raised); }
      .node-row .who { display: flex; align-items: center; gap: 12px; }
      .node-avatar {
        flex: none;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: var(--node-bg, var(--mc-node-far));
        color: var(--node-fg, #ffffff);
        font-size: 11px;
        font-weight: 700;
        overflow: hidden;
      }
      @supports (color: oklch(from red l c h)) {
        .node-avatar {
          --lightness: clamp(var(--mc-avatar-l-min), l, var(--mc-avatar-l-max));
          background: oklch(from var(--node-bg, var(--mc-node-far)) var(--lightness) min(c, var(--mc-avatar-c-max)) h);
          color: oklch(from var(--node-bg, var(--mc-node-far)) clamp(0, (var(--mc-avatar-ink-at) - var(--lightness)) * 1000, 1) 0 0);
        }
      }
      .node-avatar.emoji { font-size: 20px; }
      .topbar .node-avatar.emoji { font-size: 18px; }
      .nodes-table .names { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
      .nodes-table .name { display: flex; align-items: center; gap: 6px; min-width: 0; font-weight: 600; }
      /* Cut short when there is no room, its marks always shown after it. */
      .nodes-table .name > .text { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .nodes-table .name > .mark { flex: none; }
      .nodes-table .mono.dim, .nodes-table .small { font-size: 12px; }
      .nodes-table .mark { display: flex; color: var(--mc-muted); }
      .nodes-table .mark.to-map {
        padding: 2px;
        margin: -2px;
        border: 0;
        border-radius: 4px;
        background: none;
      }
      .nodes-table .mark.to-map:hover { color: var(--mc-primary); background: var(--mc-soft); }
      .nodes-table .mark svg { width: 14px; height: 14px; }
      .nodes-table .mark.star { color: var(--mc-primary); }
      .nodes-table .mark.star svg { fill: currentColor; }
      .power { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
      .power .icon { display: flex; color: var(--mc-muted); }
      .power svg { width: 16px; height: 16px; }
      .power.low { color: var(--mc-danger); }
      .nodes-table .actions { width: 1%; text-align: right; }
      .nodes-table .actions .icon-button { opacity: 0; }
      .node-row:hover .actions .icon-button,
      .nodes-table .actions .icon-button:focus-visible { opacity: 1; }
      /* Adding one the radio does not keep: always in sight, in the accent. */
      .nodes-table .actions { white-space: nowrap; }
      .nodes-table .actions .icon-button { display: inline-flex; vertical-align: middle; }
      .nodes-table .actions .icon-button.keep { opacity: 1; color: var(--mc-primary); }
      .flag-chips { display: flex; flex-wrap: wrap; gap: 6px; }
      .flag-chips .choice { min-height: 32px; padding: 0 12px; font-size: 13px; }
      /*
       * Where a radio is: its latitude and longitude, its altitude if it
       * takes one, and a button to pick it on a map; all in a row, on a
       * phone too.
       */
      .position-inputs { display: grid; grid-template-columns: 1fr 1fr 40px; gap: 8px; }
      .position-inputs.with-altitude { grid-template-columns: 1fr 1fr 0.7fr 40px; }
      .position-inputs input { min-width: 0; }
      .position-pick { display: flex; align-items: center; justify-content: center; padding: 0; min-height: 40px; }
      .position-pick svg { width: 18px; height: 18px; }
      /* Off while a GPS says where the radio is. */
      .position-inputs input:disabled,
      .position-pick:disabled { opacity: 0.55; cursor: not-allowed; }
      /* Off while a GPS says where the radio is. */
      .position-inputs input:disabled,
      .position-pick:disabled { opacity: 0.55; cursor: not-allowed; }
      /* The map to pick it on, its panes kept within it, under the dialog's
         edges; the pin, the interface's, its point where the place is. */
      .position-dialog { width: 640px; }
      .position-map {
        position: relative;
        z-index: 0;
        height: min(420px, 55vh);
        border: 1px solid var(--mc-border);
        border-radius: 12px;
        overflow: hidden;
      }
      /* What is picked, and the button for where this device is, side by
         side however narrow: the place breaks in two before it moves. */
      .position-under { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 12px; }
      .position-readout { flex: 1; min-width: 0; font-size: 13px; overflow-wrap: anywhere; }
      .position-here { flex: none; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
      /* On a phone, its buttons side by side across the whole of it, each
         as wide as its words and the room left shared out. */
      @media (max-width: 835px) {
        .position-dialog .buttons button { flex: 1 1 auto; padding-left: 12px; padding-right: 12px; white-space: nowrap; }
      }
      .position-here .icon { display: flex; }
      .position-here .icon svg { width: 18px; height: 18px; }
      .position-note { margin: 8px 0 0; font-size: 13px; }
      .mc-picked { display: block; width: 36px; height: 36px; color: var(--mc-primary); filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.35)); }
      .mc-picked svg { display: block; width: 36px; height: 36px; fill: currentColor; stroke: none; }
      .leaflet-marker-draggable .mc-picked { cursor: grab; }
      .secret-field { display: flex; align-items: center; gap: 6px; }
      .secret-field input { flex: 1; min-width: 0; }
      .section-panel .note { padding: 8px 12px; }
      @media (max-width: 835px) {
        .sections-tab { grid-template-columns: minmax(0, 1fr); }
      }

      /*
       * A node's page: what is amiss over all, its figures in a row, then
       * its data in sections, flat as the settings' rows, each with when it
       * came and what asks for it anew; the requests and who it is aside.
       */
      .node-page {
        width: 100%;
        max-width: 1200px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }
      .node-checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
      .node-checks li {
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding: 10px 14px;
        border-left: 3px solid var(--mc-warn);
        border-radius: 0 8px 8px 0;
        background: var(--mc-surface);
        font-size: 13px;
      }
      .node-checks li > span:not(.ask-split) { color: var(--mc-muted); }
      .node-checks li.info { border-left-color: var(--mc-primary); color: var(--mc-muted); }
      .node-checks li.ask-row {
        flex-direction: row;
        align-items: center;
        gap: 12px;
        padding: 6px 8px 6px 14px;
        color: var(--mc-text);
      }
      /* Its button whole, the words beside giving way. */
      .node-checks li.ask-row > button { flex: none; white-space: nowrap; }
      .node-figures {
        display: flex;
        flex-wrap: wrap;
        gap: 12px 0;
        padding-bottom: 20px;
        border-bottom: 1px solid var(--mc-border);
      }
      .figure {
        display: flex;
        flex-direction: column;
        gap: 4px;
        min-width: 160px;
        padding: 0 28px;
        border-left: 1px solid var(--mc-border);
      }
      .figure:first-child { padding-left: 4px; border-left: 0; }
      .figure .label { font-size: 12px; color: var(--mc-muted); }
      .figure .value {
        font-size: 22px;
        font-weight: 650;
        line-height: 1.2;
        font-variant-numeric: tabular-nums;
      }
      .figure .sub { font-size: 12px; color: var(--mc-muted); font-variant-numeric: tabular-nums; }
      .figure .bar {
        display: block;
        width: 120px;
        height: 4px;
        border-radius: 2px;
        background: var(--mc-raised);
        overflow: hidden;
      }
      .figure .bar i { display: block; height: 100%; border-radius: 2px; background: var(--mc-ok); }
      .figure.low .value { color: var(--mc-danger); }
      .figure.low .bar i { background: var(--mc-danger); }
      /* Sections in columns that even themselves out, whatever each holds. */
      .node-sections {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0 40px;
        align-items: start;
      }
      .node-column { display: flex; flex-direction: column; min-width: 0; }
      /* The radio's own page: its sections in two columns as long as each
         other, whatever each radio has to show; one under the other where
         two do not fit. */
      .node-sections.balanced { display: block; column-count: 2; column-gap: 40px; }
      .node-sections.balanced > .node-section { break-inside: avoid; }
      @media (max-width: 1000px) {
        .node-sections { grid-template-columns: minmax(0, 1fr); }
        .node-sections.balanced { column-count: 1; }
      }
      /* The radio's own page: since when its link is so, beside it. */
      .facts .since { margin-left: 8px; font-size: 12px; }
      /* Its settings' tabs, the whole width: five in a row, or three and the
         last two together under them, where five do not fit. */
      /* The radio's contact to share: its QR beside how, and the link. The
         QR dark on white whatever the theme, as scanners read best. */
      .contact-share { container: contact / inline-size; }
      /* Another node's contact, over the page: the QR over the words. */
      .contact-modal { width: 420px; max-width: 100%; padding: 16px 20px 20px; }
      .contact-modal header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
      .contact-modal h2 { margin: 0; font-size: 16px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .contact-share .contact { display: flex; align-items: center; gap: 16px; }
      .contact-share .qr { flex: none; width: 168px; height: 168px; border-radius: 10px; overflow: hidden; background: #fff; }
      /* Its own fill, none of the icons' stroke, and square modules. */
      .contact-share .qr svg { display: block; width: 100%; height: 100%; shape-rendering: crispEdges; }
      .contact-share .qr svg * { stroke: none; }
      .contact-share .contact-words { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
      .contact-share .hint { margin: 0; color: var(--mc-muted); font-size: 13px; }
      .contact-share .copyable { display: flex; align-items: center; gap: 6px; min-width: 0; }
      .contact-share .contact-link { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
      .contact-share .copyable .icon-button { flex: none; }
      .contact-share .copyable .icon-button svg { width: 16px; height: 16px; }
      /* The QR over the words, in the middle, while the words do not fit
         beside it: by the section's own width, a phone's or a column's. */
      @container contact (max-width: 520px) {
        .contact-share .contact { flex-direction: column; align-items: stretch; }
        .contact-share .qr { align-self: center; width: 200px; height: 200px; }
      }
      /* A MeshCore node's path, and the radio's advert: a word on them,
         and what can be done, beside how it went. */
      .mc-path .hint, .mc-advert .hint { margin: 8px 0 0; font-size: 12px; }
      .mc-advert .hint { margin-top: 0; }
      /* The regions found, under the default region: the search and how
         many answered, then each region, picked as the default, with how
         many repeaters serve it and of those how many straight; those none
         heard straight serve faded. */
      .region-control { display: flex; align-items: center; gap: 12px; }
      .region-chips { flex: 1 1 100%; }
      .region-chips:empty { display: none; }
      .region-chips .choice { display: inline-flex; align-items: center; gap: 8px; }
      .region-chips .choice.far:not(.on),
      .channel-regions .choice.far:not(.on) { opacity: 0.6; }
      .region-chips .served,
      .channel-regions .served,
      .heading-menu .served { font-size: 11px; font-variant-numeric: tabular-nums; color: var(--mc-muted); }
      .channel-regions .served { margin-left: 4px; }
      .channel-regions .choice.on .served { color: inherit; }
      .heading-menu .served { margin-left: auto; }
      .heading-menu button.far:not(.on) .label { opacity: 0.6; }
      /* A search of the regions nearby, from where one is picked. */
      .heading-menu .region-search { color: var(--mc-muted); }
      .heading-menu .separator { height: 1px; margin: 4px 12px; background: var(--mc-border); }
      .channel-regions .region-search { border-style: dashed; }
      /* The region a channel floods in reaches no repeater heard straight. */
      .region-unserved { color: var(--mc-warn); }
      .region-chips .choice.on .served { color: inherit; }
      .region-warning { flex: 1 1 100%; margin: 0; font-size: 13px; color: var(--mc-warn); }
      /* A repeater's regions: each a chip, not a button. */
      .regions-section .regions { margin-bottom: 8px; }
      .regions-section .regions .choice { display: inline-flex; align-items: center; cursor: default; }
      .regions-section .hint { margin: 0 0 8px; font-size: 12px; }
      .regions-section .warn { color: var(--mc-warn); }
      /* The end of the nodes drawn, while there are more. */
      .more-rows td { padding: 14px 8px; text-align: center; color: var(--mc-muted); font-size: 12px; }
      .path-actions { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 12px; margin-top: 12px; }
      .path-actions span { font-size: 13px; }
      .path-actions .problem { color: var(--mc-danger); }
      .own-shortcuts { container: shortcuts / inline-size; }
      .own-shortcuts .shortcuts { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
      .own-shortcuts .shortcuts button { min-width: 0; min-height: 34px; padding: 0 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      @container shortcuts (max-width: 560px) {
        .own-shortcuts .shortcuts { grid-template-columns: repeat(6, minmax(0, 1fr)); }
        .own-shortcuts .shortcuts button { grid-column: span 2; }
        .own-shortcuts .shortcuts button:nth-child(n + 4) { grid-column: span 3; }
      }
      /* Four, as a MeshCore radio's tabs: in a row the whole width, or two
         by two where the four do not fit. */
      .own-shortcuts .shortcuts.pairs { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .own-shortcuts .shortcuts.pairs button,
      .own-shortcuts .shortcuts.pairs button:nth-child(n + 4) { grid-column: auto; }
      @container shortcuts (max-width: 440px) {
        .own-shortcuts .shortcuts.pairs { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      }
      /* Advertising: both ways side by side, the whole width; how it went
         under them. */
      .advert-actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .advert-actions > span { grid-column: 1 / -1; }
      /* The kinds a MeshCore radio adds by itself: in a row the whole width
         of the control, or two by two where the four do not fit, by the
         control's own width. */
      .kinds-box { container: kinds / inline-size; }
      .flag-chips.kinds { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .flag-chips.kinds .choice { justify-content: center; padding: 0 6px; }
      @container kinds (max-width: 420px) {
        .flag-chips.kinds { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      }
      .node-section {
        break-inside: avoid;
        padding: 0 4px 18px;
        margin-bottom: 18px;
        border-bottom: 1px solid var(--mc-border);
      }
      /* Nothing after the last: no line under it. With no charts, the columns
         are last, and both end the page side by side. */
      .node-page > .node-section:last-child,
      .node-page > .node-sections:last-child > .node-column > .node-section:last-child {
        margin-bottom: 0;
        border-bottom: 0;
      }
      .node-section > header,
      .part > header {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 34px;
        margin-bottom: 8px;
      }
      .node-section h2 { margin: 0; font-size: 16px; }
      .part { padding-top: 10px; border-top: 1px solid var(--mc-border); }
      .part + .part { margin-top: 12px; }
      .part > header { min-height: 32px; margin-bottom: 6px; }
      .part h3 { flex: none; margin: 0; font-size: 14px; }
      .part .nothing { margin: 0; }
      .node-section h2 { flex: none; }
      .node-section .when {
        display: flex;
        gap: 6px;
        min-width: 0;
        overflow: hidden;
        white-space: nowrap;
        font-size: 12px;
        color: var(--mc-muted);
      }
      .node-section .when .quiet { overflow: hidden; text-overflow: ellipsis; color: var(--mc-warn); }
      .node-section .when span + .quiet::before { content: "· "; color: var(--mc-muted); }
      /* A request's button: on the primary channel, with a menu for another
         beside it when the channel matters; filling up while the radio keeps
         from sending the like. */
      /* One edge around both halves, lit whole on hovering either; a faint
         line between them always, never lit. */
      .ask-split {
        position: relative;
        display: inline-flex;
        margin-left: auto;
        border: 1px solid var(--mc-border);
        border-radius: 8px;
        background: var(--mc-raised);
      }
      .ask-split:has(.ask:not(:disabled):hover),
      .ask-split.open { border-color: var(--mc-primary); }
      .ask-split:has(.ask:disabled) { opacity: 0.6; }
      .ask-split .ask {
        position: relative;
        overflow: hidden;
        min-height: 30px;
        padding: 0 14px;
        border: 0;
        border-radius: 7px;
        background: transparent;
      }
      .ask-split .ask:disabled { opacity: 1; }
      .ask-split .ask.split { border-top-right-radius: 0; border-bottom-right-radius: 0; }
      .ask-split .caret {
        display: flex;
        align-items: center;
        padding: 0 6px;
        border-left: 1px solid var(--mc-border);
        border-top-left-radius: 0;
        border-bottom-left-radius: 0;
      }
      .ask-split .caret svg { width: 16px; height: 16px; transition: transform 0.15s; }
      .ask-split.open .caret svg { transform: rotate(180deg); }
      .ask-split .fill {
        position: absolute;
        left: 0;
        bottom: 0;
        height: 3px;
        background: var(--mc-primary);
        transition: width 1s linear;
      }
      .ask-menu {
        position: absolute;
        top: calc(100% + 4px);
        right: 0;
        z-index: 30;
        display: flex;
        flex-direction: column;
        min-width: 240px;
        padding: 6px;
        border: 1px solid var(--mc-border);
        border-radius: 10px;
        background: var(--mc-surface);
        box-shadow: 0 8px 24px rgb(0 0 0 / 20%);
      }
      .ask-menu p { margin: 4px 8px 6px; font-size: 12px; color: var(--mc-muted); }
      .ask-menu button {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px;
        border: 0;
        border-radius: 6px;
        background: none;
        text-align: left;
      }
      .ask-menu button:hover { background: var(--mc-raised); }
      .ask-menu .slot { min-width: 16px; color: var(--mc-muted); font-variant-numeric: tabular-nums; }
      /*
       * A newer meshctl than this page runs: over everything, at the foot,
       * until the page is reloaded; on a phone, over its tabs.
       */
      .newer {
        position: fixed;
        left: 50%;
        bottom: 20px;
        z-index: 2000;
        display: flex;
        align-items: center;
        gap: 14px;
        width: max-content;
        max-width: calc(100vw - 24px);
        padding: 12px 14px 12px 16px;
        border: 1px solid var(--mc-border);
        border-left: 3px solid var(--mc-primary);
        border-radius: 12px;
        background: var(--mc-surface);
        box-shadow: var(--mc-shadow);
        transform: translateX(-50%);
      }
      .newer-words { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
      .newer-words span { color: var(--mc-muted); font-size: 13px; }
      .newer button { flex: none; }
      @media (max-width: 835px) {
        .newer { bottom: calc(76px + env(safe-area-inset-bottom)); }
      }
      /* Why a request was not sent, over the page for a while. */
      .toast {
        position: fixed;
        right: 20px;
        bottom: 20px;
        z-index: 50;
        max-width: 420px;
        padding: 10px 14px;
        border-left: 3px solid var(--mc-warn);
        border-radius: 8px;
        background: var(--mc-surface);
        box-shadow: 0 8px 24px rgb(0 0 0 / 25%);
        font-size: 13px;
      }
      .node-section .hint,
      .node-section .nothing { margin: 0 0 8px; font-size: 13px; color: var(--mc-muted); }
      .node-section .hint:empty { display: none; }
      .facts {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
        gap: 12px 24px;
        margin: 0;
      }
      /* Short values, figures: narrower columns, two even on a phone. */
      .facts.compact { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
      /* Three short figures, as a ping's: in one row, even on a phone. */
      .facts.three { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px 16px; }
      .facts .wide { grid-column: 1 / -1; }
      .facts dt { font-size: 12px; color: var(--mc-muted); }
      .facts dd { margin: 2px 0 0; font-weight: 600; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
      .facts .copyable { display: flex; align-items: center; gap: 4px; }
      .facts .copyable .icon-button { width: 28px; height: 28px; }
      /* A node's key in one line, cut short where it must (its button copies
         it whole, and it shows whole on hovering it), its button beside it:
         not a channel's key, as the classes are the same. */
      .facts .copyable .public-key { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .facts .copyable .icon-button { flex: none; }
      .facts .copyable .icon-button svg { width: 16px; height: 16px; }
      .facts .public-key { font-size: 12px; font-weight: 400; }
      .node-page button.link,
      .packet-neighbours button.link {
        padding: 0;
        border: 0;
        background: none;
        color: var(--mc-primary);
        font: inherit;
        cursor: pointer;
      }
      .node-page button.link:hover,
      .packet-neighbours button.link:hover { text-decoration: underline; }
      .neighbours { list-style: none; margin: 0; padding: 0; columns: 2 220px; column-gap: 24px; }
      .neighbours li { display: flex; gap: 8px; padding: 4px 0; break-inside: avoid; }
      .neighbours .snr { margin-left: auto; color: var(--mc-muted); font-variant-numeric: tabular-nums; }
      .neighbours:not(.all) .extra { display: none; }
      .node-page button.neighbours-more,
      .packet-neighbours button.neighbours-more { margin-top: 6px; font-size: 13px; }
      /* What a MeshCore node said, asked of it: its readings, one a line; a
         password to log in to it with; what went wrong. */
      .readings { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
      /* What a sensor kept over a time: the period picked and asked for over
         it, then each reading by its name, its lowest, mean and highest. */
      .series-ask { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: 10px; }
      .series-ask .segmented { flex: 1 1 200px; max-width: 300px; }
      .series-ask .ask { margin-left: auto; }
      .series { width: 100%; border-collapse: collapse; font-size: 13px; }
      .series caption { margin-bottom: 6px; color: var(--mc-muted); font-size: 12px; text-align: left; }
      .series th, .series td { padding: 4px 6px; text-align: right; font-variant-numeric: tabular-nums; }
      .series thead th { color: var(--mc-muted); font-weight: 600; font-size: 12px; }
      .series tbody th { text-align: left; font-weight: 500; }
      .series tbody tr + tr { border-top: 1px solid var(--mc-border); }
      .access-form { display: flex; gap: 8px; margin: 10px 0 6px; }
      .access-form input { flex: 1; min-width: 0; }
      /* A node's console: what was sent and answered, the latest last, in
         a box of its own that scrolls. */
      .console { list-style: none; margin: 0 0 8px; padding: 8px 10px; max-height: 240px; overflow-y: auto; border: 1px solid var(--mc-border); border-radius: 8px; background: var(--mc-page); font-size: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
      .console li { padding: 1px 0; }
      .console li.mine { color: var(--mc-primary); }
      .node-section .problem { margin: 4px 0; color: var(--mc-danger); font-size: 13px; }
      .node-page button.link:disabled { color: inherit; cursor: default; text-decoration: none; }
      .node-traces .trace { padding: 4px 0 10px; border-bottom: 0; }
      .node-traces .all { font-size: 13px; }
      /* A drawer over the page's side, for a list too long for the page. */
      .drawer-shade { position: fixed; inset: 0; z-index: 40; background: rgb(0 0 0 / 35%); }
      .drawer {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        z-index: 41;
        display: flex;
        flex-direction: column;
        width: min(560px, 100vw);
        background: var(--mc-surface);
        border-left: 1px solid var(--mc-border);
        box-shadow: -12px 0 32px rgb(0 0 0 / 25%);
      }
      .drawer > header {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 53px;
        padding: 0 12px 0 20px;
        border-bottom: 1px solid var(--mc-border);
      }
      .drawer > header h2 { margin: 0; font-size: 16px; flex: 1; min-width: 0; }
      .drawer-body { flex: 1; overflow-y: auto; padding: 4px 0; }
      .drawer-body .more { display: block; margin: 12px auto; }
      .drawer-body > .nothing { margin: 16px 20px; color: var(--mc-muted); }
      /* Its foot: what can be done with what it holds, always in sight. */
      .drawer-foot { flex: none; padding: 12px 20px; border-top: 1px solid var(--mc-border); }
      .drawer-foot:empty { display: none; }
      .drawer-body .request:last-child { border-bottom: 0; }
      /* Forgetting the history: once more said sure. */
      .drawer .forget {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 10px;
        font-size: 13px;
      }
      .drawer .forget .question { flex: 1 1 100%; color: var(--mc-muted); }
      .drawer .forget button.link { padding: 0; border: 0; background: none; color: var(--mc-danger); cursor: pointer; }
      .drawer .forget button.link:hover { text-decoration: underline; }
      .drawer .forget button.danger { border-color: var(--mc-danger); color: var(--mc-danger); }
      /* Forgetting a node, two ways, each said and then done once more sure. */
      .removal { display: flex; flex-direction: column; gap: 22px; padding: 16px 20px; }
      .removal .way h3 { margin: 0 0 6px; font-size: 15px; }
      .removal .way > p { margin: 0 0 12px; font-size: 13px; line-height: 1.5; }
      .removal .way + .way { padding-top: 22px; border-top: 1px solid var(--mc-border); }
      .removal .forget { margin: 0; padding: 0; border: 0; }
      button.danger-outline { border-color: color-mix(in srgb, var(--mc-danger) 50%, var(--mc-border)); color: var(--mc-danger); }
      button.danger-outline:hover:not(:disabled) { border-color: var(--mc-danger); }
      .removal .problem { margin: 0; color: var(--mc-danger); font-size: 13px; }
      /* A node's own list of nodes, administered over the mesh: each node a
         row that opens on what can be done with it there. */
      .remote-nodes { display: flex; flex-direction: column; gap: 12px; }
      .remote-intro { margin: 0; font-size: 13px; line-height: 1.5; }
      .remote-link { display: flex; gap: 8px; }
      .remote-link input { flex: 1; min-width: 0; }
      .remote-node-list { margin: 0; padding: 0; list-style: none; border: 1px solid var(--mc-border); border-radius: 10px; overflow: hidden; }
      .remote-node + .remote-node { border-top: 1px solid var(--mc-border); }
      .remote-node-head {
        display: flex; align-items: baseline; gap: 10px; width: 100%; padding: 10px 14px;
        border: 0; border-radius: 0; background: none; color: var(--mc-text); text-align: left;
      }
      .remote-node-head:hover, .remote-node.open .remote-node-head { background: var(--mc-raised); }
      .remote-node-head .name { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .remote-node-head .id { font-family: var(--mc-mono); font-size: 12px; color: var(--mc-muted); }
      .remote-node-head .tag { margin-left: auto; font-size: 12px; color: var(--mc-primary); }
      .remote-node-head .tag + .tag { margin-left: 0; }
      .remote-node-actions { display: flex; flex-wrap: wrap; gap: 8px; padding: 4px 14px 12px; }
      .remote-no-key { margin: 0; padding: 0 14px 12px; font-size: 12px; }
      .remote-outcome { margin: 0; padding: 0 14px 10px; font-size: 13px; }
      .remote-nodes > .remote-outcome { padding: 0; }
      .remote-outcome.good { color: var(--mc-ok); }
      .remote-outcome.warn { color: var(--mc-warn); }
      .remote-outcome.bad { color: var(--mc-danger); }
      /* Many nodes at once: which, then each way, and how far it got. */
      .sweep-pick h3 { margin: 0 0 10px; font-size: 15px; }
      .sweep-pick p { margin: 10px 0 0; font-size: 13px; }
      .sweep-pick .off { pointer-events: none; opacity: 0.5; }
      .sweep-going { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; font-size: 13px; }
      .sweep-going progress { flex: 1 1 100%; height: 8px; accent-color: var(--mc-primary); }
      .sweep-going span { flex: 1; }
      .sweep-result { margin: 0; font-size: 13px; }
      .sweep-result.problem { color: var(--mc-danger); }
      /* Another node's settings, as its admin: where they come from, and
         why not, if they could not be read. */
      .admin-bar {
        display: flex;
        align-items: center;
        gap: 12px;
        max-width: 640px;
        margin: 0 auto 16px;
        padding: 10px 14px;
        border: 1px solid var(--mc-border);
        border-radius: 10px;
        background: var(--mc-surface);
      }
      .admin-bar .dim { flex: 1; font-size: 13px; line-height: 1.5; }
      .admin-bar button { flex: none; }
      .settings > .admin-waiting, .section-panel > .admin-waiting { max-width: 640px; margin: 16px auto; font-size: 14px; }
      /* As wide as the tabs: centred, which would shrink it to its text. */
      .settings > .node-admin { width: 100%; max-width: 640px; margin: 0 auto; padding: 0; }
      .settings > .admin-waiting { width: 100%; justify-content: center; }
      /* Why not, and trying again, in one box as wide as the tabs. */
      .admin-failed { display: flex; align-items: center; gap: 12px; }
      .admin-failed .what { flex: 1; min-width: 0; }
      .admin-failed .retry, .admin-bar .retry { display: inline-flex; flex: none; align-items: center; gap: 6px; }
      .admin-failed .retry .icon, .admin-bar .retry .icon { display: flex; }
      .admin-failed .retry svg, .admin-bar .retry svg { width: 16px; height: 16px; }
      /* On its way: said, and what it is sent from held still. */
      .channel-list > .admin-waiting { margin: 4px 0; font-size: 13px; }
      .channel-editor .admin-waiting { margin: 0 20px; font-size: 13px; }
      fieldset.busy-lock { margin: 0; padding: 0; border: 0; min-width: 0; }
      /* All as wide, the widest's words in them. */
      .node-actions .pref-row button { justify-self: end; width: 13.5em; }
      fieldset.busy-lock:disabled { opacity: 0.6; }
      .section-panel > .node-admin { padding: 0; }
      .node-admin { display: flex; flex-direction: column; gap: 12px; padding: 16px 20px; }
      .node-admin > p { margin: 0; font-size: 13px; line-height: 1.5; }
      /* Its notes, as boxes: a tint of their colour behind them. */
      .node-admin .note,
      .admin-keys .note {
        padding: 8px 12px;
        border-radius: 0 6px 6px 0;
        background: color-mix(in srgb, var(--mc-warn) 10%, transparent);
        color: var(--mc-text);
      }
      .node-admin .note.bad,
      .admin-keys .note.bad { background: color-mix(in srgb, var(--mc-danger) 10%, transparent); }
      .node-admin > button { align-self: flex-start; }
      .admin-waiting { display: flex; align-items: center; gap: 10px; }
      .spinner {
        flex: none;
        width: 16px;
        height: 16px;
        border: 2px solid var(--mc-border);
        border-top-color: var(--mc-primary);
        border-radius: 50%;
        animation: welcome-spin 0.9s linear infinite;
      }
      @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } }
      .admin-key { display: flex; align-items: center; gap: 6px; min-width: 0; }
      .admin-key .public-key { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
      .admin-key .icon-button { flex: none; }
      .admin-key .icon-button svg { width: 16px; height: 16px; }
      fieldset.read-only { margin: 0; padding: 0; border: 0; min-width: 0; }
      /* The radio's admin keys: each a row, whose and which, and its way
         out. */
      .admin-keys { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
      .admin-keys h3 { margin: 0; font-size: 15px; }
      .admin-keys p { margin: 0; font-size: 13px; line-height: 1.5; }
      .admin-keys .note { align-self: stretch; }
      .admin-key-list { list-style: none; margin: 0; padding: 0; width: 100%; }
      .admin-key-list:empty { display: none; }
      .admin-key-list li { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--mc-border); }
      .admin-key-list li:first-child { border-top: 1px solid var(--mc-border); }
      .admin-key-who { flex: 1; min-width: 0; display: flex; flex-direction: column; }
      .admin-key-who .public-key { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; color: var(--mc-muted); }
      .admin-key-list .icon-button svg { width: 18px; height: 18px; }
      .admin-keys .with-icon { display: inline-flex; align-items: center; gap: 6px; }
      .admin-keys .with-icon .icon { display: flex; color: var(--mc-muted); }
      .admin-keys .with-icon svg { width: 16px; height: 16px; }
      .key-written { display: flex; gap: 8px; margin-bottom: 12px; }
      .key-written input { flex: 1; min-width: 0; font-size: 13px; }
      /* What a node was asked for: each request a row, its answer whole on
         opening it. */
      .requests { list-style: none; margin: 0; padding: 0; }
      .request { border-bottom: 1px solid var(--mc-border); }
      .request-line {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 4px;
        width: 100%;
        padding: 10px 20px;
        border: 0;
        border-radius: 0;
        background: transparent;
        text-align: left;
      }
      .request-line:disabled { opacity: 1; cursor: default; }
      .request-line:not(:disabled):hover,
      .request.open .request-line { background: var(--mc-raised); }
      .request-line .head { display: flex; align-items: baseline; gap: 10px; width: 100%; }
      .request-line .when { margin-left: auto; font-size: 12px; color: var(--mc-muted); white-space: nowrap; }
      .request-line .summary {
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 13px;
        color: var(--mc-muted);
      }
      .request-line .summary:empty { display: none; }
      .request .payload {
        margin: 0;
        padding: 8px 20px 14px;
        background: var(--mc-raised);
        font-size: 12px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      /*
       * A node's telemetry: one chart for each measure, side by side as the
       * page's width takes them, under the choice of while. Thin lines on a
       * faint grid; what a point says, on hovering it.
       */
      .telemetry > header { flex-wrap: wrap; }
      /* The whiles, under a pill that slides to the one chosen: small. */
      .telemetry .segmented.windows { margin-left: auto; padding: 2px; border-radius: 8px; }
      .telemetry .segmented.windows::before {
        top: 2px;
        bottom: 2px;
        width: var(--w, calc((100% - 4px) / var(--n, 3)));
        transform: translateX(var(--x, calc(2px + var(--at, 0) * 100%)));
        border-radius: 6px;
      }
      .telemetry .segmented.windows button {
        min-height: 26px;
        padding: 0 10px;
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .chart-group + .chart-group { margin-top: 22px; }
      /* Its title folds it away, and back. */
      .chart-group h3 { margin: 0 0 10px; }
      .chart-group h3 button {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 0;
        border: 0;
        background: none;
        color: var(--mc-muted);
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      .chart-group h3 button:hover { color: var(--mc-text); }
      .chart-group h3 svg {
        width: 14px;
        height: 14px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        transition: transform 0.15s;
      }
      .chart-group.folded h3 svg { transform: rotate(-90deg); }
      .chart-group .hidden { display: none !important; }
      .chart-group .more { margin-top: 12px; font-size: 13px; }
      /* A group's charts fill their rows: two share one, one takes it all,
         the last row's share what the others leave. */
      .charts { display: flex; flex-wrap: wrap; gap: 20px 32px; }
      .charts .chart { flex: 1 1 340px; }
      .charts > .rest { display: contents; }
      .chart { margin: 0; min-width: 0; }
      .chart figcaption {
        display: flex;
        align-items: baseline;
        gap: 8px;
        margin-bottom: 6px;
      }
      .chart .title { font-size: 13px; font-weight: 600; }
      .chart .latest {
        margin-left: auto;
        font-size: 13px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }
      .chart .frame {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        grid-template-rows: 110px auto;
        column-gap: 8px;
      }
      .chart .scale {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        align-items: flex-end;
        font-size: 11px;
        line-height: 1;
        color: var(--mc-muted);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .chart .plot { position: relative; min-width: 0; cursor: crosshair; touch-action: pan-y; }
      .chart svg { display: block; width: 100%; height: 100%; overflow: visible; }
      .chart .grid { stroke: var(--mc-border); stroke-width: 1; vector-effect: non-scaling-stroke; }
      .chart .line {
        fill: none;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
        vector-effect: non-scaling-stroke;
      }
      .chart .line-0 { stroke: var(--mc-chart-1); }
      .chart .line-1 { stroke: var(--mc-chart-2); }
      .chart .swatch {
        display: inline-block;
        width: 10px;
        height: 3px;
        border-radius: 2px;
        vertical-align: middle;
      }
      .chart .swatch.line-0 { background: var(--mc-chart-1); }
      .chart .swatch.line-1 { background: var(--mc-chart-2); }
      .chart .times {
        grid-column: 2;
        display: flex;
        justify-content: space-between;
        margin-top: 4px;
        font-size: 11px;
        color: var(--mc-muted);
        font-variant-numeric: tabular-nums;
      }
      .chart .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 6px; font-size: 12px; color: var(--mc-muted); }
      .chart .legend-key { display: inline-flex; align-items: center; gap: 6px; }
      .chart .cursor {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 1px;
        background: var(--mc-muted);
        pointer-events: none;
      }
      .chart .tip {
        position: absolute;
        top: 4px;
        z-index: 5;
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding: 6px 9px;
        border: 1px solid var(--mc-border);
        border-radius: 8px;
        background: var(--mc-surface);
        box-shadow: 0 6px 18px rgb(0 0 0 / 18%);
        font-size: 12px;
        white-space: nowrap;
        pointer-events: none;
      }
      .chart .tip.right { transform: translateX(10px); }
      .chart .tip.left { transform: translateX(calc(-100% - 10px)); }
      .chart .tip .when { color: var(--mc-muted); }
      .chart .tip .row { display: flex; align-items: center; gap: 6px; }
      .chart .tip strong { font-variant-numeric: tabular-nums; }
      .trace { padding: 12px 16px; border-bottom: 1px solid var(--mc-border); }
      .trace:last-child { border-bottom: 0; }
      /* One line always: whom to, how it went, when, and its copy button,
         which never go under. Whom to, its name and id in a box a line tall:
         where both do not fit, the id goes under, out of sight, whole; where
         the name alone does not, it is cut short. */
      .trace header { display: flex; gap: 12px; align-items: center; flex-wrap: nowrap; min-width: 0; }
      .trace header > :not(.target) { flex: none; }
      .trace .target {
        display: flex;
        flex-wrap: wrap;
        column-gap: 0.35em;
        flex: 0 1 auto;
        min-width: 0;
        height: 1lh;
        overflow: hidden;
      }
      .trace .target .name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .trace .target .id { font-weight: 400; white-space: nowrap; }
      .trace .when { margin-left: auto; font-size: 12px; }
      .trace header .copy { width: 28px; height: 28px; margin: -4px -6px -4px 0; }
      .trace header .copy svg { width: 16px; height: 16px; }
      .route { display: flex; gap: 10px; align-items: baseline; margin-top: 8px; }
      .route .label { font-size: 12px; min-width: 70px; }
      .path { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; }
      /* A MeshCore relay guessed, as its title says. */
      .path .short.guess { text-decoration: underline dashed; text-underline-offset: 3px; }
      .hop { font-size: 12px; font-variant-numeric: tabular-nums; }
      .hop.good { color: var(--mc-ok); }
      .hop.fair { color: var(--mc-warn); }
      .hop.poor { color: var(--mc-danger); }
      /* An SNR alone, coloured as a hop is: a ping's, a trace's. */
      .snr.good { color: var(--mc-ok); }
      .snr.fair { color: var(--mc-warn); }
      .snr.poor { color: var(--mc-danger); }
      .hop.unknown { color: var(--mc-muted); }

      main:has(> .map-page) { display: flex; padding: 0; overflow: hidden; }
      /* Leaflet's panes and controls go up to z-index 1000: kept to the map,
         so that they never come over the rest of the page. */
      .map-page { position: relative; flex: 1; min-width: 0; min-height: 0; isolation: isolate; container: map / inline-size; }
      .menu-backdrop { display: none; }
      .map { position: absolute; inset: 0; background: var(--mc-map); }
      .map-legend {
        position: absolute;
        left: 12px;
        bottom: 24px;
        z-index: 500;
        display: flex;
        max-width: calc(100% - 24px);
        background: color-mix(in srgb, var(--mc-surface) 92%, transparent);
        border: 1px solid var(--mc-border);
        border-radius: 10px;
        box-shadow: var(--mc-shadow);
        font-size: 12px;
        color: var(--mc-muted);
        overflow: hidden;
      }
      .map-legend-items { display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 8px 12px 8px 6px; }
      /* The legend folds away into the button before it, as in meshview. */
      .map-legend-toggle {
        display: flex;
        align-items: center;
        justify-content: center;
        flex: none;
        width: 22px;
        padding: 0;
        border: 0;
        border-radius: 0;
        background: transparent;
        color: var(--mc-muted);
      }
      .map-legend-toggle:hover { background: var(--mc-raised); color: var(--mc-text); }
      .map-legend-toggle svg { width: 16px; height: 16px; transition: transform 0.2s ease; }
      .map-legend.folded .map-legend-items { display: none; }
      .map-legend.folded .map-legend-toggle { width: 34px; height: 34px; }
      .map-legend.folded .map-legend-toggle svg { transform: rotate(180deg); }
      .map-legend span { display: flex; align-items: center; gap: 6px; }
      .map-legend i { width: 10px; height: 10px; border-radius: 50%; background: var(--mc-pin-far); }
      .map-legend i.local { background: var(--mc-pin-local); }
      .map-legend i.direct { background: var(--mc-pin-direct); }
      .map-legend i.near { background: var(--mc-pin-near); }
      .map-legend i.mid { background: var(--mc-pin-mid); }
      /*
       * Over the map, clear of its zoom buttons on the left: centred while
       * there is room, and on a narrow map out to its right edge, with no
       * room wasted there.
       */
      /* Only to keep clicks within it from closing it. */
      .map-menu { display: contents; }
      /* The map's own settings: three dots under the zoom's buttons, raised
         as they are, letting down the clock and the waypoints' button. */
      .map-menu-toggle {
        position: absolute;
        top: 138px;
        left: 10px;
        z-index: 500;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 36px;
        height: 36px;
        padding: 0;
        border: 1px solid var(--mc-border);
        border-radius: 10px;
        background: var(--mc-surface);
        color: var(--mc-text);
        box-shadow: var(--mc-shadow);
      }
      .map-menu-toggle svg { width: 18px; height: 18px; }
      /* Something left out, nodes heard long ago or the waypoints: said by
         the dots' colour, as the clock and the waypoints' button say it. */
      .map-menu-toggle.marked { color: var(--mc-primary); }
      /* How long ago nodes heard are on the map: a clock under the three
         dots, opening to the right. */
      .map-age {
        position: absolute;
        top: 182px;
        left: 10px;
        z-index: 500;
        display: flex;
        border: 1px solid var(--mc-border);
        border-radius: 10px;
        background: var(--mc-surface);
        box-shadow: var(--mc-shadow);
        overflow: hidden;
      }
      .map-age button {
        min-height: 34px;
        border: 0;
        border-radius: 0;
        background: none;
        color: var(--mc-text);
      }
      .map-age button:hover { background: var(--mc-raised); }
      .map-age-toggle { display: flex; align-items: center; justify-content: center; width: 34px; padding: 0; }
      .map-age-toggle svg { width: 18px; height: 18px; }
      /* Some left out: said by the clock's colour. */
      .map-age-toggle.on { color: var(--mc-primary); }
      .map-age-options { display: flex; border-left: 1px solid var(--mc-border); }
      .map-age-options button { padding: 0 10px; font-size: 12px; white-space: nowrap; }
      .map-age-options button.on { color: var(--mc-primary); font-weight: 700; }
      /* Shows or hides the waypoints: under the clock, as alike. */
      .map-waypoints-toggle {
        position: absolute;
        top: 226px;
        left: 10px;
        z-index: 500;
        display: flex;

      .map-route-notice button:hover,
      .notice .close:hover { background: var(--mc-raised); color: var(--mc-text); }
      .map-route-notice button svg,
      .notice .close svg { width: 16px; height: 16px; }
      .mc-picker-popup .leaflet-popup-content { margin: 6px; width: 260px !important; max-width: calc(100vw - 64px); }
      .mc-picker-head { display: flex; align-items: center; gap: 8px; padding: 2px 2px 4px 8px; }
      .mc-picker-head p { flex: 1; margin: 0; font-size: 12px; color: var(--mc-muted); }
      .mc-picker-zoom {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 30px;
        height: 30px;
        padding: 0;
        border: 0;
        background: transparent;
        color: var(--mc-muted);
      }
      /* A magnifier: zooming in on the group, which parts its dots. */
      .mc-picker-zoom i {
        width: 18px;
        height: 18px;
        background: currentColor;
        -webkit-mask: url(/tabler-icons-3.51.0/icons/outline/zoom-in.svg) center / contain no-repeat;
        mask: url(/tabler-icons-3.51.0/icons/outline/zoom-in.svg) center / contain no-repeat;
      }
      .mc-picker-zoom:hover { background: var(--mc-raised); color: var(--mc-text); }
      .mc-picker-list { list-style: none; margin: 0; padding: 0; max-height: 260px; overflow-y: auto; }
      .mc-picker-item {
        display: grid;
        grid-template-columns: 16px minmax(0, 1fr) auto;
        align-items: center;
        gap: 9px;
        width: 100%;
        min-height: 40px;
        padding: 6px 8px;
        border: 0;
        border-radius: 6px;
        background: transparent;
        text-align: left;
      }
      .mc-picker-item:hover, .mc-picker-item:focus-visible { background: var(--mc-raised); }
      .mc-picker-item .mc-dot { justify-self: center; }
      .mc-picker-emoji { justify-self: center; font-size: 14px; line-height: 1; }
      .mc-picker-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .mc-picker-name strong { margin-right: 6px; }
      .mc-picker-name span, .mc-picker-seen { font-size: 12px; color: var(--mc-muted); white-space: nowrap; }
      .leaflet-control-attribution {
        background: color-mix(in srgb, var(--mc-surface) 85%, transparent) !important;
        color: var(--mc-muted);
      }

      /*
       * The live view, as wide as the nodes list and laid out by its own
       * width: its filters over it in a grid the whole width, in one row,
       * two or three as there is room; what comes while it holds still
       * waiting in a pill on top; each packet new glowing once.
       */
      .live {
        container: live / inline-size;
        display: flex;
        flex-direction: column;
        gap: 12px;
        width: 100%;
        max-width: 1200px;
        min-width: 0;
        margin: 0 auto;
      }
      .packet-tools {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 2fr);
        grid-template-areas:
          "kind channel reach"
          "search search search";
        gap: 8px;
        align-items: center;
      }
      .packet-tools .kind { grid-area: kind; }
      .packet-tools .channel { grid-area: channel; }
      .packet-tools .segmented { grid-area: reach; width: auto; }
      .packet-tools .search { grid-area: search; display: flex; align-items: center; gap: 12px; min-width: 0; }
      .packet-tools select,
      .packet-tools .node-filter { width: 100%; min-width: 0; min-height: 36px; }
      /* The node as wide as the switch leaves; the switch as wide as it is,
         a hair in from the edge, as the reach's round corner above is. */
      .packet-tools .node-filter { flex: 1; }
      .packet-tools .own { flex: none; display: flex; align-items: center; gap: 10px; min-height: 36px; margin-right: 3px; }
      .packet-tools .own .label { white-space: nowrap; cursor: pointer; }
      @container live (min-width: 1150px) {
        .packet-tools {
          grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(max-content, 1.6fr) minmax(0, 2fr);
          grid-template-areas: "kind channel reach search";
        }
      }
      @container live (max-width: 700px) {
        .packet-tools {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          grid-template-areas:
            "kind channel"
            "reach reach"
            "search search";
        }
      }
      /* The pause, in the heading: marked while paused. */
      .topbar .actions .pause.on { border-color: var(--mc-primary); background: var(--mc-soft); }
      /* Rows, as the nodes' are, not a card. */
      .packets > p { margin: 0; padding: 14px 4px; }
      .packets .end { font-size: 13px; text-align: center; }
      .new-packets {
        position: sticky;
        top: 8px;
        z-index: 2;
        display: flex;
        align-items: center;
        gap: 6px;
        width: max-content;
        min-height: 32px;
        margin: 0 auto -32px;
        padding: 0 14px;
        border: 0;
        border-radius: 999px;
        background: var(--mc-primary);
        color: var(--mc-on-primary);
        font-weight: 600;
        box-shadow: 0 4px 14px rgb(0 0 0 / 25%);
      }
      .new-packets .icon { display: flex; }
      .new-packets svg { width: 16px; height: 16px; }
      .packet.arrived { animation: arrived 1s ease-in-out 1; }
      @keyframes arrived {
        45% { background: color-mix(in srgb, var(--mc-primary) 30%, var(--mc-surface)); }
        75% { background: color-mix(in srgb, var(--mc-primary) 14%, var(--mc-surface)); }
      }
      @media (prefers-reduced-motion: reduce) {
        .packet.arrived { animation: arrived-still 1s step-end 1; }
        @keyframes arrived-still { 0% { background: var(--mc-soft); } }
      }
      /*
       * A packet a line: when, its kind in its colour, how it came, from and
       * to, what it says, its hops and by whom last, and how strong it was
       * heard. The columns are the list's, as wide as what they hold in any
       * row, the route first and what it says after.
       */
      .packet-list {
        display: grid;
        grid-template-columns: auto auto auto minmax(8rem, max-content) minmax(8rem, 1fr) auto auto;
        column-gap: 14px;
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .packet { display: grid; grid-template-columns: subgrid; grid-column: 1 / -1; border-bottom: 1px solid var(--mc-border); }
      .packet:last-child { border-bottom: 0; }
      .packet-line {
        display: grid;
        grid-template-columns: subgrid;
        grid-column: 1 / -1;
        align-items: baseline;
        width: 100%;
        padding: 10px 8px;
        border: 0;
        border-radius: 0;
        background: transparent;
        text-align: left;
      }
      .packet-line:hover { background: var(--mc-raised); }
      .packet-line > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .packet .hops { font-size: 12px; text-align: right; }
      .packet .signal { font-size: 11px; text-align: right; }
      /* A kind, by its colour: its name in it, never the colour alone, at
         5.8:1 or better against its tint in either theme. */
      .kind-tag {
        display: inline-block;
        padding: 1px 7px;
        border: 1px solid transparent;
        border-radius: 6px;
        background: color-mix(in srgb, var(--kind) 20%, transparent);
        color: color-mix(in srgb, var(--kind) 40%, var(--mc-text));
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.04em;
        white-space: nowrap;
      }
      .kind-tag.text { --kind: #4a96ea; }
      .kind-tag.position { --kind: #2fb380; }
      .kind-tag.node-info { --kind: #9775fa; }
      .kind-tag.routing { --kind: #8a94a0; }
      .kind-tag.telemetry { --kind: #22b8cf; }
      .kind-tag.traceroute { --kind: #f06595; }
      .kind-tag.neighbors { --kind: #ff922b; }
      .kind-tag.encrypted { --kind: #8a94a0; background: none; border-style: dashed; border-color: var(--mc-border); }
      .kind-tag.other { --kind: #adb5bd; background: none; border-color: var(--mc-border); }
      /* How it came: sent by the radio itself in the accent, heard plainly. */
      .source {
        display: inline-block;
        padding: 1px 6px;
        border: 1px solid var(--mc-border);
        border-radius: 6px;
        color: var(--mc-muted);
        font-size: 10.5px;
        font-weight: 600;
        letter-spacing: 0.03em;
        white-space: nowrap;
      }
      .source.tx { border-color: color-mix(in srgb, var(--mc-primary) 55%, transparent); color: var(--mc-primary); }
      .source.mqtt { border-style: dashed; }
      /*
       * Short of room for a line each, two: when, its kind, how it came, from
       * and to, and how strong; what it says, and its hops. Still the list's
       * columns, so that every row lines up.
       */
      @container live (max-width: 960px) {
        .packet-list { grid-template-columns: auto auto auto minmax(0, 1fr) auto; }
        .packet-line { row-gap: 4px; }
        .packet .time { grid-column: 1; grid-row: 1; }
        .packet .kind { grid-column: 2; grid-row: 1; }
        .packet .source-cell { grid-column: 3; grid-row: 1; }
        .packet .route { grid-column: 4; grid-row: 1; }
        .packet .signal { grid-column: 5; grid-row: 1; }
        .packet .summary { grid-column: 1 / 5; grid-row: 2; }
        .packet .hops { grid-column: 5; grid-row: 2; }
      }
      /*
       * Shorter still, three, each row its own: when, its kind, how it came,
       * and how strong; from and to, and its hops; what it says.
       */
      @container live (max-width: 640px) {
        .packet-list { display: block; }
        .packet { display: block; }
        .packet-line {
          grid-template-columns: auto auto auto minmax(0, 1fr) auto auto;
          grid-template-areas:
            "time kind source . signal signal"
            "route route route route route hops"
            "summary summary summary summary summary summary";
          gap: 4px 8px;
        }
        /* Its marks a little tighter, for the signal to fit beside them. */
        .packet .kind-tag, .packet .source { padding: 1px 5px; letter-spacing: 0.02em; }
        .packet .time { grid-area: time; }
        .packet .kind { grid-area: kind; }
        .packet .source-cell { grid-area: source; }
        .packet .hops { grid-area: hops; }
        .packet .route { grid-area: route; }
        .packet .signal { grid-area: signal; }
        .packet .summary { grid-area: summary; }
      }
      /*
       * Where a row has no room for it beside the longest kind's name, the
       * RSSI of none, so that every row says the same: the SNR alone. Measured
       * with a neighbour info, the longest name, beside the longest signal.
       */
      @container live (max-width: 387px) {
        .packet .rssi { display: none; }
      }
      /* From and to, each cut short as it must, so that neither goes whole. */
      .packet .route { display: flex; gap: 0.4em; }
      .packet .route > .from,
      .packet .route > .to { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
      .packet .route > .arrow { flex: none; }
      /* A last hop guessed, told apart, its title saying so. */
      .packet .hops .guess { text-decoration: underline dashed; text-underline-offset: 3px; }
      /* A packet whole, in its drawer: what is known of it, and its text. */
      .packet-facts {
        display: grid;
        grid-template-columns: max-content minmax(0, 1fr);
        gap: 8px 16px;
        margin: 0;
        padding: 14px 20px;
        font-size: 13px;
      }
      .packet-facts .fact { display: contents; }
      .packet-facts dt { color: var(--mc-muted); }
      .packet-facts dd { margin: 0; overflow-wrap: anywhere; }
      .packet-facts .mark-item + .mark-item::before { content: " · "; color: var(--mc-muted); }
      .packet-facts button.link { padding: 0; border: 0; background: none; color: var(--mc-primary); font: inherit; cursor: pointer; }
      .packet-facts button.link:hover { text-decoration: underline; }
      .packet-text {
        margin: 0 20px 16px;
        padding: 12px 14px;
        border-radius: 8px;
        background: var(--mc-surface-2);
        font-size: 12px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      /* Where a position or a waypoint says, as wide as the rest of it. */
      .packet-detail .place-map { margin: 0 20px 16px; }
      /* Who a node info or an advert says sent it, by its avatar. */
      .packet-who {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 0 20px 16px;
        padding: 14px 0 0;
        border-top: 1px solid var(--mc-border);
      }
      .packet-who .names { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
      .packet-who .name { font-size: 16px; font-weight: 650; overflow-wrap: anywhere; }
      .packet-who .about { font-size: 13px; overflow-wrap: anywhere; }
      /* A waypoint, by its emoji as its pin on the map. */
      .packet-waypoint .waypoint-icon { flex: none; width: 40px; font-size: 30px; line-height: 1; text-align: center; }
      .packet-waypoint .about:not(.dim) { font-size: 14px; }
      /* Whether what a routing packet answers got there, said by its icon
         too. */
      .packet-status {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 0 20px 16px;
        padding: 12px 14px;
        border-radius: 8px;
        background: var(--mc-surface-2);
        font-size: 15px;
      }
      .packet-status .icon { display: flex; flex: none; }
      .packet-status .icon svg { width: 22px; height: 22px; }
      .packet-status.ok .icon { color: var(--mc-ok); }
      .packet-status.bad .icon { color: var(--mc-danger); }
      /* A traceroute's ways, and the neighbours a node hears, as wide as
         the rest of the drawer. */
      .packet-detail .packet-trace h3 + .path { margin-bottom: 12px; }
      .packet-detail .packet-trace, .packet-detail .packet-neighbours { margin: 0 20px 16px; padding-top: 14px; }
      .packet-detail .packet-neighbours { border-top: 1px solid var(--mc-border); }
      .packet-detail .packet-neighbours h3 { margin: 0 0 8px; font-size: 14px; }
      /* A text, whole, as it was written. */
      .packet-message {
        margin: 0 20px 16px;
        padding: 12px 14px;
        border-left: 3px solid var(--mc-primary);
        border-radius: 8px;
        background: var(--mc-surface-2);
        font-size: 15px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .packet-message strong { display: block; margin-bottom: 2px; font-size: 13px; }
      /* What a telemetry packet says, as a node's figures, as many to a row
         as fit the drawer. */
      .packet-detail .packet-figures {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 16px;
        margin: 0 20px 16px;
        padding: 14px 0 16px;
        border-top: 1px solid var(--mc-border);
        border-bottom: 1px solid var(--mc-border);
      }
      .packet-figures .figure, .packet-figures .figure:first-child { min-width: 0; padding: 0; border-left: 0; }
      .packet-figures .figure .bar { width: 100%; }
      /* The ways it came, MeshCore's, as wide as the rest of the drawer. */
      .packet-detail .routes { margin: 0 20px 16px; padding-top: 14px; }
      /* A trace's hops, each with the SNR it heard it at beside it. */
      .routes.trace-hops li { flex-direction: row; align-items: center; gap: 10px; }
      /* A route found, there and back: each way a line, by its name. */
      .node-section .found-route { margin-top: 10px; border-top: 0; padding-top: 0; }
      .routes.found-route li { flex-direction: row; align-items: baseline; gap: 10px; }
      .routes.found-route li > .dim { flex: none; min-width: 4em; }

      /* The conversation in a column of its own on a wide screen, its
         background the whole width: what is said, and what is written, no
         wider than reads well. */
      .thread {
        --chat-gutter: max(20px, calc((100% - 920px) / 2));
        display: flex;
        flex-direction: column;
        flex: 1;
        min-width: 0;
        min-height: 0;
      }
      .thread .empty { margin: auto; }
      .thread { position: relative; }
      /* Where the day changes: a faint line, the day in the middle. */
      .day-line { display: flex; align-items: center; gap: 12px; margin: 6px 0; color: var(--mc-muted); font-size: 12px; }
      .day-line::before, .day-line::after { content: ""; flex: 1; height: 1px; background: var(--mc-border); }
      /* Where what was not read starts, in the accent. */
      .unread-line { display: flex; align-items: center; gap: 12px; margin: 6px 0; color: var(--mc-primary); font-size: 12px; font-weight: 600; }
      .unread-line::before, .unread-line::after {
        content: "";
        flex: 1;
        height: 1px;
        background: color-mix(in srgb, var(--mc-primary) 50%, transparent);
      }
      /* How many were not read: beside a conversation, over the chats' tab. */
      .unread {
        flex: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 18px;
        height: 18px;
        padding: 0 5px;
        border-radius: 999px;
        background: var(--mc-primary);
        color: var(--mc-on-primary);
        font-size: 11px;
        font-weight: 700;
        line-height: 1;
      }
      .item .unread { margin-left: auto; }
      /* A conversation silenced: faint, a bell crossed always at the end,
         what it has unread before it, in grey. */
      .item.muted .label { color: var(--mc-muted); }
      .item .muted-mark { display: flex; flex: none; justify-content: center; width: 18px; margin-left: auto; color: var(--mc-muted); }
      .item .muted-mark svg { width: 14px; height: 14px; }
      .item .unread + .muted-mark { margin-left: 0; }
      .unread.quiet { background: var(--mc-border); color: var(--mc-muted); }
      .tabbar button { position: relative; }
      .tabbar .unread { position: absolute; top: 2px; left: calc(50% + 6px); }
      /* On a radio's button, at its corner; in the phone's list, at the end. */
      .rail-button .unread { position: absolute; top: -5px; right: -5px; box-shadow: 0 0 0 2px var(--mc-rail); }
      .radio-list .unread { margin-left: auto; }
      /* Away from the newest, back to it, and how many came meanwhile. */
      .to-latest {
        position: absolute;
        top: 12px;
        left: 50%;
        z-index: 10;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 14px;
        border: 1px solid var(--mc-border);
        border-radius: 999px;
        background: var(--mc-surface);
        box-shadow: var(--mc-shadow);
        font-size: 13px;
        transform: translateX(-50%);
      }
      .to-latest .icon { display: flex; }
      .to-latest svg { width: 16px; height: 16px; }
      .messages {
        flex: 1;
        overflow-y: auto;
        padding: 20px var(--chat-gutter);
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .bubble {
        max-width: min(70%, 560px);
        align-self: flex-start;
        background: var(--mc-raised);
        border-radius: 4px 14px 14px 14px;
        padding: 8px 12px;
      }
      .bubble.mine {
        align-self: flex-end;
        background: var(--mc-out);
        border-radius: 14px 4px 14px 14px;
      }
      /* A message, and with a mouse what can be done with it, on hovering:
         at its foot on the right, half over its edge. */
      .bubble-row { position: relative; display: flex; align-self: flex-start; max-width: min(70%, 560px); }
      .bubble-row.mine { align-self: flex-end; }
      .bubble-row > .bubble { position: relative; min-width: 0; max-width: none; }
      .bubble .answer {
        position: absolute;
        right: 10px;
        bottom: -15px;
        z-index: 5;
        display: none;
        gap: 2px;
        padding: 2px;
        border: 1px solid var(--mc-border);
        border-radius: 999px;
        background: var(--mc-surface);
        box-shadow: var(--mc-shadow);
      }
      .bubble .answer .icon-button { width: 28px; height: 28px; border: 0; border-radius: 50%; }
      .bubble .answer .icon-button svg { width: 16px; height: 16px; }
      .bubble .answer .icon-button.on { color: var(--mc-primary); }
      @media (hover: hover) and (pointer: fine) {
        .bubble-row:hover .answer, .bubble-row.reacting .answer { display: flex; }
      }
      /* Touched, its menu open. */
      .bubble.held { outline: 2px solid var(--mc-primary); outline-offset: 1px; }
      /* What it answers, quoted: who, and the start of it. */
      .bubble .quote, .composer .replying .quote {
        display: flex;
        flex-direction: column;
        min-width: 0;
        padding: 3px 8px;
        border-left: 3px solid var(--mc-primary);
        border-radius: 4px;
        background: color-mix(in srgb, var(--mc-text) 6%, transparent);
        font-size: 12px;
      }
      .bubble .quote { margin: 2px 0 4px; }
      .quote .who { font-weight: 600; color: var(--mc-primary); }
      /* Quoting someone else, in their colour, as their name is. */
      @supports (color: oklch(from red l c h)) {
        .quote[style*="--node-bg"] {
          --who: oklch(from var(--node-bg) clamp(var(--mc-name-l-min), l, var(--mc-name-l-max)) min(c, var(--mc-avatar-c-max)) h);
          border-left-color: var(--who);
        }
        .quote[style*="--node-bg"] .who { color: var(--who); }
      }
      .quote .what { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--mc-muted); }
      /* The reactions to it, each emoji once, and how many. */
      .bubble .reactions { display: flex; flex-wrap: wrap; gap: 4px; margin-right: auto; }
      /* Its foot: the reactions at the left, its time and how far it went at
         the right, on one line while they fit. */
      .bubble .foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 4px 12px; }
      .bubble .foot:has(.reactions) { margin-top: 4px; }
      .bubble .foot .meta { margin-left: auto; }
      .bubble .reaction {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 1px 8px;
        border: 1px solid var(--mc-border);
        border-radius: 999px;
        background: var(--mc-surface);
        font-size: 14px;
        line-height: 1.5;
      }
      .bubble .reaction.ours { border-color: var(--mc-primary); background: var(--mc-soft); }
      .bubble .reaction:disabled { opacity: 1; cursor: default; }
      .bubble .reaction .count { font-size: 12px; color: var(--mc-muted); }
      .bubble .reaction.more { color: var(--mc-muted); font-size: 12px; }
      /* The emojis to react with, over the message: the most used, then all. */
      .reaction-picker {
        position: absolute;
        /* Over the buttons at the message's foot, on its right, clear of them. */
        right: 10px;
        bottom: 22px;
        z-index: 40;
        padding: 4px;
        border: 1px solid var(--mc-border);
        border-radius: 999px;
        background: var(--mc-surface);
        box-shadow: var(--mc-shadow);
      }
      .reaction-picker .quick { display: flex; gap: 2px; }
      .reaction-picker .quick button {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 36px;
        height: 36px;
        padding: 0;
        border: 0;

      /* A mention, as MeshCore's apps write them: @[Name]. */

      /* A room the radio cannot post in, in place of the composer: why, and

      .logging-in {

      @media (prefers-reduced-motion: reduce) {

        .logging-in .ring .left { transition: none; }
      }
      .composer {

      .composer .replying { display: flex; flex-basis: 100%; align-items: center; gap: 10px; width: 100%; min-width: 0; }
      .composer .replying > .icon { display: flex; color: var(--mc-primary); }

      .composer .emoji-toggle svg { width: 22px; height: 22px; }
