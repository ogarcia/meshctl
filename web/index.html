      .composer .emoji-toggle:hover { color: var(--mc-text); }

      .composer .share-toggle svg { width: 22px; height: 22px; }

      .composer .share-toggle:disabled { opacity: 0.4; }

      /* What a MeshCore message shares, as a card: a contact or a channel. */

      .shared-said { font-size: 11px; font-style: italic; color: var(--mc-muted); }

      /* A position in a conversation: a small map, and under it whose, its

      .routes { margin-top: 14px; border-top: 1px solid var(--mc-border); padding-top: 12px; }

      /* The emojis over the bar, on the right, beside their button. */

      .emoji-popover .emoji-groups button, .reaction-picker .emoji-groups button { width: auto; }

      .composer .backdrop {

      /*

      .welcome-screen h1 { margin: 0; font-size: 24px; line-height: 1.25; }

      .welcome-go {
        display: inline-flex;

        padding: 0 22px;
        border-radius: 10px;
        font-size: 15px;
      }
      .welcome-screen span.icon { display: flex; }
      .welcome-go .icon svg { width: 18px; height: 18px; }

      /* What meshctl is. */
      .welcome-hello { display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center; }
      .welcome-logo { width: 72px; height: 72px; margin-bottom: 4px; stroke: var(--mc-primary); stroke-width: 1.6; }
      .welcome-hello h1 { font-size: 30px; }
      .welcome-lead { max-width: 440px; color: var(--mc-muted); font-size: 16px; }
      .welcome-hello .welcome-go { margin-top: 8px; }
      .welcome-small { max-width: 400px; color: var(--mc-muted); font-size: 13px; }

      /* Its access token, asked for: the field as wide as the lead, with
         the eye to show what is typed inside it, at its end. */
      .token-screen .token-field { position: relative; width: 100%; max-width: 360px; margin-top: 8px; }
      .token-screen .token-field input { width: 100%; min-height: 44px; padding-right: 48px; font-size: 16px; }
      .token-screen .token-field .icon-button { position: absolute; top: 50%; right: 4px; transform: translateY(-50%); }
      .token-screen .problem { max-width: 360px; margin: 0; color: var(--mc-danger); }

      /* The radio: what it is, how it is reached, its address, its name. */
      .welcome-radio { display: flex; flex-direction: column; gap: 20px; }
      .welcome-back {
        align-self: flex-start;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin: 0 0 -8px;
        padding: 4px 0;
        border: 0;
        background: none;
        color: var(--mc-muted);
      }
      .welcome-back:hover { color: var(--mc-text); }
      .welcome-back svg { width: 16px; height: 16px; }
      .welcome-radio fieldset { min-width: 0; margin: 0; padding: 0; border: 0; }
      .welcome-radio legend,
      .welcome-radio .field > .label,
      .welcome-radio .plugged-head > .label {
        padding: 0;
        margin-bottom: 8px;
        color: var(--mc-muted);
        font-size: 13px;
        font-weight: 600;
      }
      .welcome-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      /* Three or more: across, each its icon beside its name; one under
         another where they would not fit. */
      .welcome-cards.many { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .welcome-cards.many .welcome-card:has(> .icon) {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        align-content: start;
        column-gap: 10px;
        row-gap: 2px;
      }
      .welcome-cards.many .welcome-card > .icon { grid-row: span 2; margin: 2px 0 0; }
      fieldset:has(> .welcome-cards.many) { container-type: inline-size; }
      @container (max-width: 480px) {
        .welcome-cards.many { grid-template-columns: minmax(0, 1fr); }
      }
      .welcome-card {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 2px;
        padding: 14px 16px;
        border-radius: 12px;
        background: var(--mc-surface);
        text-align: left;
      }
      .welcome-card > .icon { margin-bottom: 6px; color: var(--mc-muted); }
      .welcome-card .icon svg { width: 22px; height: 22px; }
      .welcome-card .title { font-size: 15px; font-weight: 600; }
      .welcome-card .detail { color: var(--mc-muted); font-size: 12px; }
      .welcome-card.on {
        border-color: var(--mc-primary);
        box-shadow: inset 0 0 0 1px var(--mc-primary);
        background: color-mix(in srgb, var(--mc-primary) 8%, var(--mc-surface));
      }
      .welcome-card.on .icon { color: var(--mc-primary); }
      .welcome-radio .field { display: flex; flex-direction: column; }
      .welcome-radio .field > .label,
      .welcome-radio .plugged-head > .label { display: block; }
      .welcome-radio .optional { font-weight: 400; }
      /* 16px: a phone does not zoom in to write in it. */
      .welcome-radio input { min-height: 44px; font-size: 16px; }
      .welcome-radio .hint { margin-top: 6px; color: var(--mc-muted); font-size: 12px; }
      .welcome-radio .error { color: var(--mc-danger); }

      /* The link coming up. */
      .welcome-linking { display: flex; flex-direction: column; gap: 12px; }
      .welcome-address { color: var(--mc-muted); overflow-wrap: anywhere; }
      .welcome-steps {
        display: grid;
        gap: 2px;
        margin: 8px 0 0;
        padding: 8px;
        border: 1px solid var(--mc-border);
        border-radius: 12px;
        background: var(--mc-surface);
        list-style: none;
      }
      .welcome-steps li { display: flex; align-items: center; gap: 12px; padding: 10px 8px; color: var(--mc-muted); }
      .welcome-steps li > .icon { flex: none; width: 22px; height: 22px; align-items: center; justify-content: center; }
      .welcome-steps .icon svg { width: 22px; height: 22px; }
      .welcome-steps li.later > .icon::before {
        content: "";
        width: 14px;
        height: 14px;
        border: 2px solid var(--mc-border);
        border-radius: 50%;
      }
      .welcome-steps li.done { color: var(--mc-text); }
      .welcome-steps li.done .icon { color: var(--mc-ok); }
      .welcome-steps li.now { color: var(--mc-text); font-weight: 600; }
      .welcome-steps li.now .icon { color: var(--mc-primary); }
      .welcome-steps li.now .icon svg { animation: welcome-spin 1s linear infinite; }
      .welcome-steps li.stuck { color: var(--mc-text); font-weight: 600; }
      .welcome-steps li.stuck .icon { color: var(--mc-warn); }
      .welcome-steps .count { color: var(--mc-muted); font-weight: 400; }
      .welcome-steps .count::before { content: " · "; }
      @keyframes welcome-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        .welcome-steps li.now .icon svg { animation: none; }
      }
      .welcome-failed {
        display: grid;
        gap: 10px;
        margin-top: 4px;
        padding: 16px;
        border: 1px solid color-mix(in srgb, var(--mc-warn) 45%, var(--mc-border));
        border-radius: 12px;
        background: color-mix(in srgb, var(--mc-warn) 8%, var(--mc-surface));
      }
      .welcome-failed .what { font-weight: 600; overflow-wrap: anywhere; }
      .welcome-failed .hint { color: var(--mc-muted); font-size: 13px; }
      .welcome-failed .buttons { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
      .welcome-failed .buttons button { min-height: 40px; padding: 0 16px; border-radius: 10px; }
      .welcome-failed .link {
        justify-self: start;
        padding: 0;
        border: 0;
        background: none;
        color: var(--mc-muted);
        font-size: 13px;
        text-decoration: underline;
      }
      .welcome-failed .link:hover { color: var(--mc-text); }

      /*
       * A radio's button, as the list and the editor show it: the rail's own
       * look, or its colour in full, as when it is selected (--badge-on, and
       * --badge-on-ink for what is on it).
       */
      .face {
        flex: none;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 40px;
        height: 40px;
        border-radius: 12px;
        border: 1px solid var(--mc-rail-button-edge);
        background: var(--mc-rail-button);
        color: var(--mc-text);
        font-weight: 700;
        font-size: 13px;
      }
      .face.colored { background: var(--badge-on); border-color: var(--badge-on); color: var(--badge-on-ink); }
      .face .emoji { font-size: 20px; line-height: 1; font-weight: 400; }
      .face .pict, .rail-button .pict { display: flex; }
      .face .pict svg { width: 20px; height: 20px; }
      /* Three or four characters, as a node's short name, smaller to fit. */
      .glyph.long { font-size: 0.8em; letter-spacing: -0.02em; }
      .face.big { width: 72px; height: 72px; border-radius: 20px; font-size: 22px; }
      .face.big .emoji { font-size: 34px; }
      .face.big .pict svg { width: 34px; height: 34px; }

      /* The radios: their list, centred, the page's own. */
      .radios {
        width: 100%;
        max-width: 760px;
        /* No wider than the page however long a row's line: cut instead. */
        min-width: 0;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .radios .hint { font-size: 12px; margin: 4px 2px 0; }
      .radio-row {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 12px;
        border: 1px solid var(--mc-border);
        border-radius: 12px;
        background: var(--mc-surface);
      }
      .radio-row.selected { border-color: var(--mc-primary); background: var(--mc-soft); }
      .radio-row.hidden .pick,
      .radio-row.hidden .face-button { opacity: 0.6; }
      /* While one is dragged the others slide to make way, and it waits,
         faint, where it would fall. */
      .sorting > .radio-row { transition: transform 0.18s ease; }
      .radio-row.dragging { opacity: 0.45; border-style: dashed; border-color: var(--mc-primary); }
      .radio-row .grip { flex: none; display: flex; color: var(--mc-muted); cursor: grab; }
      .radio-row .grip svg { width: 16px; height: 16px; }
      .radio-row .moves { flex: none; display: flex; flex-direction: column; }
      .radio-row .moves button {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 22px;
        height: 18px;
        padding: 0;
        border: 0;
        background: transparent;
        color: var(--mc-muted);
      }
      .radio-row .moves button:hover:not(:disabled) { color: var(--mc-text); }
      .radio-row .moves button:disabled { opacity: 0.3; }
      .radio-row .moves svg { width: 14px; height: 14px; }
      .radio-row .face-button { flex: none; padding: 0; border: 0; border-radius: 12px; background: transparent; }
      .radio-row .face-button:hover .face { outline: 2px solid var(--mc-primary); outline-offset: 2px; }
      .radio-row .pick {
        flex: 1;
        min-width: 0;
        display: flex;
        align-items: center;
        padding: 0;
        border: 0;
        background: transparent;
        text-align: left;
      }
      .radio-row .who { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
      .radio-row .name { display: flex; align-items: center; gap: 8px; }
      .radio-row .who .mono { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .radio-row .badge { white-space: nowrap; font-size: 12px; font-weight: 400; }
      .radio-row .eye {
        flex: none;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 34px;
        height: 34px;
        padding: 0;
        background: transparent;
      }
      .radio-row .eye.off { color: var(--mc-muted); }
      .radio-row .eye svg { width: 18px; height: 18px; }
      .tag {
        padding: 0 6px;
        border-radius: 6px;
        background: var(--mc-raised);
        color: var(--mc-muted);
        font-size: 11px;
        font-weight: 400;
      }
      .switch {
        flex: none;
        position: relative;
        width: 40px;
        height: 22px;
        padding: 0;
        border: 0;
        border-radius: 11px;
        background: var(--mc-raised);
        box-shadow: inset 0 0 0 1px var(--mc-border);
      }
      .switch.on { background: var(--mc-primary); box-shadow: none; }
      .switch span {
        position: absolute;
        top: 3px;
        left: 3px;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #ffffff;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
        transition: left 0.15s;
      }
      .switch.on span { left: 21px; }

      /*
       * A radio's editor: over the list, in the middle of the window. Its
       * two sections take the same room, so that going from one to the
       * other moves nothing.
       */
      .modal-back {
        position: fixed;
        inset: 0;
        z-index: 3000;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        background: rgba(0, 0, 0, 0.5);
      }
      /*
       * A dialog is never taller than the window: its heading, and its
       * buttons at its foot, stay where they are, and only what is between
       * them scrolls, its scroll bar at the dialog's edge and under the
       * heading, never over it. Room above and below for the fields' focus
       * ring, which it would clip.
       */
      .modal-back > .card {
        --modal-pad: 20px;
        display: flex;
        flex-direction: column;
        max-height: 100%;
        overflow: hidden;
      }
      .modal-back > .card > :not(.modal-body, .editor-body, .dialog-top),
      .modal-back > .card > .dialog-top > :not(.modal-body, .editor-body) { flex: none; }
      .modal-back > .card > .modal-body,
      .modal-back > .card > .dialog-top > .modal-body {
        flex: 0 1 auto;
        min-height: 0;
        margin: -3px calc(-1 * var(--modal-pad));
        padding: 3px var(--modal-pad);
        overflow-y: auto;
      }
      .modal-back > .radio-editor { --modal-pad: 24px; }
      /* A dialog that belongs to the conversation, as a room's: over it alone,
         in its middle, with what is around it still in sight. */
      .modal-back.in-thread { position: absolute; z-index: 6; }
      .link-adder .modal-body { display: flex; flex-direction: column; gap: 12px; }
      /* About meshctl, as Meshview's: all in the middle, its links two by two
         under the first, across. */
      .modal-back > .card.about {
        position: relative;
        display: block;
        width: 460px;
        max-width: 100%;
        overflow-y: auto;
        padding: 30px 28px 24px;
        text-align: center;
        line-height: 1.55;
      }
      .about .close { position: absolute; top: 10px; right: 10px; }
      /* The foot of meshctl's settings, as a radio's: what it is, and the
         way to know more. */
      .sidebar > .about-foot { margin-top: auto; }
      .about-foot .foot-logo { width: 40px; height: 40px; flex: none; padding: 4px; box-sizing: border-box; color: var(--mc-primary); }
      .about-foot .info { display: flex; color: var(--mc-muted); }
      .about-foot .info svg { width: 18px; height: 18px; }
      .about-foot .own-node:hover .info { color: var(--mc-text); }
      .about .about-logo { display: block; width: 64px; height: 64px; margin: 0 auto 12px; color: var(--mc-primary); }
      .about h2 { margin: 0; font-size: 22px; }
      .about p { margin: 0 0 14px; }
      .about .about-version { margin-bottom: 16px; color: var(--mc-muted); font-size: 13px; min-height: 1.55em; }
      .about-links { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin: 0 0 18px; }
      .about-links a:first-child { grid-column: 1 / -1; }
      .about-links a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        min-height: 36px;
        padding: 0 12px;
        border: 1px solid var(--mc-border);
        border-radius: 8px;
        background: var(--mc-surface-2);
        color: var(--mc-text);
        text-decoration: none;
        font-size: 14px;
      }
      .about-links a:hover { border-color: var(--mc-primary); }
      .about-links .icon { display: flex; color: var(--mc-primary); }
      .about-links svg { width: 18px; height: 18px; }
      .about .about-small { margin-bottom: 6px; color: var(--mc-muted); font-size: 12.5px; text-wrap: balance; }
      .about .about-small a { color: var(--mc-muted); }
      .about-heart { color: #d93848; }
      .about-name { white-space: nowrap; }
      .about-flag { display: inline-flex; vertical-align: -0.12em; }
      .about-flag svg { height: 0.95em; width: auto; border-radius: 1.5px; fill: initial; stroke: none; }
      @media (max-width: 420px) { .about-links { grid-template-columns: 1fr; } }
      .radio-editor {
        width: 500px;
        max-width: 100%;
        display: flex;
        flex-direction: column;
        gap: 16px;
        padding: 20px 24px;
        container-type: inline-size;
      }
      .radio-editor.modal {
        max-height: 100%;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
      }
      .editor-head { display: flex; align-items: center; gap: 14px; }
      .editor-head .face { width: 56px; height: 56px; border-radius: 16px; font-size: 18px; }
      .editor-head .face .emoji { font-size: 28px; }
      .editor-head .face .pict svg { width: 28px; height: 28px; }
      .editor-head .who { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
      .editor-head h2 { margin: 0; font-size: 16px; }
      .editor-head .mono { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .editor-head .close {
        flex: none;
        align-self: flex-start;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-left: auto;
        width: 32px;
        height: 32px;
        padding: 0;
        border: 0;
        background: transparent;
        color: var(--mc-muted);
      }
      .editor-head .close svg { width: 20px; height: 20px; }
      .editor-head .close:hover { color: var(--mc-text); background: var(--mc-raised); }
      /* Both sections in the same room; less, scrolling, in a short window. */
      /* Room on its sides for the fields' focus ring, which it would clip. */
      .editor-body {
        flex: 0 1 396px;
        height: 396px;
        min-height: 0;
        margin: 0 -4px;
        padding: 3px 4px;
        overflow-y: auto;
      }
      /* In a dialog, its scroll bar at the dialog's edge, as every dialog's. */
      .modal-back > .card > .editor-body,
      .modal-back > .card > .dialog-top > .editor-body { margin: 0 calc(-1 * var(--modal-pad)); padding: 3px var(--modal-pad); }
      /*
       * In a short window, as a phone's with its keyboard open: what goes
       * over a dialog's buttons scrolls together, its heading and tabs too,
       * for what is being written to have the room; its buttons under it,
       * in sight. In a taller one, it is as if it were not there.
       */
      .dialog-top { display: contents; }
      @media (max-height: 640px) {
        .editor-head .face,
        .editor-head .reply-face { width: 40px; height: 40px; border-radius: 12px; }
        .editor-head .reply-face svg { width: 22px; height: 22px; }
        .modal-back > .card > .dialog-top {
          flex: 0 1 auto;
          min-height: 0;
          display: flex;
          flex-direction: column;
          gap: inherit;
          margin: -3px calc(-1 * var(--modal-pad));
          padding: 3px var(--modal-pad);
          overflow-y: auto;
        }
        .modal-back > .card > .dialog-top > .editor-body,
        .modal-back > .card > .dialog-top > .modal-body {
          flex: none;
          height: auto;
          margin: 0;
          padding: 0;
          overflow: visible;
        }
      }
      .radio-editor .fields,
      .button-look { display: flex; flex-direction: column; gap: 16px; }
      .radio-editor label,
      .radio-editor .field { display: grid; gap: 6px; align-content: start; }
      .radio-editor label > .dim,
      .radio-editor .field > .dim { font-size: 12px; }
      .radio-editor .hint { font-size: 12px; }
      .radio-editor .toggle { display: flex; align-items: center; gap: 10px; }
      .radio-editor .toggle > span { display: flex; flex-direction: column; }
      .radio-editor .toggle .dim { font-size: 12px; }
      /* A waypoint's form: its emoji beside its name, counted in bytes as
         the firmware keeps them. */
      .waypoint-form .modal-body { display: flex; flex-direction: column; gap: 14px; }
      .waypoint-name-row { display: flex; align-items: flex-end; gap: 10px; }
      .waypoint-name-row .waypoint-name { flex: 1; min-width: 0; }
      .waypoint-icon-pick {
        flex: none;
        width: 44px;
        height: 38px;
        padding: 0;
        font-size: 22px;
        line-height: 1;
      }
      .waypoint-icon-pick.on { border-color: var(--mc-primary); }
      .waypoint-name-row > .waypoint-count { padding-bottom: 10px; }
      .waypoint-count { font-size: 11px; font-variant-numeric: tabular-nums; }
      .field > span .waypoint-count { margin-left: 8px; }
      .waypoint-count.over { color: var(--mc-danger); font-weight: 600; }
      .waypoint-emojis { max-height: 260px; overflow: auto; border: 1px solid var(--mc-border); border-radius: 10px; }
      .waypoint-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      @container (max-width: 420px) { .waypoint-pair { grid-template-columns: 1fr; } }
      .waypoint-form textarea { resize: vertical; }
      .waypoint-form .error { margin: 0; color: var(--mc-danger); font-size: 13px; }
      .waypoint-fence { display: flex; flex-direction: column; gap: 10px; }
      .waypoint-hops > span:first-child { display: flex; justify-content: space-between; gap: 10px; }
      /* A slider, not a box to type in: none of the fields' looks. */
      .waypoint-hops input[type="range"] {
        width: 100%;
        height: 24px;
        padding: 0;
        border: 0;
        background: none;
        box-shadow: none;
        accent-color: var(--mc-primary);
      }
      .waypoint-area { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
      .waypoint-area .mono { font-size: 12px; }
      .waypoint-notify { display: flex; flex-wrap: wrap; gap: 8px 18px; }
      /* Twelve in a row; two rows of six when the editor is narrow. */
      .swatches { display: grid; grid-template-columns: repeat(12, 32px); gap: 6px; }
      @container (max-width: 440px) {
        .swatches { grid-template-columns: repeat(6, 32px); gap: 8px; }
      }
      .swatch {
        width: 32px;
        height: 32px;
        padding: 0;
        border: 2px solid transparent;
        border-radius: 50%;
        background: var(--swatch);
        cursor: pointer;
      }
      .swatch:hover { border-color: var(--mc-muted); }
      .swatch.on { border-color: var(--mc-text); box-shadow: inset 0 0 0 2px var(--mc-surface); }
      /* None: the rail's own button at rest, and the accent selected. */
      .swatch.none {
        --swatch-rest: var(--mc-rail-button);
        --swatch: var(--mc-primary);
        border: 1px dashed var(--mc-muted);
      }
      /* Both of a colour's tones: at rest, top left; selected, bottom right. */
      .swatch.none,
      .swatch.split,
      .swatch.other.split {
        background: linear-gradient(135deg, var(--swatch-rest) 50%, var(--swatch) 50%);
        background-origin: border-box;
      }
      .swatch.none.on { border: 2px solid var(--mc-text); }
      /* Any other colour: the wheel until one is picked, then that one. */
      .swatch.other {
        position: relative;
        background: var(--swatch, conic-gradient(#f06595, #f0a63a, #a9e34b, #38d9a9, #4dabf7, #9775fa, #f06595));
        /* The wheel from the edge in, not tiled under its border. */
        background-origin: border-box;
      }
      .swatch.other input {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        padding: 0;
        border: 0;
        opacity: 0;
        cursor: pointer;
      }
      .gone { display: none !important; }
      /* A pill that slides under the option picked, of --n of them. */
      .segmented {
        position: relative;
        display: grid;
        grid-template-columns: repeat(var(--n, 3), minmax(0, 1fr));
        padding: 3px;
        border: 1px solid var(--mc-border);
        border-radius: 10px;
        background: var(--mc-surface-2);
      }
      .segmented::before {
        content: "";
        position: absolute;
        top: 3px;
        bottom: 3px;
        left: 3px;
        width: calc((100% - 6px) / var(--n, 3));
        border-radius: 7px;
        background: var(--mc-primary);
        transform: translateX(calc(var(--at, 0) * 100%));
        transition: transform 0.2s ease;
      }
      .segmented button {
        position: relative;
        min-height: 32px;
        padding: 0 12px;
        border: 0;
        background: transparent;
        color: var(--mc-muted);
        transition: color 0.2s;
      }
      .segmented button:hover { color: var(--mc-text); }
      .segmented button.on { color: var(--mc-on-primary); font-weight: 600; }
      /* What the button shows: one panel, the same size for the three. */
      .look-panel {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 240px;
        padding: 12px;
        border: 1px solid var(--mc-border);
        border-radius: 12px;
        background: var(--mc-surface-2);
      }
      .look-text {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        font-size: 12px;
      }
      .look-text input {
        width: 140px;
        height: 64px;
        text-align: center;
        font-weight: 700;
        font-size: 26px;
      }
      .look-emoji { align-self: stretch; flex: 1; min-height: 0; display: flex; }
      .look-emoji .emoji-picker {
        flex: 1;
        min-height: 0;
        max-width: none;
        padding: 0;
        border: 0;
        background: none;
      }
      .look-emoji .emoji-grid { flex: 1; min-height: 0; max-height: none; }
      .icon-grid { display: grid; grid-template-columns: repeat(8, 44px); gap: 6px; }
      .icon-grid button {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 44px;
        padding: 0;
        border: 1px solid transparent;
        border-radius: 10px;
        background: transparent;
      }
      .icon-grid button.on { border-color: var(--mc-primary); background: var(--mc-soft); }
      .icon-grid svg { width: 22px; height: 22px; }
      .radio-editor .error { color: var(--mc-danger); margin: 0; }
      .radio-editor .error:empty { display: none; }
      .radio-editor .buttons {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        padding-top: 16px;
        border-top: 1px solid var(--mc-border);
      }
      /* All the same width, three to a row at most, a third each where the
         row is narrower; removing it is apart from the rest, on the left. */
      .radio-editor .buttons button { min-width: min(112px, calc((100% - 16px) / 3)); }
      .radio-editor .buttons .danger { margin-right: auto; }
      /* Adding a radio: the welcome's cards and fields, in a dialog, and the
         radios plugged in to pick from. */
      .radio-editor fieldset { min-width: 0; margin: 0; padding: 0; border: 0; }
      .radio-editor legend,
      .radio-editor .field > .label,
      .radio-editor .plugged-head > .label { margin-bottom: 6px; padding: 0; color: var(--mc-muted); font-size: 12px; }
      .radio-editor .field > .label,
      .radio-editor .plugged-head > .label { display: block; margin-bottom: 0; }
      .radio-editor .optional { font-weight: 400; }
      .radio-editor .field > .hint { color: var(--mc-muted); }
      .radio-editor .welcome-card { padding: 10px 12px; }
      .plugged-list { display: flex; flex-direction: column; gap: 8px; }
      .plugged-radio {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        padding: 10px 12px;
        border-radius: 12px;
        background: var(--mc-surface);
        text-align: left;
      }
      .plugged-radio > .icon { flex: none; display: flex; color: var(--mc-muted); }
      .plugged-radio > .icon svg { width: 22px; height: 22px; }
      .plugged-radio .what { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
      .plugged-radio .title { font-weight: 600; }
      .plugged-radio .detail { color: var(--mc-muted); font-size: 12px; overflow-wrap: anywhere; }
      .plugged-radio .waiting { color: var(--mc-primary); font-size: 12px; }
      .plugged-radio.on {
        border-color: var(--mc-primary);
        box-shadow: inset 0 0 0 1px var(--mc-primary);
        background: color-mix(in srgb, var(--mc-primary) 8%, var(--mc-surface));
      }
      .plugged-radio.on > .icon { color: var(--mc-primary); }
      .plugged-none { margin: 0; padding: 12px; border: 1px dashed var(--mc-border); border-radius: 12px; color: var(--mc-muted); font-size: 13px; text-align: center; }
      /* What the field is, and beside it, on the right, what to do when the
         radio is not among those shown: on a line of its own, still on the
         right, where both do not fit. */
      .plugged-head {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        justify-content: space-between;
        column-gap: 12px;
      }
      .plugged-head > .label { min-width: 0; }
      .plugged-hand {
        margin-left: auto;
        padding: 2px 0;
        border: 0;
        background: none;
        color: var(--mc-primary);
        font-size: 13px;
      }
      .plugged-hand:hover { text-decoration: underline; }
      .radio-editor .plugged,
      .welcome-radio .plugged { display: flex; flex-direction: column; gap: 8px; }

      /*
       * The automatic replies: rows as the radios', and, when there are
       * none, what they are for, with the ways to start.
       */
      /* The limit on a busy channel, over the replies, as a row of the data's
         times; and how busy each radio is now, under what it is. */
      .busy-limit h2:first-child,
      .app-listening h2:first-child { margin-top: 4px; }
      .app-listening h2:last-child { margin-bottom: 4px; }
      /* Its switch beside what it is, as a phone's settings have it, on
         any width: it takes so little room. */
      .app-listening .pref-row { border-bottom: 0; flex-wrap: nowrap; }
      .app-listening .pref-what { min-width: 0; }
      .app-listening .pref-control { width: auto; }
      .busy-limit h2:last-child { margin-bottom: 4px; }
      .busy-limit .pref-row { border-bottom: 0; }
      .busy-now { display: flex; flex-wrap: wrap; gap: 2px 14px; margin-top: 4px; }
      .busy-radio b { font-weight: 600; color: var(--mc-text); }
      .busy-radio.paused { color: var(--mc-danger); }
      .busy-radio .tag { margin-left: 6px; }
      .reply-row .who .places { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .replies-empty {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        padding: 28px 24px;
        text-align: center;
      }
      .replies-empty .icon { display: flex; color: var(--mc-primary); }
      .replies-empty .icon svg { width: 40px; height: 40px; }
      .replies-empty h2 { margin: 0; font-size: 16px; }
      .replies-empty p { max-width: 460px; margin: 0; font-size: 13px; }
      .replies-empty .buttons { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 8px; }
      /* Its editor: one column that scrolls between its heading and its
         buttons. */
      .reply-editor { width: 560px; }
      .reply-editor .modal-body { gap: 20px; }
      .reply-face {
        flex: none;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 56px;
        height: 56px;
        border-radius: 16px;
        background: var(--mc-soft);
        color: var(--mc-primary);
      }
      .reply-face svg { width: 28px; height: 28px; }
      .reply-editor .answers { gap: 12px; }
      .reply-editor .segmented button { padding: 0 6px; white-space: nowrap; }
      .reply-texts { display: flex; flex-direction: column; gap: 8px; }
      .reply-texts > .reply-texts { padding-left: 12px; border-left: 2px solid var(--mc-border); }
      .reply-texts textarea { width: 100%; resize: vertical; line-height: 1.45; overflow-wrap: anywhere; }
      /* Its emojis' button in the field, at its right, as the chat's. */
      .reply-field { position: relative; display: flex; }
      .reply-field textarea { padding-right: 40px; }
      .reply-field .emoji-toggle {
        position: absolute;
        top: 4px;
        right: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 32px;
        height: 32px;
        min-height: 0;
        padding: 0;
        border: 0;
        border-radius: 8px;
        background: none;
        color: var(--mc-muted);
      }
      .reply-field .emoji-toggle svg { width: 20px; height: 20px; }
      .reply-field .emoji-toggle:hover { color: var(--mc-text); }
      .reply-field .emoji-toggle.on { color: var(--mc-primary); }
      .reply-emojis .emoji-picker { max-width: none; background: var(--mc-surface); }
      .reply-emojis .emoji-groups { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); }
      .reply-emojis .emoji-groups button { width: auto; }
      .reply-preview { display: flex; align-items: center; gap: 8px; font-size: 12px; }
      .reply-preview .bubble {
        flex: 1;
        min-width: 0;
        padding: 6px 10px;
        border-radius: 10px;
        background: var(--mc-raised);
        font-size: 13px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .reply-preview .count { flex: none; color: var(--mc-muted); }
      .reply-preview .count.over { color: var(--mc-danger); }
      .reply-editor .variables { display: grid; gap: 6px; }
      .reply-editor .variables > .dim { font-size: 12px; }
      .reply-editor .chips { display: flex; flex-wrap: wrap; gap: 6px; }
      .reply-editor .variable {
        padding: 3px 8px;
        border: 1px solid var(--mc-border);
        border-radius: 999px;
        background: var(--mc-surface-2);
        font-size: 12px;
      }
      .reply-editor .variable:hover { border-color: var(--mc-primary); color: var(--mc-primary); }
      /* Small even by touch, as chips: there are ten. */
      .reply-editor .variable { min-height: 30px; }
      .reply-places { display: flex; flex-direction: column; gap: 10px; }
      .radio-places {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 16px;
        padding: 10px 12px;
        border: 1px solid var(--mc-border);
        border-radius: 10px;
      }
      .radio-places > b { flex: 1 1 100%; font-size: 13px; }
      .radio-places > .hint { flex: 1 1 100%; }
      .reply-editor label.check { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; }
      .reply-editor label.check .dim { font-size: 12px; }
      .reply-editor label.check input { min-height: 0; margin: 0; accent-color: var(--mc-primary); }

      /* Notifications: a card with the bell and the switch, and who shows
         them; a sample of one, as it will look; then each radio's card,
         a row for each conversation and how much of it is notified of.
         All but the first faded while they are off. */
      .notifications { display: flex; flex-direction: column; gap: 14px; width: 100%; max-width: 760px; margin: 0 auto; }
      .notifications .card { padding: 16px; display: flex; flex-direction: column; gap: 14px; }
      .notifications.off .notify-look,
      .notifications.off .notify-where,
      .notifications.off .notify-places { opacity: 0.5; }
      .notify-head { display: flex; align-items: center; gap: 14px; }
      .notify-what { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
      .notify-what h2, .notify-what h3 { margin: 0; font-size: 16px; }
      .notify-what h3 { font-size: 15px; }
      .notify-what .dim { font-size: 13px; }
      .notify-head > .switch { flex: none; }
      .notifications.off .notify-hero .reply-face { background: var(--mc-raised); color: var(--mc-muted); }
      .notify-status {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 0;
        padding: 10px 12px;
        border-radius: 10px;
        font-size: 13px;
        background: var(--mc-raised);
      }
      .notify-status > .icon { flex: none; display: flex; width: 18px; height: 18px; }
      .notify-status > .icon svg { width: 18px; height: 18px; }
      .notify-status > span:nth-child(2) { flex: 1 1 auto; min-width: 0; }
      .notify-status.ok { background: color-mix(in srgb, var(--mc-ok) 14%, transparent); }
      .notify-status.ok > .icon { color: var(--mc-ok); }
      .notify-status.ask { background: var(--mc-soft); }
      .notify-status.ask > .icon { color: var(--mc-primary); }
      .notify-status.bad { background: color-mix(in srgb, var(--mc-danger) 12%, transparent); }
      .notify-status.bad > .icon { color: var(--mc-danger); }
      .notify-status button { flex: none; min-height: 32px; padding: 4px 14px; }

      /* The two samples, with the text and without, as the choice between
         them: the one picked edged in the accent and ticked, the other
         faded until it is pointed at. */
      .notify-samples { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
      .notify-choice {
        display: flex;
        flex-direction: column;
        gap: 8px;
        min-width: 0;
        padding: 0;
        border: 0;
        background: transparent;
        color: inherit;
        text-align: left;
        cursor: pointer;
      }
      .notify-sample {
        position: relative;
        display: flex;
        align-items: flex-start;
        gap: 12px;
        min-height: 92px;
        padding: 12px 14px;
        border: 1px solid var(--mc-border);
        border-radius: 14px;
        background: var(--mc-page);
        box-shadow: 0 6px 18px rgb(0 0 0 / 0.08);
        opacity: 0.55;
        transition: opacity 0.2s, border-color 0.2s, box-shadow 0.2s;
      }
      .notify-choice:hover .notify-sample { opacity: 0.85; }
      .notify-choice.on .notify-sample {
        opacity: 1;
        border-color: var(--mc-primary);
        box-shadow: 0 0 0 2px var(--mc-soft), 0 6px 18px rgb(0 0 0 / 0.10);
      }
      .notify-sample .sample-app { flex: none; width: 36px; height: 36px; padding: 6px; border-radius: 10px; background: var(--mc-soft); }
      .notify-sample .sample-body { min-width: 0; display: flex; flex-direction: column; gap: 2px; font-size: 13px; padding-right: 18px; }
      .notify-sample .sample-top { display: flex; gap: 6px; font-size: 12px; color: var(--mc-muted); }
      .notify-sample .sample-top .dim::before { content: "·"; margin-right: 6px; }
      .notify-sample b { font-size: 14px; }
      .notify-sample .hidden-text { font-style: italic; }
      .notify-sample .tick {
        position: absolute;
        top: 10px;
        right: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 20px;
        height: 20px;
        border-radius: 10px;
        background: var(--mc-primary);
        color: var(--mc-on-primary);
        opacity: 0;
        transform: scale(0.6);
        transition: opacity 0.2s, transform 0.2s;
      }
      .notify-sample .tick svg { width: 14px; height: 14px; stroke-width: 3; }
      .notify-choice.on .tick { opacity: 1; transform: none; }
      .choice-caption { align-self: center; font-size: 13px; text-align: center; color: var(--mc-muted); }
      .notify-choice.on .choice-caption { color: var(--mc-text); font-weight: 600; }

      .notify-where { display: flex; flex-direction: column; gap: 3px; margin-top: 8px; padding: 0 4px; }
      .notify-where h2 { margin: 0; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--mc-muted); }
      .notify-where .dim { font-size: 13px; }
      .notify-places { display: flex; flex-direction: column; gap: 12px; }
      .notifications .notify-radio { gap: 0; padding: 10px 14px; }
      .notify-radio > header { display: flex; align-items: center; gap: 12px; }
      .notify-radio-head {
        flex: 1 1 auto;
        min-width: 0;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 2px 0;
        border: 0;
        background: transparent;
        color: inherit;
        text-align: left;
        cursor: pointer;
      }
      .notify-radio-head .chevron { flex: none; display: flex; margin-left: auto; color: var(--mc-muted); transition: transform 0.2s ease; }
      .notify-radio-head .chevron svg { width: 18px; height: 18px; }
      .notify-radio.open .notify-radio-head .chevron { transform: rotate(180deg); }
      .notify-radio-head:hover .chevron { color: var(--mc-text); }
      /* How much of a radio: words, or on a phone circles; some, chosen
         only as it is, in grey as never is. */
      .notify-level { flex: none; }
      .notify-level button { min-height: 32px; font-size: 13px; }
      .notify-level .level-icon { display: none; }
      .notify-level .level-icon svg { width: 18px; height: 18px; }
      /* All: the circle full, as drawn, not outlined as every icon is. */
      .notify-level button:last-child .level-icon svg { fill: currentColor; stroke: none; }
      .notify-level button.some { font-style: italic; cursor: default; }
      .notify-level button.some:hover { color: var(--mc-muted); }
      .notify-level button.some.on:hover { color: var(--mc-text); }
      .notify-level:has(button:first-child.on)::before,
      .notify-level:has(button.some.on)::before { background: var(--mc-raised); box-shadow: inset 0 0 0 1px var(--mc-border); }
      .notify-level button:first-child.on,
      .notify-level button.some.on { color: var(--mc-text); }
      .notify-radio-body { display: flex; flex-direction: column; margin-top: 10px; padding-top: 4px; border-top: 1px solid var(--mc-border); }
      .notify-radio .notify-badge { width: 40px; height: 40px; border-radius: 20px; cursor: default; }
      .notify-radio-name { display: flex; flex-direction: column; min-width: 0; }
      .notify-radio-name .dim { font-size: 12px; }
      .notify-row { display: flex; align-items: center; gap: 12px; min-height: 48px; }
      .notify-row + .notify-row { border-top: 1px solid color-mix(in srgb, var(--mc-border) 60%, transparent); }
      .notify-row .row-icon { flex: none; display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 9px; background: var(--mc-soft); color: var(--mc-primary); }
      .notify-row .row-icon svg { width: 18px; height: 18px; }
      .notify-row .row-name { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; font-size: 14px; }
      .notify-row .row-name > span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .notify-row .row-name .dim { font-size: 12px; }
      .notify-row.quiet .row-icon { background: var(--mc-raised); color: var(--mc-muted); }
      .notify-row.quiet .row-name { color: var(--mc-muted); }
      .notify-row .segmented.pref-control { flex: none; width: auto; min-width: 0; }
      .notify-row .segmented button { min-height: 32px; font-size: 13px; }
      /* Never, chosen, in grey: the accent is for what is notified of. */
      .notify-row.quiet .segmented::before { background: var(--mc-raised); box-shadow: inset 0 0 0 1px var(--mc-border); }
      .notify-row.quiet .segmented button.on { color: var(--mc-text); }
      .notify-radio-body > .hint { margin: 6px 0; }
      @media (max-width: 835px) {
        .notifications .card { padding: 14px; }
        .notify-hero .reply-face { width: 44px; height: 44px; border-radius: 12px; }
        .notify-hero .reply-face svg { width: 22px; height: 22px; }
        .notify-row { flex-wrap: wrap; row-gap: 6px; padding: 6px 0; }
        .notify-row .segmented.pref-control { flex: 1 1 100%; }
        .notify-samples { grid-template-columns: 1fr; gap: 12px; }
        .notify-level .level-word { display: none; }
        .notify-level button::before { content: none; }
        .notify-level .level-icon { display: flex; }
        .notify-level button { width: 38px; min-width: 0; padding: 0; }
      }

      /* The emoji picker: a search, the groups, and the emojis. */
      .emoji-picker {
        display: flex;
        flex-direction: column;
        gap: 8px;
        max-width: 520px;
        padding: 10px;
        border: 1px solid var(--mc-border);
        border-radius: 12px;
        background: var(--mc-surface-2);
      }
      .emoji-groups {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        padding-bottom: 8px;
        border-bottom: 1px solid var(--mc-border);
      }
      .emoji-groups button {
        width: 36px;
        height: 32px;
        padding: 0;
        border-color: transparent;
        background: transparent;
        font-size: 16px;
      }
      .emoji-groups button.on { border-color: var(--mc-primary); background: var(--mc-soft); }
      .emoji-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(36px, 1fr));
        gap: 2px;
        max-height: 200px;
        overflow-y: auto;
      }
      .emoji-grid button {
        height: 36px;
        padding: 0;
        border: 0;
        border-radius: 8px;
        background: transparent;
        font-size: 20px;
      }
      .emoji-grid button:hover { background: var(--mc-raised); }
      .emoji-grid button.on { background: var(--mc-soft); }
      .emoji-grid p { grid-column: 1 / -1; margin: 8px 0; }

      /* A node's lesser actions as icons where there is room; behind three
         dots, in a menu under them, where there is not. */
      .topbar .actions .more-actions { display: none; position: relative; }
      .heading-menu {
        position: absolute;
        top: calc(100% + 6px);
        right: 0;
        z-index: 60;
        display: flex;
        flex-direction: column;
        min-width: 220px;
        padding: 6px;
        border: 1px solid var(--mc-border);
        border-radius: 12px;
        background: var(--mc-surface);
        box-shadow: 0 12px 32px rgb(0 0 0 / 30%);
      }
      .heading-menu button {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 40px;
        padding: 0 12px;
        border: 0;
        border-radius: 8px;
        background: none;
        font-weight: 400;
        text-align: left;
        white-space: nowrap;
      }
      .heading-menu button:hover:not(:disabled) { background: var(--mc-raised); }
      /* Not spaced as the heading's own buttons it sits among. */
      .actions .heading-menu button { margin-left: 0; }
