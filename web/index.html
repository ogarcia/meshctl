<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>meshctl</title>
    <link
      data-trunk
      rel="rust"
      data-cargo-profile-release="wasm-release"
      data-wasm-opt="z"
    />
    <style>
      :root {
        --bg: #f6f7f9;
        --card: #ffffff;
        --text: #1b1f24;
        --dim: #6a737d;
        --line: #e3e6ea;
        --accent: #2f6fde;
        --ok: #1f8a4c;
        --warn: #b7791f;
        --bad: #c53030;
        --mono: ui-monospace, "JetBrains Mono", "SFMono-Regular", Menlo, monospace;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f1216;
          --card: #171b21;
          --text: #e6e9ed;
          --dim: #8b949e;
          --line: #262c34;
          --accent: #6ea0ff;
          --ok: #3fb96f;
          --warn: #d69e2e;
          --bad: #f56565;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 16px;
        border-bottom: 1px solid var(--line);
        background: var(--card);
      }
      header h1 { margin: 0 auto 0 0; font-size: 18px; letter-spacing: 0.02em; }
      main {
        display: grid;
        gap: 16px;
        padding: 16px;
        max-width: 1200px;
        margin: 0 auto;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 14px 16px;
        min-width: 0;
      }
      h2 { margin: 0 0 10px; font-size: 16px; }
      button, input {
        font: inherit;
        color: inherit;
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 6px 10px;
      }
      button { cursor: pointer; }
      button:hover { border-color: var(--accent); }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        color: var(--dim);
      }
      .badge::before {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--warn);
      }
      .badge.ready::before { background: var(--ok); }
      .badge.radio-down::before,
      .badge.daemon-down::before { background: var(--bad); }
      .local dl {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 4px 16px;
        margin: 0;
      }
      .local dt { color: var(--dim); }
      .local dd { margin: 0; }
      .toolbar {
        display: flex;
        align-items: baseline;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 8px;
      }
      .toolbar h2 { margin: 0 auto 0 0; }
      .toolbar input { width: min(260px, 100%); }
      .count { color: var(--dim); font-weight: normal; }
      .scroll { overflow-x: auto; }
      table { width: 100%; border-collapse: collapse; }
      th, td {
        text-align: left;
        padding: 6px 8px;
        border-bottom: 1px solid var(--line);
        white-space: nowrap;
      }
      th { color: var(--dim); font-weight: 500; font-size: 12px; }
      tbody tr:hover { background: var(--bg); }
      .num { text-align: right; font-variant-numeric: tabular-nums; }
      .mono { font-family: var(--mono); font-size: 13px; }
      .dim { color: var(--dim); }
      .short {
        display: inline-block;
        min-width: 3.2em;
        padding: 0 6px;
        border-radius: 5px;
        background: var(--bg);
        border: 1px solid var(--line);
        font-family: var(--mono);
        font-size: 12px;
        text-align: center;
      }
      .token { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
      .token p { margin: 0 auto 0 0; }
      select {
        font: inherit;
        color: inherit;
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 6px 10px;
      }
      .picker { max-width: 40vw; }
      .badge.disabled::before { background: var(--dim); }
      a { color: var(--accent); text-decoration: none; }
      a:hover { text-decoration: underline; }
      button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
      button.danger:hover { border-color: var(--bad); color: var(--bad); }
      button:disabled { opacity: 0.6; cursor: default; }
      .actions { text-align: right; }
      .actions button { margin-left: 6px; }
      .note { border-left: 3px solid var(--warn); color: var(--dim); margin: 0; }
      nav { display: flex; gap: 4px; }
      .tab.active { border-color: var(--accent); color: var(--accent); }
      .chat {
        display: grid;
        grid-template-columns: minmax(200px, 280px) 1fr;
        gap: 0;
        padding: 0;
        height: calc(100vh - 110px);
        min-height: 420px;
        overflow: hidden;
      }
      .conversations {
        list-style: none;
        margin: 0;
        padding: 6px;
        overflow-y: auto;
        border-right: 1px solid var(--line);
      }
      .conversations button {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 2px 8px;
        width: 100%;
        text-align: left;
        border: 0;
        border-radius: 8px;
        background: none;
        padding: 8px 10px;
      }
      .conversations li.active button { background: var(--bg); }
      .conversations .title { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .conversations .when { font-size: 12px; }
      .conversations .preview {
        grid-column: 1 / -1;
        font-size: 12px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .thread { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
      .thread h2 { padding: 12px 16px 8px; margin: 0; border-bottom: 1px solid var(--line); }
      .thread .empty { margin: auto; }
      .messages {
        flex: 1;
        overflow-y: auto;
        padding: 12px 16px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .bubble {
        max-width: min(70%, 560px);
        align-self: flex-start;
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 12px 12px 12px 4px;
        padding: 6px 10px;
      }
      .bubble.mine {
        align-self: flex-end;
        border-radius: 12px 12px 4px 12px;
        border-color: var(--accent);
      }
      .bubble p { margin: 2px 0; white-space: pre-wrap; overflow-wrap: anywhere; }
      .bubble .author { font-size: 12px; color: var(--dim); }
      .bubble .meta { font-size: 11px; display: block; text-align: right; }
      .mark.delivered, .mark.sent { color: var(--ok); }
      .mark.failed { color: var(--bad); cursor: help; }
      .composer {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
        padding: 10px 16px;
        border-top: 1px solid var(--line);
      }
      .composer input { flex: 1; min-width: 0; }
      .composer .count { font-size: 12px; font-variant-numeric: tabular-nums; }
      .composer .count.over { color: var(--bad); }
      .composer .error { flex-basis: 100%; margin: 0; color: var(--dim); font-size: 12px; }
      .composer .error:empty { display: none; }
      @media (max-width: 700px) {
        .chat { grid-template-columns: 1fr; height: auto; }
        .conversations { border-right: 0; border-bottom: 1px solid var(--line); max-height: 30vh; }
        .messages { max-height: 55vh; }
      }
      .welcome { max-width: 640px; }
      .welcome p { color: var(--dim); }
      .radio-form {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 12px 16px;
        align-items: end;
      }
      .radio-form label { display: grid; gap: 4px; }
      .radio-form label span { color: var(--dim); font-size: 12px; }
      .radio-form label.check {
        display: flex;
        gap: 8px;
        align-items: center;
        padding-bottom: 8px;
      }
      .radio-form label.check span { font-size: inherit; color: inherit; }
      .radio-form .hint,
      .radio-form .error,
      .radio-form .buttons { grid-column: 1 / -1; margin: 0; }
      .radio-form .hint { color: var(--dim); font-size: 12px; }
      .radio-form .error { color: var(--bad); }
      .radio-form .error:empty { display: none; }
      .radio-form .buttons { display: flex; gap: 8px; }
    </style>
  </head>
  <body></body>
</html>
