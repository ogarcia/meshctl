    <style>
      /*
       * Colours. The preferences come as attributes on <html>, put there by
       * the daemon as it serves the page and by the interface as they change:
       * data-theme (none to follow the system's), data-accent and
       * data-map-theme. The neutrals depend on the theme alone; the accent
       * sets --mc-primary, the text on it, and --mc-second, a colour that
       * stands apart from it (direct nodes, delivered marks). Another accent
       * is one more pair of blocks like amber's, light and dark.
       */
      :root {
        --mc-page: #f4f5f7;
        --mc-rail: #e8ebef;
        --mc-surface: #ffffff;
        --mc-surface-2: #f8f9fa;
        --mc-raised: #eef0f3;
        /* The radios' buttons on the rail: white on its grey, to stand out. */
        --mc-rail-button: #ffffff;
        --mc-rail-button-edge: #cfd5dc;
        --mc-border: #d8dde3;
        --mc-text: #161b22;
        --mc-muted: #57606a;
        --mc-ok: #16805f;
        --mc-warn: #9a6700;
        --mc-danger: #b42318;
        --mc-shadow: 0 12px 32px rgba(22, 27, 34, 0.14);
        --mc-map: #e9eef2;
        /* Nodes, by how far: their own colours, whatever the accent, sharp on
           any tile. Cool, and dimmer the further, with no red or orange to
           read as something wrong: teal, blue, violet, grey. */
        --mc-node-direct: #099268;
        --mc-node-near: #1971c2;
        --mc-node-mid: #7048e8;
        --mc-node-far: #6c757d;
        /*
         * Radios' buttons of the palette, as the rail's own and the accent: at
         * rest, a light tone with dark text here (a deep one with light text
         * on the dark theme); selected, -on, a deep one with light text here
         * (a vivid one with dark text there).
         */
        --mc-badge-ink: #161b22;
        --mc-badge-ink-on: #ffffff;
        --mc-badge-amber: #ffc078;
        --mc-badge-amber-on: #b35c00;
        --mc-badge-coral: #ffa8a8;
        --mc-badge-coral-on: #c92a2a;
        --mc-badge-pink: #faa2c1;
        --mc-badge-pink-on: #a61e4d;
        --mc-badge-grape: #e599f7;
        --mc-badge-grape-on: #862e9c;
        --mc-badge-violet: #b197fc;
        --mc-badge-violet-on: #5f3dc4;
        --mc-badge-blue: #74c0fc;
        --mc-badge-blue-on: #1864ab;
        --mc-badge-cyan: #66d9e8;
        --mc-badge-cyan-on: #0b7285;
        --mc-badge-teal: #63e6be;
        --mc-badge-teal-on: #087f5b;
        --mc-badge-lime: #c0eb75;
        --mc-badge-lime-on: #4a7a0b;
        --mc-badge-gray: #ced4da;
        --mc-badge-gray-on: #495057;
        --mc-font: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
        --mc-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
      }
      :root[data-theme="dark"] {
        --mc-page: #0e1116;
        --mc-rail: #0a0d11;
        --mc-surface: #12161c;
        --mc-surface-2: #0f1318;
        --mc-raised: #1b222b;
        --mc-rail-button: #1b222b;
        --mc-rail-button-edge: transparent;
        --mc-border: #2a3340;
        --mc-text: #e6edf3;
        --mc-muted: #9aa7b4;
        --mc-ok: #3fbf9f;
        --mc-warn: #e8b341;
        --mc-danger: #f0a0a0;
        --mc-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
        --mc-map: #0b1520;
        --mc-node-direct: #38d9a9;
        --mc-node-near: #4dabf7;
        --mc-node-mid: #b197fc;
        --mc-node-far: #a5aeb8;
        --mc-badge-ink: #ffffff;
        --mc-badge-ink-on: #161b22;
        --mc-badge-amber: #b35c00;
        --mc-badge-amber-on: #ffa94d;
        --mc-badge-coral: #c92a2a;
        --mc-badge-coral-on: #ff8787;
        --mc-badge-pink: #a61e4d;
        --mc-badge-pink-on: #f783ac;
        --mc-badge-grape: #862e9c;
        --mc-badge-grape-on: #da77f2;
        --mc-badge-violet: #5f3dc4;
        --mc-badge-violet-on: #9775fa;
        --mc-badge-blue: #1864ab;
        --mc-badge-blue-on: #4dabf7;
        --mc-badge-cyan: #0b7285;
        --mc-badge-cyan-on: #3bc9db;
        --mc-badge-teal: #087f5b;
        --mc-badge-teal-on: #38d9a9;
        --mc-badge-lime: #4a7a0b;
        --mc-badge-lime-on: #a9e34b;
        --mc-badge-gray: #495057;
        --mc-badge-gray-on: #adb5bd;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --mc-page: #0e1116;
          --mc-rail: #0a0d11;
          --mc-surface: #12161c;
          --mc-surface-2: #0f1318;
          --mc-raised: #1b222b;
          --mc-rail-button: #1b222b;
          --mc-rail-button-edge: transparent;
          --mc-border: #2a3340;
          --mc-text: #e6edf3;
          --mc-muted: #9aa7b4;
          --mc-ok: #3fbf9f;
          --mc-warn: #e8b341;
          --mc-danger: #f0a0a0;
          --mc-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
          --mc-map: #0b1520;
          --mc-node-direct: #38d9a9;
          --mc-node-near: #4dabf7;
          --mc-node-mid: #b197fc;
          --mc-node-far: #a5aeb8;
          --mc-badge-ink: #ffffff;
          --mc-badge-ink-on: #161b22;
          --mc-badge-amber: #b35c00;
          --mc-badge-amber-on: #ffa94d;
          --mc-badge-coral: #c92a2a;
          --mc-badge-coral-on: #ff8787;
          --mc-badge-pink: #a61e4d;
          --mc-badge-pink-on: #f783ac;
          --mc-badge-grape: #862e9c;
          --mc-badge-grape-on: #da77f2;
          --mc-badge-violet: #5f3dc4;
          --mc-badge-violet-on: #9775fa;
          --mc-badge-blue: #1864ab;
          --mc-badge-blue-on: #4dabf7;
          --mc-badge-cyan: #0b7285;
          --mc-badge-cyan-on: #3bc9db;
          --mc-badge-teal: #087f5b;
          --mc-badge-teal-on: #38d9a9;
          --mc-badge-lime: #4a7a0b;
          --mc-badge-lime-on: #a9e34b;
          --mc-badge-gray: #495057;
          --mc-badge-gray-on: #adb5bd;
        }
      }
      /* Amber, the default. */
      :root,
      :root[data-accent="amber"] {
        --mc-primary: #9a5b00;
        --mc-on-primary: #ffffff;
        --mc-second: #1f6fd1;
      }
      :root[data-theme="dark"],
      :root[data-theme="dark"][data-accent="amber"] {
        --mc-primary: #f0a63a;
        --mc-on-primary: #1a1205;
        --mc-second: #5aa9ff;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]),
        :root:not([data-theme="light"])[data-accent="amber"] {
          --mc-primary: #f0a63a;
          --mc-on-primary: #1a1205;
          --mc-second: #5aa9ff;
        }
      }
      /* Worked out from the rest, so that each accent says only its own. */
      body {
        --mc-soft: color-mix(in srgb, var(--mc-primary) 16%, var(--mc-surface));
        --mc-near: color-mix(in srgb, var(--mc-second) 50%, var(--mc-surface));
        --mc-far: color-mix(in srgb, var(--mc-muted) 40%, var(--mc-surface));
        --mc-out: color-mix(in srgb, var(--mc-second) 22%, var(--mc-surface));
      }

      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        background: var(--mc-page);
        color: var(--mc-text);
        font: 14px/1.45 var(--mc-font);
      }
      button, input, select, textarea {
        font: inherit;
        color: inherit;
        background: var(--mc-raised);
        border: 1px solid var(--mc-border);
        border-radius: 8px;
        padding: 6px 12px;
      }
      button { cursor: pointer; }
      button:hover { border-color: var(--mc-primary); }
      /*
       * Focus, in the accent: a ring around what the keyboard is on, and the
       * edge of a field being written in. The browser's own controls (check
       * boxes, ranges) take the accent too.
       */
      :root { accent-color: var(--mc-primary); }
      :focus-visible { outline: 2px solid var(--mc-primary); outline-offset: 2px; }
      input:focus, select:focus, textarea:focus {
        outline: none;
        border-color: var(--mc-primary);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--mc-primary) 30%, transparent);
      }
      button:disabled { opacity: 0.6; cursor: default; }
      button.primary {
        background: var(--mc-primary);
        border-color: var(--mc-primary);
        color: var(--mc-on-primary);
        font-weight: 600;
      }
      button.danger:hover { border-color: var(--mc-danger); color: var(--mc-danger); }
      button.small { padding: 2px 8px; font-size: 12px; }
      input, select, textarea { background: var(--mc-page); }
      a { color: var(--mc-primary); text-decoration: none; }
      a:hover { text-decoration: underline; }
      svg { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

      /* The frame: the radios, the radio's pages, and the page. */
      .app {
        display: grid;
        grid-template-columns: 72px 264px minmax(0, 1fr);
        height: 100vh;
        height: 100dvh;
      }
      .rail {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        padding: 14px 0;
        background: var(--mc-rail);
        border-right: 1px solid var(--mc-border);
        overflow-y: auto;
      }
      .rail .logo { width: 26px; height: 26px; flex: none; stroke: var(--mc-primary); }
      .rail-rule { width: 32px; border-top: 1px solid var(--mc-border); margin: 2px 0; }
      .rail-space { flex: 1; }
      .rail-button {
        position: relative;
        flex: none;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 48px;
        height: 48px;
        padding: 0;
        border: 1px solid var(--mc-rail-button-edge);
        border-radius: 24px;
        background: var(--mc-rail-button);
        color: var(--mc-text);
        font-weight: 700;
        font-size: 13px;
        transition: border-radius 0.15s;
      }
      /*
       * One way for every button: at rest, its colour dimmed into the rail's
       * (the rail's own grey, with none); on hover, a ring in the accent, a
       * gap away so that it reads on any colour; selected, its colour in full
       * (the accent, with none), squared, and the pill on the rail's edge.
       */
      .rail-button:hover {
        border-radius: 14px;
        /* The ring alone: not the accent edge every other button takes. */
        border-color: var(--mc-rail-button-edge);
        outline: 2px solid var(--mc-primary);
        outline-offset: 2px;
      }
      .rail-button.active {
        border-radius: 14px;
        background: var(--mc-primary);
        border-color: var(--mc-primary);
        color: var(--mc-on-primary);
      }
      /* The one selected, marked by a pill on the rail's left edge. */
      .rail-button.active::before {
        content: "";
        position: absolute;
        left: -12px;
        top: 50%;
        width: 4px;
        height: 24px;
        border-radius: 0 4px 4px 0;
        background: var(--mc-primary);
        transform: translateY(-50%);
      }
      .rail-button svg { width: 22px; height: 22px; }
      /* A radio with a colour of its own keeps it, selected too. */
      .rail-button.colored {
        background: var(--badge);
        border-color: transparent;
        color: var(--badge-ink);
      }
      .rail-button.colored.active {
        background: var(--badge-on);
        border-color: var(--badge-on);
        color: var(--badge-on-ink);
      }
      .rail-button .emoji { font-size: 22px; line-height: 1; font-weight: 400; }
      .rail-button .pict svg { width: 22px; height: 22px; }
      .rail-button .dot {
        position: absolute;
        right: -1px;
        bottom: -1px;
        width: 12px;
        height: 12px;
        box-sizing: border-box;
        border-radius: 50%;
        border: 2px solid var(--mc-rail);
        background: var(--mc-warn);
      }
      .dot.ready { background: var(--mc-ok); }
      .dot.radio-down { background: var(--mc-danger); }
      .dot.disabled { background: var(--mc-far); }

      .sidebar {
        display: flex;
        flex-direction: column;
        min-height: 0;
        background: var(--mc-surface);
        border-right: 1px solid var(--mc-border);
      }
      /* As tall as the page's top bar beside it, their edges in one line. */
      .sidebar-head {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 2px;
        min-height: 53px;
        padding: 4px 16px;
        border-bottom: 1px solid var(--mc-border);
      }
      .sidebar-head h1 { margin: 0; font-size: 16px; }
      .sidebar-head span { font-size: 12px; }
      .sidebar-body {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding: 8px;
        overflow-y: auto;
      }
      .sidebar-body h2 {
        margin: 14px 0 4px;
        padding: 0 10px;
        font-size: 11px;
        font-weight: 600;
        color: var(--mc-muted);
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      .sidebar-body .empty { margin: 0; padding: 2px 10px; font-size: 12px; }
      .item {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        min-height: 36px;
        padding: 0 10px;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: var(--mc-muted);
        text-align: left;
      }
      .item:hover { background: var(--mc-raised); color: var(--mc-text); }
      .item.active { background: var(--mc-soft); color: var(--mc-text); font-weight: 600; }
      .item .count { margin-left: auto; font-size: 12px; font-weight: 400; color: var(--mc-muted); }
      .item .label { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .mark-channel { width: 8px; text-align: center; color: var(--mc-muted); }
      .mark-node { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--mc-node-far); }
      .mark-node.direct { background: var(--mc-node-direct); }
      .mark-node.near { background: var(--mc-node-near); }
      .mark-node.mid { background: var(--mc-node-mid); }

      .avatar {
        flex: none;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: var(--mc-primary);
        color: var(--mc-on-primary);
        font-size: 12px;
        font-weight: 700;
        overflow: hidden;
      }
      .local-foot {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        background: var(--mc-surface-2);
        border-top: 1px solid var(--mc-border);
      }
      .local-foot .who { display: flex; flex-direction: column; flex: 1; min-width: 0; }
      .local-foot .who b { font-size: 13px; }
      .local-foot .who span { font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .local-foot .settings {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 40px;
        height: 40px;
        padding: 0;
        border: 0;
        border-radius: 10px;
        background: transparent;
        color: var(--mc-muted);
      }
      .local-foot .settings:hover,
      .local-foot .settings.active { background: var(--mc-raised); color: var(--mc-text); }
      .local-foot .settings svg { width: 18px; height: 18px; }

      .page { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
      .topbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px;
        min-height: 53px;
        padding: 5px 20px;
        background: var(--mc-surface);
        border-bottom: 1px solid var(--mc-border);
      }
      .topbar h1 { margin: 0; font-size: 16px; font-weight: 600; }
      .topbar .heading { display: flex; flex-direction: column; min-width: 0; }
      .topbar .heading span { font-size: 12px; }
      .topbar .avatar { width: 32px; height: 32px; font-size: 11px; background: var(--mc-near); color: var(--mc-text); }
      .topbar .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-left: auto; }
      .topbar .actions button { min-height: 34px; font-weight: 600; white-space: nowrap; }
      .menu-toggle { display: none; }
      /* On a wide screen the map goes without the bar over it, as its nodes'
         cards say all it would. A narrow one keeps it, for its menu button,
         until phones get a design of their own. */
      @media (min-width: 761px) {
        .app.on-map .topbar { display: none; }
      }
      main {
        flex: 1;
        display: grid;
        align-content: start;
        gap: 16px;
        padding: 20px;
        overflow: auto;
      }
      main:has(> .thread) { display: flex; padding: 0; overflow: hidden; }

      /* A narrow screen: the page, and the bars over it when asked for. */
      @media (max-width: 760px) {
        .app { grid-template-columns: minmax(0, 1fr); }
        .rail, .sidebar { display: none; }
        .app.menu-open .rail,
        .app.menu-open .sidebar {
          display: flex;
          position: fixed;
          top: 0;
          bottom: 0;
          z-index: 2000;
        }
        .app.menu-open .rail { left: 0; width: 72px; }
        .app.menu-open .sidebar {
          left: 72px;
          width: min(264px, calc(100vw - 72px));
          box-shadow: var(--mc-shadow);
        }
        /* Behind the bars and over the page: a touch on it closes them. */
        .app.menu-open .menu-backdrop {
          display: block;
          position: fixed;
          inset: 0;
          z-index: 1999;
          border: 0;
          border-radius: 0;
          padding: 0;
          background: rgba(0, 0, 0, 0.4);
        }
        .menu-toggle {
          display: flex;
          align-items: center;
          justify-content: center;
          width: 40px;
          height: 40px;
          padding: 0;
        }
        .menu-toggle svg { width: 20px; height: 20px; }
        .topbar { padding: 8px 12px; }
        main { padding: 12px; }
      }

      /* Pages. */
      .card {
        background: var(--mc-surface);
        border: 1px solid var(--mc-border);
        border-radius: 12px;
        padding: 14px 16px;
        min-width: 0;
      }
      h2 { margin: 0 0 10px; font-size: 16px; }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        color: var(--mc-muted);
      }
      .badge::before {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--mc-warn);
      }
      .badge.ready::before { background: var(--mc-ok); }
      .badge.radio-down::before,
      .badge.daemon-down::before { background: var(--mc-danger); }
      .badge.disabled::before { background: var(--mc-far); }
      .local dl {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 4px 16px;
        margin: 0;
      }
      .local dt { color: var(--mc-muted); }
      .local dd { margin: 0; }
      .toolbar {
        display: flex;
        align-items: baseline;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 8px;
      }
      .toolbar h2 { margin: 0 auto 0 0; }
      .toolbar input { width: min(260px, 100%); }
      .count { color: var(--mc-muted); font-weight: normal; }
      .scroll { overflow-x: auto; }
      table { width: 100%; border-collapse: collapse; }
      th, td {
        text-align: left;
        padding: 6px 8px;
        border-bottom: 1px solid var(--mc-border);
        white-space: nowrap;
      }
      th { color: var(--mc-muted); font-weight: 500; font-size: 12px; }
      tbody tr:hover { background: var(--mc-surface-2); }
      .num { text-align: right; font-variant-numeric: tabular-nums; }
      .mono { font-family: var(--mc-mono); font-size: 12px; }
      .dim { color: var(--mc-muted); }
      .short {
        display: inline-block;
        min-width: 3.2em;
        padding: 0 6px;
        border-radius: 5px;
        background: var(--mc-raised);
        font-family: var(--mc-mono);
        font-size: 12px;
        text-align: center;
      }
      .token { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
      .token p { margin: 0 auto 0 0; }
      .actions { text-align: right; }
      .actions button { margin-left: 6px; }
      .note { border-left: 3px solid var(--mc-warn); color: var(--mc-muted); margin: 0; }
      .note.bad { border-left-color: var(--mc-danger); }

      /*
       * The preferences, centred as the radios are: each one a row, what it
       * is on the left and its control on the right, every control as wide.
       */
      .preferences { width: 100%; max-width: 760px; margin: 0 auto; }
      .pref-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;

      details.section { border-top: 1px solid var(--mc-border); }

      .map-legend i { width: 10px; height: 10px; border-radius: 50%; background: var(--mc-pin-far); }
      .map-legend i.local { background: var(--mc-pin-local); }
      .map-legend i.direct { background: var(--mc-pin-direct); }
      .map-legend i.near { background: var(--mc-pin-near); }
      .map-legend i.mid { background: var(--mc-pin-mid); }
      .map-empty {

        left: 50%;

        margin: 0;
        max-width: calc(100% - 24px);

      /* The tiles, darkened when the map is dark: as asked for, or following
         the interface's theme, given or the system's. */
      :root[data-map-theme="dark"] .leaflet-tile-pane,
      :root[data-theme="dark"]:not([data-map-theme="light"]) .leaflet-tile-pane {
        filter: invert(1) hue-rotate(180deg) brightness(0.85) saturate(0.75);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]):not([data-map-theme="light"]) .leaflet-tile-pane {
          filter: invert(1) hue-rotate(180deg) brightness(0.85) saturate(0.75);
        }
      }
      /* A route's colours, by how each hop was heard, and the band edging its
         lines: for the map's own theme, which may not be the page's. Bright
         and apart from the tiles' greens and the roads' reds and browns.
         So the nodes' pins too, the --mc-pin-* colours: those of --mc-node-*
         for the map's theme, as the sidebar's marks go by the page's. */
      :root {
        --mc-route-casing: #ffffff;
        --mc-route-good: #0ca678;
        --mc-route-fair: #f08c00;
        --mc-route-poor: #e03131;
        --mc-route-unknown: #495057;
        --mc-pin-local: #9a5b00;

        --mc-route-good: #38d9a9;
        --mc-route-fair: #ffd43b;
        --mc-route-poor: #ff8787;
        --mc-route-unknown: #dee2e6;
        --mc-pin-local: #f0a63a;
        --mc-pin-direct: #38d9a9;
        --mc-pin-near: #4dabf7;
        --mc-pin-mid: #b197fc;
        --mc-pin-far: #a5aeb8;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]):not([data-map-theme="light"]) {
          --mc-route-casing: #0b0f14;
          --mc-route-good: #38d9a9;
          --mc-route-fair: #ffd43b;
          --mc-route-poor: #ff8787;
          --mc-route-unknown: #dee2e6;
          --mc-pin-local: #f0a63a;
          --mc-pin-direct: #38d9a9;
          --mc-pin-near: #4dabf7;
          --mc-pin-mid: #b197fc;
          --mc-pin-far: #a5aeb8;

      .leaflet-container { font: inherit; }

      /* The zoom buttons, rounded and raised like the legend. */

      .mc-dot { flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--mc-pin-far); }
      .mc-dot.local, .mc-pin.local { background: var(--mc-pin-local); }

      .mc-dot.near, .mc-pin.near { background: var(--mc-pin-near); }
      .mc-dot.mid, .mc-pin.mid { background: var(--mc-pin-mid); }
      /* A node on the map: a dot of its kind's colour, ringed in white and
         outlined in dark so that it stands out on light tiles and dark ones;

      .mc-pin {

        height: 100%;

      .mc-pin.role-base { --icon: url(/tabler-icons-3.51.0/icons/outline/home-signal.svg); }
      .map-legend .icon {

        background: var(--mc-muted);

      .map-legend .icon.router { --icon: url(/tabler-icons-3.51.0/icons/outline/building-broadcast-tower.svg); }
      .map-legend .icon.base { --icon: url(/tabler-icons-3.51.0/icons/outline/home-signal.svg); }
      .mc-card { display: grid; gap: 10px; min-width: 260px; }

      .composer .error { flex-basis: 100%; margin: 0; color: var(--mc-muted); font-size: 12px; }
      .composer .error:empty { display: none; }

      .welcome { max-width: 560px; }
      .welcome > p { color: var(--mc-muted); }
      /* The editor inside the welcome's card is not a card of its own. */
      .welcome .radio-editor { border: 0; padding: 0; background: none; }

      /*
       * A radio's button, as the list and the editor show it: the rail's own
       * look, or its colour in full, as when it is selected (--badge-on, and
       * --badge-on-ink for what is on it).

      .face {
        flex: none;

        font-weight: 700;
        font-size: 13px;

      .face.colored { background: var(--badge-on); border-color: var(--badge-on); color: var(--badge-on-ink); }
      .face .emoji { font-size: 20px; line-height: 1; font-weight: 400; }
      .face .pict, .rail-button .pict { display: flex; }
      .face .pict svg { width: 20px; height: 20px; }
      .face.big { width: 72px; height: 72px; border-radius: 20px; font-size: 22px; }

      /* The radios: their list, centred, the page's own. */
      .radios {

      .radio-row {

        border: 1px solid var(--mc-border);

      .radio-row.selected { border-color: var(--mc-primary); background: var(--mc-soft); }
      .radio-row.hidden .pick,
      .radio-row.hidden .face-button { opacity: 0.6; }
      .radio-row.dragging { opacity: 0.4; }
      .radio-row.over { border-style: dashed; border-color: var(--mc-primary); }
      .radio-row .grip { flex: none; display: flex; color: var(--mc-muted); cursor: grab; }
      .radio-row .grip svg { width: 16px; height: 16px; }
      .radio-row .moves { flex: none; display: flex; flex-direction: column; }
      .radio-row .moves button {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 22px;
        height: 18px;
        padding: 0;
        border: 0;
        background: transparent;
        color: var(--mc-muted);
      }
      .radio-row .moves button:hover:not(:disabled) { color: var(--mc-text); }

      .radio-row .moves svg { width: 14px; height: 14px; }
      .radio-row .face-button { flex: none; padding: 0; border: 0; border-radius: 12px; background: transparent; }
      .radio-row .face-button:hover .face { outline: 2px solid var(--mc-primary); outline-offset: 2px; }
      .radio-row .pick {
        flex: 1;
        min-width: 0;
        display: flex;
        align-items: center;
        padding: 0;
        border: 0;
        background: transparent;
        text-align: left;
      }
      .radio-row .who { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
      .radio-row .name { display: flex; align-items: center; gap: 8px; }
      .radio-row .who .mono { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .radio-row .badge { white-space: nowrap; font-size: 12px; font-weight: 400; }
      .radio-row .eye {
        flex: none;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 34px;
        height: 34px;
        padding: 0;
        background: transparent;
      }
      .radio-row .eye.off { color: var(--mc-muted); }
      .radio-row .eye svg { width: 18px; height: 18px; }
      .tag {
        padding: 0 6px;
        border-radius: 6px;
        background: var(--mc-raised);
        color: var(--mc-muted);
        font-size: 11px;
        font-weight: 400;
      }
      .switch {
        flex: none;
        position: relative;
        width: 40px;
        height: 22px;
        padding: 0;
        border: 0;
        border-radius: 11px;
        background: var(--mc-raised);
        box-shadow: inset 0 0 0 1px var(--mc-border);
      }
      .switch.on { background: var(--mc-primary); box-shadow: none; }
      .switch span {
        position: absolute;
        top: 3px;
        left: 3px;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #ffffff;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
        transition: left 0.15s;
      }
      .switch.on span { left: 21px; }

      /*
       * A radio's editor: over the list, in the middle of the window, or on
       * the welcome page by itself. Its two sections take the same room, so
       * that going from one to the other moves nothing.
       */
      .modal-back {
        position: fixed;
        inset: 0;
        z-index: 3000;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        background: rgba(0, 0, 0, 0.5);
      }
      .radio-editor {
        width: 500px;
        max-width: 100%;
        display: flex;
        flex-direction: column;
        gap: 16px;
        padding: 20px 24px;
        container-type: inline-size;
      }
      .radio-editor.modal {
        max-height: 100%;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
      }
      .editor-head { display: flex; align-items: center; gap: 14px; }
      .editor-head .face { width: 56px; height: 56px; border-radius: 16px; font-size: 18px; }
      .editor-head .face .emoji { font-size: 28px; }
      .editor-head .face .pict svg { width: 28px; height: 28px; }
      .editor-head .who { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
      .editor-head h2 { margin: 0; font-size: 16px; }
      .editor-head .mono { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .editor-head .close {
        flex: none;
        align-self: flex-start;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-left: auto;
        width: 32px;
        height: 32px;
        padding: 0;
        border: 0;
        background: transparent;
        color: var(--mc-muted);
      }
      .editor-head .close svg { width: 20px; height: 20px; }
      .editor-head .close:hover { color: var(--mc-text); background: var(--mc-raised); }
      /* Both sections in the same room; less, scrolling, in a short window. */
      /* Room on its sides for the fields' focus ring, which it would clip. */
      .editor-body {
        flex: 0 1 396px;
        height: 396px;
        min-height: 0;
        margin: 0 -4px;
        padding: 3px 4px;
        overflow-y: auto;
      }
      .radio-editor .fields,
      .button-look { display: flex; flex-direction: column; gap: 16px; }
      .radio-editor label,
      .radio-editor .field { display: grid; gap: 6px; align-content: start; }
      .radio-editor label > .dim,
      .radio-editor .field > .dim { font-size: 12px; }
      .radio-editor .hint { font-size: 12px; }
      .radio-editor .toggle { display: flex; align-items: center; gap: 10px; }
      .radio-editor .toggle > span { display: flex; flex-direction: column; }
      .radio-editor .toggle .dim { font-size: 12px; }
      /* Twelve in a row; two rows of six when the editor is narrow. */
      .swatches { display: grid; grid-template-columns: repeat(12, 32px); gap: 6px; }
      @container (max-width: 440px) {
        .swatches { grid-template-columns: repeat(6, 32px); gap: 8px; }
      }
      .swatch {
        width: 32px;
        height: 32px;
        padding: 0;
        border: 2px solid transparent;
        border-radius: 50%;
        background: var(--swatch);
        cursor: pointer;
      }
      .swatch:hover { border-color: var(--mc-muted); }
      .swatch.on { border-color: var(--mc-text); box-shadow: inset 0 0 0 2px var(--mc-surface); }
      /* None: the rail's own button at rest, and the accent selected. */
      .swatch.none {
        --swatch-rest: var(--mc-rail-button);
        --swatch: var(--mc-primary);
        border: 1px dashed var(--mc-muted);
      }
      /* Both of a colour's tones: at rest, top left; selected, bottom right. */
      .swatch.none,
      .swatch.split,
      .swatch.other.split {
        background: linear-gradient(135deg, var(--swatch-rest) 50%, var(--swatch) 50%);
        background-origin: border-box;
      }
      .swatch.none.on { border: 2px solid var(--mc-text); }
      /* Any other colour: the wheel until one is picked, then that one. */
      .swatch.other {
        position: relative;
        background: var(--swatch, conic-gradient(#f06595, #f0a63a, #a9e34b, #38d9a9, #4dabf7, #9775fa, #f06595));
        /* The wheel from the edge in, not tiled under its border. */
        background-origin: border-box;
      }
      .swatch.other input {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        padding: 0;
        border: 0;
        opacity: 0;
        cursor: pointer;
      }
      .gone { display: none !important; }
      /* A pill that slides under the option picked, of --n of them. */
      .segmented {
        position: relative;
        display: grid;
        grid-template-columns: repeat(var(--n, 3), minmax(0, 1fr));
        padding: 3px;
        border: 1px solid var(--mc-border);
        border-radius: 10px;
        background: var(--mc-surface-2);
      }
      .segmented::before {
        content: "";
        position: absolute;
        top: 3px;
        bottom: 3px;
        left: 3px;
        width: calc((100% - 6px) / var(--n, 3));
        border-radius: 7px;
        background: var(--mc-primary);
        transform: translateX(calc(var(--at, 0) * 100%));
        transition: transform 0.2s ease;
      }
      .segmented button {
        position: relative;
        min-height: 32px;
        padding: 0 12px;
        border: 0;
        background: transparent;
        color: var(--mc-muted);
        transition: color 0.2s;
      }
      .segmented button:hover { color: var(--mc-text); }
      .segmented button.on { color: var(--mc-on-primary); font-weight: 600; }
      /* What the button shows: one panel, the same size for the three. */
      .look-panel {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 240px;
        padding: 12px;
        border: 1px solid var(--mc-border);
        border-radius: 12px;
        background: var(--mc-surface-2);
      }
      .look-text {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        font-size: 12px;
      }
      .look-text input {
        width: 96px;
        height: 64px;
        text-align: center;
        font-weight: 700;
        font-size: 28px;
      }
      .look-emoji { align-self: stretch; flex: 1; min-height: 0; display: flex; }
      .look-emoji .emoji-picker {
        flex: 1;
        min-height: 0;
        max-width: none;
        padding: 0;
        border: 0;
        background: none;
      }
      .look-emoji .emoji-grid { flex: 1; min-height: 0; max-height: none; }
      .icon-grid { display: grid; grid-template-columns: repeat(8, 44px); gap: 6px; }
      .icon-grid button {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 44px;
        padding: 0;
        border: 1px solid transparent;
        border-radius: 10px;
        background: transparent;
      }
      .icon-grid button.on { border-color: var(--mc-primary); background: var(--mc-soft); }
      .icon-grid svg { width: 22px; height: 22px; }
      .radio-editor .error { color: var(--mc-danger); margin: 0; }
      .radio-editor .error:empty { display: none; }
      .radio-editor .buttons {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        padding-top: 16px;
        border-top: 1px solid var(--mc-border);
      }
      /* All the same width; removing it is apart from the rest, on the left. */
      .radio-editor .buttons button { min-width: 112px; }
      .radio-editor .buttons .danger { margin-right: auto; }

      /* The emoji picker: a search, the groups, and the emojis. */
      .emoji-picker {
        display: flex;
        flex-direction: column;
        gap: 8px;
        max-width: 520px;
        padding: 10px;
        border: 1px solid var(--mc-border);
        border-radius: 12px;
        background: var(--mc-surface-2);
      }
      .emoji-groups {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        padding-bottom: 8px;
        border-bottom: 1px solid var(--mc-border);
      }
      .emoji-groups button {
        width: 36px;
        height: 32px;
        padding: 0;
        border-color: transparent;
        background: transparent;
        font-size: 16px;
      }
      .emoji-groups button.on { border-color: var(--mc-primary); background: var(--mc-soft); }
      .emoji-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(36px, 1fr));
        gap: 2px;
        max-height: 200px;
        overflow-y: auto;
      }
      .emoji-grid button {
        height: 36px;
        padding: 0;
        border: 0;
        border-radius: 8px;
        background: transparent;
        font-size: 20px;
      }
      .emoji-grid button:hover { background: var(--mc-raised); }
      .emoji-grid button.on { background: var(--mc-soft); }
      .emoji-grid p { grid-column: 1 / -1; margin: 8px 0; }
    </style>
  </head>
