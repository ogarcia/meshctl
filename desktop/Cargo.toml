[package]
name = "meshctl-desktop"
description = "meshctl as a desktop app: a window over the daemon it runs within itself"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

# Left out of the workspace's default members and of its clippy run (see the
# workspace's Cargo.toml): it needs WebKitGTK on Linux and WebView2 on
# Windows, and only the desktop packages build it.

# The app is a library, which a phone's app loads, and the desktop's
# program runs.
[lib]
name = "meshctl_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The whole daemon, panel embedded, run within: the window is a page served
# by it on this machine alone, as any browser's would be.
meshctld = { path = "../server" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-deep-link = "2"
# The plugins' settings in tauri.conf.json come out of its macro as JSON.
serde_json = "1"
tokio = { workspace = true, features = ["macros", "net", "signal", "sync", "time"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "6"

# On a desktop: one app running at once, and its window as it was left.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-window-state = "2"

# On Android, the daemon run by the service, in Java, through JNI.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

# A tray with its menu where there is one: its words in the system's
# language.
[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
sys-locale = "0.3"

# No tray on Linux's desktops: kept running as a background app through the
# XDG portal instead, which the desktop lists and can stop.
[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", default-features = false, features = ["tokio", "background"] }
